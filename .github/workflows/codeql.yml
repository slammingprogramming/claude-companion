name: CodeQL

# The same scan GitHub's default setup ran (actions, Python and Rust, the default queries, weekly),
# as a workflow so that it can skip changes that only touch documents. The weekly run also catches
# problems that newer queries find in code that has not changed.
on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - README.md
      - NOTICE.md
      - THIRD_PARTY.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - SECURITY.md
      - SUPPORT.md
      - LICENSE
      - LICENSES/**
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - .github/CODEOWNERS
      - .github/FUNDING.yml
      - .github/dependabot.yml
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - README.md
      - NOTICE.md
      - THIRD_PARTY.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - SECURITY.md
      - SUPPORT.md
      - LICENSE
      - LICENSES/**
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - .github/CODEOWNERS
      - .github/FUNDING.yml
      - .github/dependabot.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
