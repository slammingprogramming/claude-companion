name: CI

# Only what the build, the tests or the shipped notes read starts a run. Documents, licence texts and
# GitHub's own community files cannot change a build, so changing only those runs nothing.
# CHANGELOG.md is not on the list: the app embeds it and CI checks it against the version.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - NOTICE.md
      - THIRD_PARTY.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - SECURITY.md
      - SUPPORT.md
      - LICENSE
      - LICENSES/**
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - .github/CODEOWNERS
      - .github/FUNDING.yml
      - .github/dependabot.yml
  pull_request:
    paths-ignore:
      - README.md
      - NOTICE.md
      - THIRD_PARTY.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - SECURITY.md
      - SUPPORT.md
      - LICENSE
      - LICENSES/**
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - .github/CODEOWNERS
      - .github/FUNDING.yml
      - .github/dependabot.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core + CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            crates/app -> ../../target
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: The app and the CLI have the same version, and the changelog covers it
        if: runner.os == 'Linux'
        run: |
          v() { sed -n 's/^version = "\(.*\)"/\1/p' "$1" | head -1; }
          test "$(v Cargo.toml)" = "$(v crates/app/Cargo.toml)"
          grep -q "^## $(v Cargo.toml) " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $(v Cargo.toml)"; exit 1; }

  msrv:
    name: CLI on Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo +1.89 build -p claude-companion

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libfontconfig-dev libssl-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev pkg-config
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            crates/app -> ../../target
      - run: cargo fmt --manifest-path crates/app/Cargo.toml --all --check
      - run: cargo app-clippy -- -D warnings
      - run: cargo app-test
      - run: cargo app-build
