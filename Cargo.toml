[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]
# The desktop app is a workspace of its own, so building or installing the command-line tool
# never downloads the GUI framework. Build it with `cargo app` (see .cargo/config.toml).
exclude = ["crates/app"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/slammingprogramming/claude-companion"
homepage = "https://github.com/slammingprogramming/claude-companion"
rust-version = "1.89"

[workspace.dependencies]
claude-companion-core = { path = "crates/core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "7"
libc = "0.2"
reflink-copy = "0.1"
rusty-leveldb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
uuid = { version = "1", default-features = false, features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
