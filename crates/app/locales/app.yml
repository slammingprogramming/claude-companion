"tools.sessions.detail":
  en: "The sessions Claude Code has on this computer, newest first, with the folder each worked in."
  zh-CN: "此电脑上 Claude Code 的会话，最新的在前，并显示各自的工作文件夹。"
  zh-TW: "此電腦上 Claude Code 的工作階段，最新的在前，並顯示各自的工作資料夾。"
  ja: "このコンピューター上の Claude Code のセッションを新しい順に、作業フォルダー付きで表示します。"
  ko: "이 컴퓨터의 Claude Code 세션을 최신순으로, 각각의 작업 폴더와 함께 보여 줍니다."
  fr: "Les sessions de Claude Code sur cet ordinateur, les plus récentes d’abord, avec le dossier de chacune."
  de: "Die Sitzungen von Claude Code auf diesem Computer, neueste zuerst, mit dem jeweiligen Ordner."
  es: "Las sesiones de Claude Code en este equipo, las más recientes primero, con la carpeta de cada una."
  pt-BR: "As sessões do Claude Code neste computador, das mais recentes às mais antigas, com a pasta de cada uma."
  ru: "Сессии Claude Code на этом компьютере, сначала новые, с папкой каждой."
  it: "Le sessioni che Claude Code ha su questo computer, dalla più recente, con la cartella in cui ha lavorato ciascuna."
  nl: "De sessies die Claude Code op deze computer heeft, nieuwste eerst, met de map waarin elk werkte."
  pl: "Sesje, które Claude Code ma na tym komputerze, od najnowszej, wraz z folderem, w którym każda pracowała."
  tr: "Claude Code’un bu bilgisayarda sahip olduğu oturumlar, en yenisi başta, her birinin çalıştığı klasörle birlikte."
  uk: "Сеанси, які Claude Code має на цьому комп’ютері, найновіші першими, з папкою, де кожен працював."
  sv: "Sessionerna Claude Code har på den här datorn, nyaste först, med mappen där var och en arbetade."
  da: "De sessioner, Claude Code har på denne computer, nyeste først, med den mappe, hver arbejdede i."
  nb: "Øktene Claude Code har på denne datamaskinen, nyeste først, med mappen hver jobbet i."
  fi: "Istunnot, jotka Claude Codella on tällä tietokoneella, uusin ensin, sekä kansio, jossa kukin työskenteli."
  cs: "Relace, které má Claude Code v tomto počítači, nejnovější první, se složkou, ve které každá pracovala."
  hu: "A Claude Code ezen a számítógépen lévő munkamenetei, a legújabbak elöl, azzal a mappával, amelyben mindegyik dolgozott."
  ro: "Sesiunile pe care le are Claude Code pe acest calculator, cele mai noi primele, cu dosarul în care a lucrat fiecare."
  el: "Οι συνεδρίες που έχει το Claude Code σε αυτόν τον υπολογιστή, οι νεότερες πρώτα, με τον φάκελο όπου εργαζόταν η καθεμία."
  id: "Sesi yang dimiliki Claude Code di komputer ini, terbaru dahulu, beserta folder tempat masing-masing bekerja."
  vi: "Các phiên mà Claude Code có trên máy tính này, mới nhất trước, kèm thư mục mà mỗi phiên làm việc."
  th: "เซสชันที่ Claude Code มีอยู่บนคอมพิวเตอร์เครื่องนี้ ใหม่สุดก่อน พร้อมโฟลเดอร์ที่แต่ละเซสชันทำงานอยู่"
  hi: "इस कंप्यूटर पर Claude Code के सत्र, सबसे नए पहले, साथ में वह फ़ोल्डर जिसमें हर एक ने काम किया।"
