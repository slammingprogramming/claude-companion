"switch.stopped":
  en: "Stopped waiting. Nothing changed."
  zh-CN: "已停止等待，什么都没改。"
  zh-TW: "已停止等待，什麼都沒改。"
  ja: "待つのをやめました。何も変更していません。"
  ko: "기다리기를 멈췄습니다. 아무것도 바뀌지 않았습니다."
  fr: "Attente arrêtée. Rien n’a changé."
  de: "Warten beendet. Nichts wurde geändert."
  es: "Se dejó de esperar. No cambió nada."
  pt-BR: "Parou de esperar. Nada mudou."
  ru: "Ожидание остановлено. Ничего не изменилось."
  it: "Attesa interrotta. Nulla è cambiato."
  nl: "Wachten gestopt. Er is niets gewijzigd."
  pl: "Przestano czekać. Nic się nie zmieniło."
  tr: "Bekleme durduruldu. Hiçbir şey değişmedi."
  uk: "Очікування зупинено. Нічого не змінено."
  sv: "Slutade vänta. Inget ändrades."
  da: "Stoppede med at vente. Intet blev ændret."
  nb: "Sluttet å vente. Ingenting ble endret."
  fi: "Odottaminen lopetettu. Mitään ei muutettu."
  cs: "Čekání zastaveno. Nic se nezměnilo."
  hu: "A várakozás leállt. Semmi sem változott."
  ro: "Așteptarea a fost oprită. Nu s-a schimbat nimic."
  el: "Η αναμονή σταμάτησε. Δεν άλλαξε τίποτα."
  id: "Berhenti menunggu. Tidak ada yang diubah."
  vi: "Đã ngừng chờ. Không có gì thay đổi."
  th: "เลิกรอแล้ว ไม่มีการเปลี่ยนแปลงใด ๆ"
  hi: "प्रतीक्षा रोक दी गई। कुछ नहीं बदला।"
"switch.stopped_after_work":
  en: "Stopped waiting. Nothing changed, but Claude still quits once its work is done, as you chose."
  zh-CN: "已停止等待，什么都没改。不过按你在 Claude 里的选择，它仍会在工作完成后退出。"
  zh-TW: "已停止等待，什麼都沒改。不過依照你在 Claude 裡的選擇，它仍會在工作完成後結束。"
  ja: "待つのをやめました。何も変更していませんが、選んだとおり Claude は作業が終わると終了します。"
  ko: "기다리기를 멈췄습니다. 바뀐 것은 없지만, 선택한 대로 Claude는 작업을 마치면 종료됩니다."
  fr: "Attente arrêtée. Rien n’a changé, mais Claude quittera quand même une fois son travail terminé, comme vous l’avez choisi."
  de: "Warten beendet. Nichts wurde geändert, aber Claude beendet sich wie gewählt trotzdem, sobald die Arbeit fertig ist."
  es: "Se dejó de esperar. No cambió nada, pero Claude se cerrará igualmente al terminar su trabajo, como elegiste."
  pt-BR: "Parou de esperar. Nada mudou, mas o Claude ainda vai fechar quando terminar o trabalho, como você escolheu."
  ru: "Ожидание остановлено. Ничего не изменилось, но Claude всё равно закроется, когда закончит работу, как вы выбрали."
  it: "Attesa interrotta. Nulla è cambiato, ma Claude esce comunque quando ha finito il lavoro, come hai scelto."
  nl: "Wachten gestopt. Er is niets gewijzigd, maar Claude sluit nog steeds af zodra het werk klaar is, zoals je hebt gekozen."
  pl: "Przestano czekać. Nic się nie zmieniło, ale Claude i tak zamknie się po zakończeniu pracy, tak jak wybrano."
  tr: "Bekleme durduruldu. Hiçbir şey değişmedi, ancak seçtiğiniz gibi Claude iş bitince yine de kapanacak."
  uk: "Очікування зупинено. Нічого не змінено, але Claude усе одно закриється, щойно завершиться робота, як ви й вибрали."
  sv: "Slutade vänta. Inget ändrades, men Claude avslutas ändå när arbetet är klart, som du valde."
  da: "Stoppede med at vente. Intet blev ændret, men Claude lukker stadig, så snart arbejdet er færdigt, som du valgte."
  nb: "Sluttet å vente. Ingenting ble endret, men Claude avsluttes likevel så snart arbeidet er ferdig, som du valgte."
  fi: "Odottaminen lopetettu. Mitään ei muutettu, mutta Claude sulkeutuu silti heti, kun työ on valmis, kuten valitsit."
  cs: "Čekání zastaveno. Nic se nezměnilo, ale Claude se stále ukončí, jakmile práce skončí, jak jste zvolili."
  hu: "A várakozás leállt. Semmi sem változott, de a Claude a választásod szerint így is kilép, amint a munka véget ér."
  ro: "Așteptarea a fost oprită. Nu s-a schimbat nimic, dar Claude se închide totuși imediat ce lucrul se termină, așa cum ai ales."
  el: "Η αναμονή σταμάτησε. Δεν άλλαξε τίποτα, αλλά το Claude θα κλείσει πάλι μόλις τελειώσει η εργασία, όπως επιλέξατε."
  id: "Berhenti menunggu. Tidak ada yang diubah, tetapi Claude tetap keluar begitu pekerjaan selesai, sesuai pilihan Anda."
  vi: "Đã ngừng chờ. Không có gì thay đổi, nhưng Claude vẫn thoát ngay khi công việc xong, như bạn đã chọn."
  th: "เลิกรอแล้ว ไม่มีการเปลี่ยนแปลงใด ๆ แต่ Claude จะยังปิดทันทีที่งานเสร็จ ตามที่คุณเลือก"
  hi: "प्रतीक्षा रोक दी गई। कुछ नहीं बदला, लेकिन आपके चुने अनुसार काम खत्म होते ही Claude फिर भी बंद हो जाएगा।"
