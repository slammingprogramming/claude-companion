"remove.body":
  en: "Claude Companion forgets the sign-in it keeps for this account. Its sessions stay. To add it back, sign in to it in Claude."
  zh-CN: "Claude Companion 会删除为这个账号保留的登录。会话都会保留；之后在 Claude 里登录它即可重新加入。"
  zh-TW: "Claude Companion 會刪除為這個帳號保留的登入。工作階段都會保留；之後在 Claude 裡登入它即可重新加入。"
  ja: "Claude Companion はこのアカウント用に保管しているサインインを削除します。セッションは残ります。Claude でサインインすると、また追加されます。"
  ko: "Claude Companion이 이 계정에 대해 보관한 로그인을 지웁니다. 세션은 그대로 남습니다. Claude에서 다시 로그인하면 목록에 다시 추가됩니다."
  fr: "Claude Companion oublie la connexion qu’il garde pour ce compte. Ses sessions restent. Pour le rajouter, connectez-vous-y dans Claude."
  de: "Claude Companion vergisst die für dieses Konto aufbewahrte Anmeldung. Die Sitzungen bleiben. Um es wieder hinzuzufügen, melde dich in Claude damit an."
  es: "Claude Companion olvida el inicio de sesión que guarda para esta cuenta. Las sesiones se quedan. Para volver a añadirla, inicia sesión con ella en Claude."
  pt-BR: "O Claude Companion esquece o login que guarda para esta conta. As sessões ficam. Para adicioná-la de novo, entre com ela no Claude."
  ru: "Claude Companion забудет сохранённый вход в этот аккаунт. Сессии останутся. Чтобы вернуть аккаунт, войдите в него в Claude."
  it: "Claude Companion dimentica l’accesso che conserva per questo account. Le sue sessioni restano. Per aggiungerlo di nuovo, accedi a Claude con questo account."
  nl: "Claude Companion vergeet de aanmelding die het voor dit account bewaart. De sessies blijven. Meld je in Claude aan bij het account om het weer toe te voegen."
  pl: "Claude Companion zapomina logowanie, które przechowuje dla tego konta. Jego sesje zostają. Aby dodać je ponownie, zaloguj się na nie w Claude."
  tr: "Claude Companion bu hesap için sakladığı oturumu unutur. Oturumları kalır. Yeniden eklemek için Claude’da bu hesapla oturum açın."
  uk: "Claude Companion забуває вхід, який зберігає для цього облікового запису. Його сеанси залишаються. Щоб додати його знову, увійдіть у Claude з цим обліковим записом."
  sv: "Claude Companion glömmer inloggningen den sparar för det här kontot. Dess sessioner blir kvar. Logga in i Claude med kontot för att lägga till det igen."
  da: "Claude Companion glemmer det login, det gemmer til denne konto. Dens sessioner bliver. Log ind i Claude med kontoen for at tilføje den igen."
  nb: "Claude Companion glemmer påloggingen den lagrer for denne kontoen. Øktene beholdes. Logg inn i Claude med kontoen for å legge den til igjen."
  fi: "Claude Companion unohtaa tälle tilille tallentamansa kirjautumisen. Sen istunnot säilyvät. Lisää tili uudelleen kirjautumalla Claudessa sillä."
  cs: "Claude Companion zapomene přihlášení, které pro tento účet uchovává. Jeho relace zůstanou. Chcete-li jej znovu přidat, přihlaste se tímto účtem v Claude."
  hu: "A Claude Companion elfelejti az ehhez a fiókhoz tárolt bejelentkezést. A munkamenetei megmaradnak. Az újbóli hozzáadáshoz jelentkezz be a Claude-ban a fiókkal."
  ro: "Claude Companion uită autentificarea pe care o păstrează pentru acest cont. Sesiunile lui rămân. Autentifică-te în Claude cu contul ca să îl adaugi din nou."
  el: "Το Claude Companion ξεχνά τη σύνδεση που κρατά για αυτόν τον λογαριασμό. Οι συνεδρίες του παραμένουν. Συνδεθείτε στο Claude με τον λογαριασμό για να τον προσθέσετε ξανά."
  id: "Claude Companion melupakan login yang disimpannya untuk akun ini. Sesinya tetap ada. Masuk ke Claude dengan akun itu untuk menambahkannya lagi."
  vi: "Claude Companion quên đăng nhập mà nó lưu cho tài khoản này. Các phiên của nó vẫn còn. Hãy đăng nhập Claude bằng tài khoản đó để thêm lại."
  th: "Claude Companion จะลืมการลงชื่อเข้าใช้ที่เก็บไว้สำหรับบัญชีนี้ เซสชันของบัญชียังอยู่ ลงชื่อเข้าใช้ Claude ด้วยบัญชีนั้นเพื่อเพิ่มกลับ"
  hi: "Claude Companion इस खाते के लिए रखा गया साइन-इन भूल जाता है। उसके सत्र बने रहते हैं। उसे फिर जोड़ने के लिए Claude में उस खाते से साइन इन करें।"
