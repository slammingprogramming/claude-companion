"settings.auto_update.detail":
  en: "Downloads in the background and installs when the window is closed or Claude Companion quits."
  zh-CN: "在后台下载，关闭窗口或退出 Claude Companion 时安装。"
  zh-TW: "在背景下載，關閉視窗或結束 Claude Companion 時安裝。"
  ja: "バックグラウンドでダウンロードし、ウインドウを閉じたときか Claude Companion を終了したときにインストールします。"
  ko: "백그라운드에서 다운로드하고, 창을 닫거나 Claude Companion를 종료할 때 설치합니다."
  fr: "Téléchargement en arrière-plan, installation à la fermeture de la fenêtre ou en quittant Claude Companion."
  de: "Lädt im Hintergrund und installiert, wenn das Fenster geschlossen oder Claude Companion beendet wird."
  es: "Se descargan en segundo plano y se instalan al cerrar la ventana o salir de Claude Companion."
  pt-BR: "Baixa em segundo plano e instala ao fechar a janela ou sair do Claude Companion."
  ru: "Загружает в фоне и устанавливает, когда окно закрыто или Claude Companion завершает работу."
  it: "Scarica in background e installa quando la finestra viene chiusa o Claude Companion esce."
  nl: "Downloadt op de achtergrond en installeert wanneer het venster wordt gesloten of Claude Companion stopt."
  pl: "Pobiera w tle i instaluje po zamknięciu okna lub zakończeniu Claude Companion."
  tr: "Arka planda indirir ve pencere kapandığında veya Claude Companion’dan çıkıldığında yükler."
  uk: "Завантажує у фоні й встановлює, коли вікно закривається або Claude Companion завершує роботу."
  sv: "Laddar ned i bakgrunden och installerar när fönstret stängs eller Claude Companion avslutas."
  da: "Henter i baggrunden og installerer, når vinduet lukkes, eller Claude Companion afsluttes."
  nb: "Laster ned i bakgrunnen og installerer når vinduet lukkes eller Claude Companion avsluttes."
  fi: "Lataa taustalla ja asentaa, kun ikkuna suljetaan tai Claude Companion lopetetaan."
  cs: "Stahuje na pozadí a instaluje po zavření okna nebo ukončení Claude Companion."
  hu: "A háttérben letölt, és az ablak bezárásakor vagy a Claude Companionból való kilépéskor telepít."
  ro: "Descarcă în fundal și instalează la închiderea ferestrei sau la ieșirea din Claude Companion."
  el: "Κάνει λήψη στο παρασκήνιο και εγκαθιστά όταν κλείσει το παράθυρο ή τερματιστεί το Claude Companion."
  id: "Mengunduh di latar belakang dan memasang saat jendela ditutup atau Claude Companion keluar."
  vi: "Tải ở chế độ nền và cài khi cửa sổ đóng hoặc Claude Companion thoát."
  th: "ดาวน์โหลดเบื้องหลังและติดตั้งเมื่อปิดหน้าต่างหรือออกจาก Claude Companion"
  hi: "बैकग्राउंड में डाउनलोड करता है और विंडो बंद होने या Claude Companion से बाहर निकलने पर इंस्टॉल करता है।"
