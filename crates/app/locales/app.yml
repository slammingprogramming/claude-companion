"settings.notifications.detail":
  en: "Tell me when Claude needs a restart to show copied sessions."
  zh-CN: "Claude 需要重启才能显示复制过去的会话时提醒我。"
  zh-TW: "Claude 需要重新啟動才能顯示複製過去的工作階段時提醒我。"
  ja: "コピーしたセッションの表示に Claude の再起動が必要なときに知らせます。"
  ko: "복사한 세션을 보려면 Claude를 다시 시작해야 할 때 알려 줍니다."
  fr: "Me prévenir quand Claude doit redémarrer pour afficher les sessions copiées."
  de: "Benachrichtigen, wenn Claude für kopierte Sitzungen neu gestartet werden muss."
  es: "Avisarme cuando Claude necesite reiniciarse para mostrar las sesiones copiadas."
  pt-BR: "Avisar quando o Claude precisar reiniciar para mostrar as sessões copiadas."
  ru: "Сообщать, когда Claude нужно перезапустить, чтобы показать скопированные сессии."
  it: "Avvisami quando Claude deve essere riavviato per mostrare le sessioni copiate."
  nl: "Laat me weten wanneer Claude opnieuw moet starten om gekopieerde sessies te tonen."
  pl: "Powiadom mnie, gdy Claude wymaga ponownego uruchomienia, aby pokazać skopiowane sesje."
  tr: "Kopyalanan oturumları göstermek için Claude’un yeniden başlaması gerektiğinde bana haber ver."
  uk: "Повідомляти, коли Claude потрібно перезапустити, щоб показати скопійовані сеанси."
  sv: "Säg till när Claude behöver startas om för att visa kopierade sessioner."
  da: "Giv mig besked, når Claude skal genstartes for at vise kopierede sessioner."
  nb: "Si fra når Claude må startes på nytt for å vise kopierte økter."
  fi: "Kerro, kun Claude on käynnistettävä uudelleen kopioitujen istuntojen näyttämiseksi."
  cs: "Upozornit, když je potřeba Claude restartovat, aby zobrazil zkopírované relace."
  hu: "Szólj, ha a Claude-ot újra kell indítani a másolt munkamenetek megjelenítéséhez."
  ro: "Anunță-mă când Claude trebuie repornit ca să arate sesiunile copiate."
  el: "Ειδοποίησέ με όταν το Claude χρειάζεται επανεκκίνηση για να εμφανίσει τις αντιγραμμένες συνεδρίες."
  id: "Beri tahu saya saat Claude perlu dimulai ulang untuk menampilkan sesi yang disalin."
  vi: "Báo cho tôi khi Claude cần khởi động lại để hiện các phiên đã sao chép."
  th: "แจ้งฉันเมื่อต้องเริ่ม Claude ใหม่เพื่อแสดงเซสชันที่คัดลอก"
  hi: "जब कॉपी किए गए सत्र दिखाने के लिए Claude को फिर से शुरू करना पड़े, तब मुझे बताएँ।"
