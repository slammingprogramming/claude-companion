"tools.codesettings.detail":
  en: "Show Claude Code’s user settings (secrets are hidden), or set its default permission mode. Any other setting: `claude-companion code settings` on the command line."
  zh-CN: "显示 Claude Code 的用户设置（隐藏密钥），或设置默认权限模式。其他设置请在命令行使用 `claude-companion code settings`。"
  zh-TW: "顯示 Claude Code 的使用者設定（隱藏金鑰），或設定預設權限模式。其他設定請在命令列使用 `claude-companion code settings`。"
  ja: "Claude Code のユーザー設定を表示するか（秘密は非表示）、既定の権限モードを設定します。その他の設定はコマンドラインの `claude-companion code settings` で。"
  ko: "Claude Code의 사용자 설정을 표시하거나(비밀 값은 숨김) 기본 권한 모드를 설정합니다. 다른 설정은 명령줄의 `claude-companion code settings`를 사용하세요."
  fr: "Affiche les réglages utilisateur de Claude Code (secrets masqués) ou définit son mode d’autorisation par défaut. Autres réglages : `claude-companion code settings` en ligne de commande."
  de: "Zeigt die Benutzereinstellungen von Claude Code (Geheimnisse verborgen) oder setzt den Standard-Berechtigungsmodus. Weitere Einstellungen: `claude-companion code settings` auf der Kommandozeile."
  es: "Muestra los ajustes de usuario de Claude Code (secretos ocultos) o fija su modo de permisos predeterminado. Otros ajustes: `claude-companion code settings` en la línea de comandos."
  pt-BR: "Mostra as configurações de usuário do Claude Code (segredos ocultos) ou define o modo de permissão padrão. Outras configurações: `claude-companion code settings` na linha de comando."
  ru: "Показывает пользовательские настройки Claude Code (секреты скрыты) или задаёт режим разрешений по умолчанию. Остальное: `claude-companion code settings` в терминале."
  it: "Mostra le impostazioni utente di Claude Code (i segreti sono nascosti) o imposta la sua modalità di autorizzazione predefinita. Per ogni altra impostazione: `claude-companion code settings` dalla riga di comando."
  nl: "Toon de gebruikersinstellingen van Claude Code (geheimen zijn verborgen), of stel de standaardmachtigingsmodus in. Elke andere instelling: `claude-companion code settings` op de opdrachtregel."
  pl: "Pokaż ustawienia użytkownika Claude Code (sekrety są ukryte) lub ustaw jego domyślny tryb uprawnień. Każde inne ustawienie: `claude-companion code settings` w wierszu poleceń."
  tr: "Claude Code kullanıcı ayarlarını gösterin (gizli bilgiler gizlenir) veya varsayılan izin modunu belirleyin. Diğer her ayar: komut satırında `claude-companion code settings`."
  uk: "Покажіть параметри користувача Claude Code (секрети приховано) або встановіть режим дозволів за замовчуванням. Будь-який інший параметр: `claude-companion code settings` у командному рядку."
  sv: "Visa Claude Codes användarinställningar (hemligheter döljs) eller ange standardbehörighetsläget. Alla andra inställningar: `claude-companion code settings` på kommandoraden."
  da: "Vis Claude Codes brugerindstillinger (hemmeligheder skjules), eller angiv standardtilladelsestilstanden. Alle andre indstillinger: `claude-companion code settings` på kommandolinjen."
  nb: "Vis Claude Codes brukerinnstillinger (hemmeligheter skjules), eller angi standard tillatelsesmodus. Alle andre innstillinger: `claude-companion code settings` på kommandolinjen."
  fi: "Näytä Claude Coden käyttäjäasetukset (salaisuudet piilotetaan) tai aseta oletusoikeustila. Kaikki muut asetukset: `claude-companion code settings` komentorivillä."
  cs: "Zobrazte uživatelské nastavení Claude Code (tajné údaje jsou skryté) nebo nastavte výchozí režim oprávnění. Jakékoli jiné nastavení: `claude-companion code settings` na příkazovém řádku."
  hu: "Mutasd a Claude Code felhasználói beállításait (a titkok el vannak rejtve), vagy állítsd be az alapértelmezett engedélymódot. Minden más beállítás: `claude-companion code settings` a parancssorban."
  ro: "Afișează setările de utilizator ale Claude Code (secretele sunt ascunse) sau stabilește modul implicit de permisiuni. Orice altă setare: `claude-companion code settings` în linia de comandă."
  el: "Εμφανίστε τις ρυθμίσεις χρήστη του Claude Code (τα μυστικά αποκρύπτονται) ή ορίστε την προεπιλεγμένη λειτουργία αδειών. Οποιαδήποτε άλλη ρύθμιση: `claude-companion code settings` στη γραμμή εντολών."
  id: "Tampilkan pengaturan pengguna Claude Code (rahasia disembunyikan), atau tetapkan mode izin default. Pengaturan lain: `claude-companion code settings` di baris perintah."
  vi: "Hiện cài đặt người dùng của Claude Code (bí mật được ẩn), hoặc đặt chế độ quyền mặc định. Mọi cài đặt khác: `claude-companion code settings` trên dòng lệnh."
  th: "แสดงการตั้งค่าผู้ใช้ของ Claude Code (ข้อมูลลับถูกซ่อนไว้) หรือตั้งโหมดสิทธิ์เริ่มต้น การตั้งค่าอื่น ๆ: `claude-companion code settings` ในบรรทัดคำสั่ง"
  hi: "Claude Code की उपयोगकर्ता सेटिंग दिखाएँ (गोपनीय जानकारी छिपी रहती है), या डिफ़ॉल्ट अनुमति मोड सेट करें। कोई भी अन्य सेटिंग: कमांड लाइन पर `claude-companion code settings`।"
