"tools.code.detail":
  en: "Open Claude Code in a new terminal window, or continue a recent terminal session where it left off."
  zh-CN: "在新的终端窗口中打开 Claude Code，或从上次中断的地方继续最近的终端会话。"
  zh-TW: "在新的終端機視窗中開啟 Claude Code，或從上次中斷的地方繼續最近的終端機工作階段。"
  ja: "新しいターミナルウィンドウで Claude Code を開くか、最近のターミナルセッションを続きから再開します。"
  ko: "새 터미널 창에서 Claude Code를 열거나, 최근 터미널 세션을 중단한 곳부터 이어갑니다."
  fr: "Ouvre Claude Code dans une nouvelle fenêtre de terminal, ou reprend une session de terminal récente là où elle s’est arrêtée."
  de: "Öffnet Claude Code in einem neuen Terminalfenster oder setzt eine frühere Terminal-Sitzung dort fort, wo sie endete."
  es: "Abre Claude Code en una nueva ventana de terminal, o continúa una sesión de terminal reciente donde se quedó."
  pt-BR: "Abre o Claude Code em uma nova janela de terminal ou continua uma sessão recente de onde parou."
  ru: "Открывает Claude Code в новом окне терминала или продолжает недавнюю сессию с того места, где она остановилась."
  it: "Apri Claude Code in una nuova finestra del terminale, oppure riprendi una sessione recente del terminale da dove l’avevi lasciata."
  nl: "Open Claude Code in een nieuw terminalvenster, of zet een recente terminalsessie voort waar je gebleven was."
  pl: "Otwórz Claude Code w nowym oknie terminala albo kontynuuj niedawną sesję terminala od miejsca, w którym została przerwana."
  tr: "Claude Code’u yeni bir terminal penceresinde açın veya yakın tarihli bir terminal oturumuna kaldığı yerden devam edin."
  uk: "Відкрийте Claude Code в новому вікні терміналу або продовжте нещодавній сеанс терміналу з місця, де зупинилися."
  sv: "Öppna Claude Code i ett nytt terminalfönster eller fortsätt en nyligen använd terminalsession där du slutade."
  da: "Åbn Claude Code i et nyt terminalvindue, eller fortsæt en nylig terminalsession, hvor du slap."
  nb: "Åpne Claude Code i et nytt terminalvindu, eller fortsett en nylig terminaløkt der du slapp."
  fi: "Avaa Claude Code uudessa pääteikkunassa tai jatka viimeaikaista pääteistuntoa siitä, mihin jäit."
  cs: "Otevřete Claude Code v novém okně terminálu, nebo pokračujte v nedávné relaci terminálu tam, kde jste skončili."
  hu: "Nyisd meg a Claude Code-ot új terminálablakban, vagy folytass egy friss terminálmunkamenetet ott, ahol abbahagytad."
  ro: "Deschide Claude Code într-o fereastră nouă de terminal sau continuă o sesiune recentă de terminal de unde ai rămas."
  el: "Ανοίξτε το Claude Code σε νέο παράθυρο τερματικού ή συνεχίστε μια πρόσφατη συνεδρία τερματικού από εκεί που μείνατε."
  id: "Buka Claude Code di jendela terminal baru, atau lanjutkan sesi terminal terbaru dari tempat Anda berhenti."
  vi: "Mở Claude Code trong cửa sổ terminal mới, hoặc tiếp tục một phiên terminal gần đây từ chỗ bạn dừng."
  th: "เปิด Claude Code ในหน้าต่างเทอร์มินัลใหม่ หรือทำเซสชันเทอร์มินัลล่าสุดต่อจากที่ค้างไว้"
  hi: "Claude Code को नई टर्मिनल विंडो में खोलें, या हाल का टर्मिनल सत्र वहीं से जारी रखें जहाँ आपने छोड़ा था।"
