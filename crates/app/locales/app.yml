"notice.retention.one":
  en: "Claude Code deletes the transcripts of your Claude Desktop sessions after %{count} day, and a session opens empty without one."
  fr: "Claude Code supprime les transcriptions de vos sessions Claude Desktop après %{count} jour, et une session s’ouvre vide sans la sienne."
  de: "Claude Code löscht die Transkripte deiner Sitzungen in Claude Desktop nach %{count} Tag, und ohne Transkript öffnet sich eine Sitzung leer."
  es: "Claude Code borra las transcripciones de tus sesiones de Claude Desktop tras %{count} día, y una sesión sin la suya se abre vacía."
  pt-BR: "O Claude Code apaga as transcrições das suas sessões do Claude Desktop após %{count} dia, e uma sessão sem a sua abre vazia."
  ru: "Claude Code удаляет записи бесед ваших сессий Claude Desktop через %{count} день, а без записи сессия открывается пустой."
  it: "Claude Code elimina le trascrizioni delle tue sessioni di Claude Desktop dopo %{count} giorno e, senza di esse, una sessione si apre vuota."
  nl: "Claude Code verwijdert de transcripties van je Claude Desktop-sessies na %{count} dag, en zonder transcriptie opent een sessie leeg."
  pl: "Claude Code usuwa zapisy rozmów z Twoich sesji Claude Desktop po %{count} dniu, a sesja bez zapisu otwiera się pusta."
  tr: "Claude Code, Claude Desktop oturumlarınızın dökümlerini %{count} gün sonra siler ve dökümü olmayan bir oturum boş açılır."
  uk: "Claude Code видаляє стенограми ваших сеансів Claude Desktop через %{count} день, а сеанс без стенограми відкривається порожнім."
  sv: "Claude Code raderar utskrifterna av dina Claude Desktop-sessioner efter %{count} dag, och en session utan utskrift öppnas tom."
  da: "Claude Code sletter udskrifterne af dine Claude Desktop-sessioner efter %{count} dag, og en session uden udskrift åbner tom."
  nb: "Claude Code sletter utskriftene av Claude Desktop-øktene dine etter %{count} dag, og en økt uten utskrift åpnes tom."
  fi: "Claude Code poistaa Claude Desktop -istuntojesi tekstitallenteet %{count} päivän jälkeen, ja istunto ilman tallennetta avautuu tyhjänä."
  cs: "Claude Code maže přepisy vašich relací Claude Desktop po %{count} dni a relace bez přepisu se otevře prázdná."
  hu: "A Claude Code %{count} nap után törli a Claude Desktop-munkameneteid átiratait, az átirat nélküli munkamenet pedig üresen nyílik meg."
  ro: "Claude Code șterge transcrierile sesiunilor tale Claude Desktop după %{count} zi, iar o sesiune fără transcriere se deschide goală."
  el: "Το Claude Code διαγράφει τις μεταγραφές των συνεδριών σας στο Claude Desktop μετά από %{count} ημέρα και μια συνεδρία χωρίς μεταγραφή ανοίγει κενή."
  hi: "Claude Code आपके Claude Desktop सत्रों की ट्रांसक्रिप्ट %{count} दिन बाद हटा देता है, और बिना ट्रांसक्रिप्ट वाला सत्र खाली खुलता है।"
