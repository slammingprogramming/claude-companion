"settings.tray.detail":
  en: "Status and the background switch at a glance, even with this window closed."
  zh-CN: "随时查看状态、切换后台同步，关掉窗口也可以。"
  zh-TW: "隨時查看狀態、切換背景同步，關掉視窗也可以。"
  ja: "ウインドウを閉じていても、状態の確認とバックグラウンド同期の切り替えができます。"
  ko: "창을 닫아도 상태를 확인하고 백그라운드 동기화를 전환할 수 있습니다."
  fr: "L’état et l’interrupteur d’arrière-plan d’un coup d’œil, même fenêtre fermée."
  de: "Status und Hintergrund-Schalter auf einen Blick, auch bei geschlossenem Fenster."
  es: "El estado y el interruptor de segundo plano de un vistazo, incluso con esta ventana cerrada."
  pt-BR: "Status e o botão de segundo plano à mão, mesmo com esta janela fechada."
  ru: "Состояние и фоновая синхронизация под рукой, даже когда окно закрыто."
  it: "Stato e interruttore in background a colpo d’occhio, anche con questa finestra chiusa."
  nl: "Status en de achtergrondschakelaar in één oogopslag, ook als dit venster gesloten is."
  pl: "Stan i przełącznik pracy w tle na pierwszy rzut oka, nawet gdy to okno jest zamknięte."
  tr: "Bu pencere kapalıyken bile durumu ve arka plan anahtarını tek bakışta görün."
  uk: "Стан і перемикач фонової роботи одним поглядом, навіть коли це вікно закрито."
  sv: "Status och bakgrundsomkopplaren med en blick, även när det här fönstret är stängt."
  da: "Status og baggrundskontakten med et blik, også når dette vindue er lukket."
  nb: "Status og bakgrunnsbryteren med et blikk, selv når dette vinduet er lukket."
  fi: "Tila ja taustakytkin yhdellä silmäyksellä, vaikka tämä ikkuna olisi suljettu."
  cs: "Stav a přepínač pozadí na první pohled, i když je toto okno zavřené."
  hu: "Az állapot és a háttérkapcsoló egy pillantásra, akkor is, ha ez az ablak be van zárva."
  ro: "Starea și comutatorul de fundal dintr-o privire, chiar și cu această fereastră închisă."
  el: "Η κατάσταση και ο διακόπτης παρασκηνίου με μια ματιά, ακόμη και με κλειστό αυτό το παράθυρο."
  id: "Status dan sakelar latar belakang sekilas, bahkan saat jendela ini ditutup."
  vi: "Trạng thái và công tắc nền trong nháy mắt, kể cả khi cửa sổ này đã đóng."
  th: "ดูสถานะและสวิตช์เบื้องหลังได้ในพริบตา แม้ปิดหน้าต่างนี้อยู่"
  hi: "स्थिति और बैकग्राउंड स्विच एक नज़र में, यह विंडो बंद होने पर भी।"
