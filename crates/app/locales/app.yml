"quit.after_work":
  en: "Claude quits once its work in progress is done, and Claude Companion carries on then."
  zh-CN: "Claude 会在进行中的工作完成后退出，Claude Companion 随后继续。"
  zh-TW: "Claude 會在進行中的工作完成後結束，Claude Companion 隨後繼續。"
  ja: "Claude は進行中の作業が終わってから終了し、そのあと Claude Companion が続けます。"
  ko: "Claude는 진행 중인 작업을 마친 뒤 종료되고, 그다음 Claude Companion이 이어서 진행합니다."
  fr: "Claude quittera une fois le travail en cours terminé, puis Claude Companion prendra le relais."
  de: "Claude beendet sich, sobald die laufende Arbeit fertig ist; dann macht Claude Companion weiter."
  es: "Claude se cerrará cuando termine el trabajo en curso y entonces Claude Companion continuará."
  pt-BR: "O Claude vai fechar quando terminar o trabalho em andamento, e então o Claude Companion continua."
  ru: "Claude закроется, когда закончит текущую работу, и тогда Claude Companion продолжит."
  it: "Claude esce quando ha finito il lavoro in corso, poi Claude Companion prosegue."
  nl: "Claude sluit af zodra het lopende werk klaar is, en Claude Companion gaat dan verder."
  pl: "Claude zamknie się po zakończeniu trwającej pracy, a Claude Companion wtedy będzie kontynuować."
  tr: "Claude, devam eden iş bitince kapanacak ve Claude Companion sonra devam edecek."
  uk: "Claude закриється, щойно завершиться поточна робота, і тоді Claude Companion продовжить."
  sv: "Claude avslutas när det pågående arbetet är klart, och Claude Companion fortsätter då."
  da: "Claude lukker, så snart det igangværende arbejde er færdigt, og Claude Companion fortsætter derefter."
  nb: "Claude avsluttes så snart det pågående arbeidet er ferdig, og Claude Companion fortsetter deretter."
  fi: "Claude sulkeutuu heti, kun käynnissä oleva työ on valmis, ja Claude Companion jatkaa sen jälkeen."
  cs: "Claude se ukončí, jakmile skončí probíhající práce, a Claude Companion potom pokračuje."
  hu: "A Claude kilép, amint a folyamatban lévő munka véget ér, és a Claude Companion utána folytatja."
  ro: "Claude se închide imediat ce lucrul în curs se termină, iar Claude Companion continuă apoi."
  el: "Το Claude κλείνει μόλις τελειώσει η εργασία που τρέχει και το Claude Companion συνεχίζει μετά."
  id: "Claude keluar begitu pekerjaan yang sedang berjalan selesai, lalu Claude Companion melanjutkan."
  vi: "Claude thoát ngay khi công việc đang chạy xong, và Claude Companion sẽ tiếp tục sau đó."
  th: "Claude จะปิดทันทีที่งานที่กำลังทำอยู่เสร็จ แล้ว Claude Companion จะทำต่อ"
  hi: "चल रहा काम खत्म होते ही Claude बंद हो जाएगा, और फिर Claude Companion आगे बढ़ेगा।"
