"reset.hint":
  en: "Pick the day and enter the time the weekly limit resets to see how long is left. Leave the time empty to stop."
  zh-CN: "选好星期几并填写每周额度的重置时间，就会显示距离重置还剩多久。时间留空即不显示。"
  zh-TW: "選好星期幾並填寫每週額度的重置時間，就會顯示距離重置還剩多久。時間留空即不顯示。"
  ja: "曜日を選んで週間上限のリセット時刻を入力すると、リセットまでの残り時間を表示します。時刻を空にすると表示しません。"
  ko: "요일을 고르고 주간 한도가 초기화되는 시각을 입력하면 남은 시간이 표시됩니다. 시각을 비워 두면 표시하지 않습니다."
  fr: "Choisissez le jour et l’heure où la limite hebdomadaire se réinitialise pour voir le temps restant. Laissez l’heure vide pour ne plus l’afficher."
  de: "Wählen Sie Tag und Uhrzeit, zu der das Wochenlimit zurückgesetzt wird, um die verbleibende Zeit zu sehen. Leere Uhrzeit blendet sie aus."
  es: "Elige el día y la hora en que se reinicia el límite semanal para ver cuánto falta. Deja la hora vacía para no mostrarlo."
  pt-BR: "Escolha o dia e a hora em que o limite semanal renova para ver quanto falta. Deixe a hora vazia para não mostrar."
  ru: "Выберите день и время сброса недельного лимита, чтобы видеть, сколько осталось. Оставьте время пустым, чтобы не показывать."
  it: "Scegli il giorno e inserisci l’ora in cui si azzera il limite settimanale per vedere quanto manca. Lascia vuota l’ora per disattivare."
  nl: "Kies de dag en voer de tijd in waarop de weeklimiet wordt gereset om te zien hoeveel tijd er nog is. Laat de tijd leeg om te stoppen."
  pl: "Wybierz dzień i wpisz godzinę resetu limitu tygodniowego, aby zobaczyć, ile zostało. Zostaw godzinę pustą, aby wyłączyć."
  tr: "Haftalık sınırın sıfırlandığı günü seçin ve saati girin; ne kadar kaldığını görürsünüz. Durdurmak için saati boş bırakın."
  uk: "Виберіть день і введіть час, коли скидається тижневий ліміт, щоб бачити, скільки лишилося. Залиште час порожнім, щоб вимкнути."
  sv: "Välj dagen och ange klockslaget då veckogränsen återställs för att se hur lång tid som återstår. Lämna klockslaget tomt för att sluta."
  da: "Vælg dagen og angiv klokkeslættet, hvor ugegrænsen nulstilles, for at se, hvor lang tid der er tilbage. Lad klokkeslættet stå tomt for at stoppe."
  nb: "Velg dagen og oppgi klokkeslettet da ukegrensen tilbakestilles for å se hvor mye tid som er igjen. La klokkeslettet stå tomt for å slutte."
  fi: "Valitse päivä ja anna kellonaika, jolloin viikkoraja nollautuu, nähdäksesi kuinka paljon aikaa on jäljellä. Jätä kellonaika tyhjäksi lopettaaksesi."
  cs: "Vyberte den a zadejte čas, kdy se týdenní limit resetuje, abyste viděli, kolik času zbývá. Chcete-li přestat, nechte čas prázdný."
  hu: "Válaszd ki a napot, és add meg az időpontot, amikor a heti korlát visszaáll, hogy lásd, mennyi idő van hátra. Hagyd üresen az időpontot a leállításhoz."
  ro: "Alege ziua și introdu ora la care se resetează limita săptămânală, ca să vezi cât timp a rămas. Lasă ora goală pentru a opri."
  el: "Επιλέξτε την ημέρα και εισαγάγετε την ώρα που μηδενίζεται το εβδομαδιαίο όριο, για να δείτε πόσος χρόνος απομένει. Αφήστε την ώρα κενή για διακοπή."
  id: "Pilih hari dan masukkan jam saat batas mingguan direset untuk melihat sisa waktunya. Kosongkan jam untuk berhenti."
  vi: "Chọn ngày và nhập giờ giới hạn tuần được đặt lại để xem còn bao nhiêu thời gian. Để trống giờ để dừng."
  th: "เลือกวันและใส่เวลาที่ขีดจำกัดรายสัปดาห์รีเซ็ตเพื่อดูว่าเหลือเวลาเท่าใด เว้นเวลาว่างไว้เพื่อหยุด"
  hi: "दिन चुनें और वह समय डालें जब साप्ताहिक सीमा रीसेट होती है, ताकि देख सकें कि कितना समय बचा है। रोकने के लिए समय खाली छोड़ें।"
