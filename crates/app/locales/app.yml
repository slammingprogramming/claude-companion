  sv: "Den här kopian av Claude Companion kan inte uppdatera sig själv. Ladda ned den nya versionen i stället."
  da: "Denne kopi af Claude Companion kan ikke opdatere sig selv. Hent den nye version i stedet."
  nb: "Denne kopien av Claude Companion kan ikke oppdatere seg selv. Last ned den nye versjonen i stedet."
  fi: "Tämä Claude Companion -kopio ei voi päivittää itseään. Lataa uusi versio sen sijaan."
  cs: "Tato kopie Claude Companion se nemůže sama aktualizovat. Stáhněte místo toho novou verzi."
  hu: "A Claude Companion ezen példánya nem tudja frissíteni önmagát. Töltsd le helyette az új verziót."
  ro: "Această copie a Claude Companion nu se poate actualiza singură. Descarcă în schimb noua versiune."
  el: "Αυτό το αντίγραφο του Claude Companion δεν μπορεί να ενημερωθεί μόνο του. Κάντε λήψη της νέας έκδοσης."
  id: "Salinan Claude Companion ini tidak dapat memperbarui dirinya sendiri. Unduh versi baru sebagai gantinya."
  vi: "Bản sao Claude Companion này không thể tự cập nhật. Hãy tải phiên bản mới."
  th: "Claude Companion ชุดนี้อัปเดตตัวเองไม่ได้ โปรดดาวน์โหลดเวอร์ชันใหม่แทน"
  hi: "Claude Companion की यह प्रति खुद को अपडेट नहीं कर सकती। इसके बजाय नया संस्करण डाउनलोड करें।"
"update.problem.translocated":
  en: "Move Claude Companion to the Applications folder, then try again."
  zh-CN: "请先把 Claude Companion 移到“应用程序”文件夹，再重试。"
  zh-TW: "請先將 Claude Companion 移到「應用程式」檔案夾，再試一次。"
  ja: "Claude Companion を「アプリケーション」フォルダに移動してから、もう一度お試しください。"
  ko: "Claude Companion를 응용 프로그램 폴더로 옮긴 다음 다시 시도하세요."
  fr: "Placez Claude Companion dans le dossier Applications, puis réessayez."
  de: "Bewege Claude Companion in den Ordner „Programme“ und versuche es erneut."
  es: "Mueve Claude Companion a la carpeta Aplicaciones y vuelve a intentarlo."
  pt-BR: "Mova o Claude Companion para a pasta Aplicativos e tente de novo."
  ru: "Переместите Claude Companion в папку «Программы» и попробуйте снова."
  it: "Sposta Claude Companion nella cartella Applicazioni, poi riprova."
  nl: "Verplaats Claude Companion naar de map Programma’s en probeer het opnieuw."
  pl: "Przenieś Claude Companion do folderu Programy i spróbuj ponownie."
  tr: "Claude Companion’ı Uygulamalar klasörüne taşıyın ve yeniden deneyin."
  uk: "Перемістіть Claude Companion до папки «Програми» та повторіть спробу."
  sv: "Flytta Claude Companion till mappen Program och försök igen."
  da: "Flyt Claude Companion til mappen Programmer, og prøv igen."
  nb: "Flytt Claude Companion til Programmer-mappen og prøv igjen."
  fi: "Siirrä Claude Companion Ohjelmat-kansioon ja yritä uudelleen."
  cs: "Přesuňte Claude Companion do složky Aplikace a zkuste to znovu."
  hu: "Helyezd át a Claude Companiont az Alkalmazások mappába, és próbáld újra."
  ro: "Mută Claude Companion în dosarul Applications și încearcă din nou."
  el: "Μετακινήστε το Claude Companion στον φάκελο Εφαρμογές και δοκιμάστε ξανά."
  id: "Pindahkan Claude Companion ke folder Applications lalu coba lagi."
  vi: "Hãy chuyển Claude Companion vào thư mục Applications rồi thử lại."
  th: "ย้าย Claude Companion ไปไว้ในโฟลเดอร์ Applications แล้วลองอีกครั้ง"
  hi: "Claude Companion को Applications फ़ोल्डर में ले जाएँ और फिर कोशिश करें।"
"update.problem.read_only":
  en: "Claude Companion isn’t allowed to replace itself where it’s installed. Download the new version instead."
  zh-CN: "Claude Companion 没有权限替换安装位置里的自己，请直接下载新版本。"
  zh-TW: "Claude Companion 沒有權限取代安裝位置裡的自己，請直接下載新版本。"
  ja: "Claude Companion にはインストール先で自身を置き換える権限がありません。新しいバージョンをダウンロードしてください。"
  ko: "Claude Companion가 설치된 위치에서 자신을 바꿀 권한이 없습니다. 새 버전을 직접 다운로드하세요."
  fr: "Claude Companion n’a pas le droit de se remplacer là où il est installé. Téléchargez plutôt la nouvelle version."
  de: "Claude Companion darf sich dort, wo es installiert ist, nicht ersetzen. Lade stattdessen die neue Version herunter."
  es: "Claude Companion no tiene permiso para reemplazarse donde está instalado. Descarga la nueva versión."
  pt-BR: "O Claude Companion não tem permissão para se substituir onde está instalado. Baixe a nova versão."
  ru: "Claude Companion не может заменить себя там, где установлен. Скачайте новую версию вручную."
  it: "Claude Companion non può sostituirsi nel punto in cui è installato. Scarica invece la nuova versione."
  nl: "Claude Companion mag zichzelf niet vervangen op de plek waar het is geïnstalleerd. Download in plaats daarvan de nieuwe versie."
  pl: "Claude Companion nie może zastąpić samego siebie w miejscu, w którym jest zainstalowany. Pobierz zamiast tego nową wersję."
  tr: "Claude Companion, kurulu olduğu yerde kendinin yerine geçemez. Bunun yerine yeni sürümü indirin."
  uk: "Claude Companion не може замінити себе там, де його встановлено. Натомість завантажте нову версію."
  sv: "Claude Companion kan inte ersätta sig själv där det är installerat. Ladda ned den nya versionen i stället."
  da: "Claude Companion kan ikke erstatte sig selv der, hvor det er installeret. Hent den nye version i stedet."
  nb: "Claude Companion kan ikke erstatte seg selv der det er installert. Last ned den nye versjonen i stedet."
  fi: "Claude Companion ei voi korvata itseään siinä, mihin se on asennettu. Lataa uusi versio sen sijaan."
  cs: "Claude Companion se nemůže nahradit tam, kde je nainstalován. Stáhněte místo toho novou verzi."
  hu: "A Claude Companion nem cserélheti le önmagát ott, ahol telepítve van. Töltsd le helyette az új verziót."
  ro: "Claude Companion nu se poate înlocui acolo unde este instalat. Descarcă în schimb noua versiune."
  el: "Το Claude Companion δεν μπορεί να αντικαταστήσει τον εαυτό του εκεί όπου είναι εγκατεστημένο. Κάντε λήψη της νέας έκδοσης."
  id: "Claude Companion tidak boleh menggantikan dirinya di tempat ia dipasang. Unduh versi baru sebagai gantinya."
  vi: "Claude Companion không thể tự thay thế ở nơi nó được cài. Hãy tải phiên bản mới."
  th: "Claude Companion แทนที่ตัวเองในตำแหน่งที่ติดตั้งไว้ไม่ได้ โปรดดาวน์โหลดเวอร์ชันใหม่แทน"
  hi: "Claude Companion जहाँ इंस्टॉल है वहाँ खुद को बदल नहीं सकता। इसके बजाय नया संस्करण डाउनलोड करें।"
"update.problem.unverified":
  en: "The download didn’t pass Claude Companion’s checks, so nothing was changed."
  zh-CN: "下载的文件没有通过 Claude Companion 的校验，所以没有做任何改动。"
  zh-TW: "下載的檔案沒有通過 Claude Companion 的檢查，所以沒有做任何變更。"
  ja: "ダウンロードしたファイルが Claude Companion の検証を通らなかったため、何も変更していません。"
  ko: "다운로드한 파일이 Claude Companion의 검사를 통과하지 못해 아무것도 바꾸지 않았습니다."
  fr: "Le téléchargement n’a pas passé les vérifications de Claude Companion : rien n’a été modifié."
  de: "Der Download hat die Prüfungen von Claude Companion nicht bestanden, daher wurde nichts geändert."
  es: "La descarga no pasó las comprobaciones de Claude Companion, así que no se cambió nada."
  pt-BR: "O download não passou nas verificações do Claude Companion, então nada foi alterado."
  ru: "Загрузка не прошла проверки Claude Companion, поэтому ничего не изменено."
  it: "Il download non ha superato i controlli di Claude Companion, quindi non è stato modificato nulla."
  nl: "De download kwam niet door de controles van Claude Companion, dus er is niets gewijzigd."
  pl: "Pobrany plik nie przeszedł kontroli Claude Companion, więc nic nie zostało zmienione."
  tr: "İndirilen dosya Claude Companion’ın denetimlerinden geçemedi, bu yüzden hiçbir şey değişmedi."
  uk: "Завантажений файл не пройшов перевірки Claude Companion, тому нічого не змінено."
  sv: "Nedladdningen klarade inte Claude Companions kontroller, så inget ändrades."
  da: "Den hentede fil bestod ikke Claude Companions kontroller, så intet blev ændret."
  nb: "Nedlastingen besto ikke Claude Companions kontroller, så ingenting ble endret."
  fi: "Ladattu tiedosto ei läpäissyt Claude Companionin tarkistuksia, joten mitään ei muutettu."
  cs: "Stažený soubor neprošel kontrolami Claude Companion, takže se nic nezměnilo."
  hu: "A letöltött fájl nem ment át a Claude Companion ellenőrzésein, ezért semmi sem változott."
  ro: "Fișierul descărcat nu a trecut verificările Claude Companion, așa că nu s-a schimbat nimic."
  el: "Η λήψη δεν πέρασε τους ελέγχους του Claude Companion, γι' αυτό δεν άλλαξε τίποτα."
  id: "Unduhan tidak lolos pemeriksaan Claude Companion, jadi tidak ada yang diubah."
  vi: "Bản tải về không qua được các bước kiểm tra của Claude Companion, nên không có gì thay đổi."
  th: "ไฟล์ที่ดาวน์โหลดไม่ผ่านการตรวจสอบของ Claude Companion จึงไม่มีการเปลี่ยนแปลงใด ๆ"
  hi: "डाउनलोड Claude Companion की जाँचें पास नहीं कर सका, इसलिए कुछ भी नहीं बदला।"
