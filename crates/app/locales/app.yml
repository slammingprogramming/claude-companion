"about.donate.detail":
  en: "Claude Companion is free software. A tip on Ko-fi, or in crypto below, helps keep it going."
  zh-CN: "Claude Companion 是自由软件。通过 Ko-fi 或下方的加密货币赞助，可以帮助它持续发展。"
  zh-TW: "Claude Companion 是自由軟體。透過 Ko-fi 或下方的加密貨幣贊助，可以幫助它持續發展。"
  ja: "Claude Companion はフリーソフトウェアです。Ko-fi か下の暗号資産でのご支援が開発の励みになります。"
  ko: "Claude Companion은 자유 소프트웨어입니다. Ko-fi나 아래 암호화폐로 후원해 주시면 큰 도움이 됩니다."
  fr: "Claude Companion est un logiciel libre. Un pourboire sur Ko-fi, ou en crypto ci-dessous, aide à le faire vivre."
  de: "Claude Companion ist freie Software. Ein Trinkgeld über Ko-fi oder in Krypto (unten) hilft bei der Weiterentwicklung."
  es: "Claude Companion es software libre. Una propina en Ko-fi, o en cripto más abajo, ayuda a mantenerlo."
  pt-BR: "O Claude Companion é software livre. Uma gorjeta no Ko-fi, ou em cripto abaixo, ajuda a mantê-lo."
  ru: "Claude Companion — свободное ПО. Чаевые на Ko-fi или в криптовалюте ниже помогают проекту жить."
  it: "Claude Companion è software libero. Una mancia su Ko-fi, o in crypto qui sotto, aiuta a portarlo avanti."
  nl: "Claude Companion is vrije software. Een fooi via Ko-fi of in crypto hieronder helpt het draaiende te houden."
  pl: "Claude Companion to wolne oprogramowanie. Napiwek na Ko-fi lub w kryptowalucie poniżej pomaga je utrzymać."
  tr: "Claude Companion özgür yazılımdır. Ko-fi üzerinden veya aşağıdaki kripto ile verilen bahşiş, onu ayakta tutmaya yardım eder."
  uk: "Claude Companion — вільне програмне забезпечення. Чайові через Ko-fi або криптовалюту нижче допомагають його підтримувати."
  sv: "Claude Companion är fri programvara. En slant via Ko-fi eller i krypto nedan hjälper till att hålla det igång."
  da: "Claude Companion er fri software. En skærv via Ko-fi eller i krypto nedenfor hjælper med at holde det kørende."
  nb: "Claude Companion er fri programvare. Et tips via Ko-fi eller i krypto nedenfor hjelper med å holde det i gang."
  fi: "Claude Companion on vapaa ohjelmisto. Tippi Ko-fin kautta tai kryptona alla auttaa pitämään sen käynnissä."
  cs: "Claude Companion je svobodný software. Spropitné přes Ko-fi nebo v kryptoměně níže pomáhá udržet jej v chodu."
  hu: "A Claude Companion szabad szoftver. A Ko-fin vagy az alábbi kriptóval adott borravaló segít életben tartani."
  ro: "Claude Companion este software liber. Un bacșiș prin Ko-fi sau în cripto, mai jos, ajută să rămână în funcțiune."
  el: "Το Claude Companion είναι ελεύθερο λογισμικό. Μια φιλοδώρηση μέσω Ko-fi ή σε κρυπτονομίσματα παρακάτω βοηθά να συνεχίσει να λειτουργεί."
  id: "Claude Companion adalah perangkat lunak bebas. Tip lewat Ko-fi atau kripto di bawah membantu menjaganya tetap berjalan."
  vi: "Claude Companion là phần mềm tự do. Một khoản tip qua Ko-fi hoặc tiền mã hóa bên dưới giúp duy trì nó."
  th: "Claude Companion เป็นซอฟต์แวร์เสรี ทิปผ่าน Ko-fi หรือคริปโตด้านล่างช่วยให้โครงการดำเนินต่อไปได้"
  hi: "Claude Companion मुक्त सॉफ़्टवेयर है। Ko-fi या नीचे दिए क्रिप्टो से दी गई टिप इसे चालू रखने में मदद करती है।"
