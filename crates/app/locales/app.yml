"about.contact.detail":
  en: "Message the developer on SimpleX: private, and no account is needed. The link opens in your browser."
  zh-CN: "通过 SimpleX 联系开发者：私密，且无需账户。链接将在浏览器中打开。"
  zh-TW: "透過 SimpleX 聯絡開發者：私密，且無需帳號。連結將在瀏覽器中開啟。"
  ja: "SimpleX で開発者にメッセージを送れます。プライバシーが守られ、アカウントは不要です。リンクはブラウザーで開きます。"
  ko: "SimpleX로 개발자에게 메시지를 보낼 수 있습니다. 비공개이며 계정이 필요 없습니다. 링크는 브라우저에서 열립니다."
  fr: "Écrivez au développeur sur SimpleX : privé et sans compte. Le lien s’ouvre dans votre navigateur."
  de: "Schreibe dem Entwickler über SimpleX: privat und ohne Konto. Der Link öffnet sich im Browser."
  es: "Escribe al desarrollador por SimpleX: privado y sin necesidad de cuenta. El enlace se abre en tu navegador."
  pt-BR: "Escreva ao desenvolvedor pelo SimpleX: privado e sem precisar de conta. O link abre no navegador."
  ru: "Напишите разработчику в SimpleX: приватно и без аккаунта. Ссылка откроется в браузере."
  it: "Scrivi allo sviluppatore su SimpleX: privato e senza bisogno di un account. Il link si apre nel browser."
  nl: "Stuur de ontwikkelaar een bericht via SimpleX: privé en zonder account. De link opent in je browser."
  pl: "Napisz do autora przez SimpleX: prywatnie i bez konta. Link otworzy się w przeglądarce."
  tr: "Geliştiriciye SimpleX üzerinden yazın: gizli ve hesapsız. Bağlantı tarayıcınızda açılır."
  uk: "Напишіть розробнику через SimpleX: приватно й без облікового запису. Посилання відкриється у вашому браузері."
  sv: "Skriv till utvecklaren via SimpleX: privat och utan konto. Länken öppnas i din webbläsare."
  da: "Skriv til udvikleren via SimpleX: privat og uden konto. Linket åbner i din browser."
  nb: "Skriv til utvikleren via SimpleX: privat og uten konto. Lenken åpnes i nettleseren din."
  fi: "Kirjoita kehittäjälle SimpleXin kautta: yksityisesti ja ilman tiliä. Linkki avautuu selaimessasi."
  cs: "Napište vývojáři přes SimpleX: soukromě a bez účtu. Odkaz se otevře ve vašem prohlížeči."
  hu: "Írj a fejlesztőnek a SimpleX-en: privátan és fiók nélkül. A hivatkozás a böngésződben nyílik meg."
  ro: "Scrie-i dezvoltatorului prin SimpleX: privat și fără cont. Linkul se deschide în browserul tău."
  el: "Στείλτε μήνυμα στον προγραμματιστή μέσω SimpleX: ιδιωτικά και χωρίς λογαριασμό. Ο σύνδεσμος ανοίγει στο πρόγραμμα περιήγησής σας."
  id: "Kirim pesan ke pengembang lewat SimpleX: privat dan tanpa akun. Tautan terbuka di peramban Anda."
  vi: "Nhắn tin cho nhà phát triển qua SimpleX: riêng tư và không cần tài khoản. Liên kết mở trong trình duyệt của bạn."
  th: "ส่งข้อความถึงผู้พัฒนาผ่าน SimpleX: เป็นส่วนตัวและไม่ต้องมีบัญชี ลิงก์จะเปิดในเบราว์เซอร์ของคุณ"
  hi: "SimpleX पर डेवलपर को संदेश भेजें: निजी और बिना खाते के। लिंक आपके ब्राउज़र में खुलता है।"
