"settings.cleanup.detail":
  en: "How long Claude Code keeps the transcripts of terminal sessions and other data (cleanupPeriodDays)."
  zh-CN: "Claude Code 保留终端会话等其他数据的对话记录的时长（cleanupPeriodDays）。"
  zh-TW: "Claude Code 保留終端機工作階段等其他資料的對話記錄的時間（cleanupPeriodDays）。"
  ja: "Claude Code がターミナルセッションなどの会話記録を保持する期間（cleanupPeriodDays）。"
  ko: "Claude Code가 터미널 세션 등 기타 데이터의 대화 기록을 보관하는 기간입니다(cleanupPeriodDays)."
  fr: "Durée pendant laquelle Claude Code garde les transcriptions des sessions de terminal et autres données (cleanupPeriodDays)."
  de: "Wie lange Claude Code die Transkripte von Terminal-Sitzungen und anderen Daten behält (cleanupPeriodDays)."
  es: "Cuánto tiempo guarda Claude Code las transcripciones de las sesiones de terminal y otros datos (cleanupPeriodDays)."
  pt-BR: "Por quanto tempo o Claude Code guarda as transcrições de sessões de terminal e outros dados (cleanupPeriodDays)."
  ru: "Как долго Claude Code хранит транскрипты сеансов терминала и прочих данных (cleanupPeriodDays)."
  it: "Per quanto tempo Claude Code conserva le trascrizioni delle sessioni da terminale e altri dati (cleanupPeriodDays)."
  nl: "Hoe lang Claude Code de transcripties van terminalsessies en andere gegevens bewaart (cleanupPeriodDays)."
  pl: "Jak długo Claude Code przechowuje zapisy sesji terminala i inne dane (cleanupPeriodDays)."
  tr: "Claude Code’un terminal oturumlarının dökümlerini ve diğer verileri ne kadar süre sakladığı (cleanupPeriodDays)."
  uk: "Як довго Claude Code зберігає стенограми сеансів терміналу та інші дані (cleanupPeriodDays)."
  sv: "Hur länge Claude Code sparar utskrifter av terminalsessioner och annan data (cleanupPeriodDays)."
  da: "Hvor længe Claude Code gemmer udskrifter af terminalsessioner og andre data (cleanupPeriodDays)."
  nb: "Hvor lenge Claude Code lagrer utskrifter av terminaløkter og andre data (cleanupPeriodDays)."
  fi: "Kuinka kauan Claude Code säilyttää päätteen istuntojen tekstitallenteet ja muut tiedot (cleanupPeriodDays)."
  cs: "Jak dlouho Claude Code uchovává přepisy relací terminálu a další data (cleanupPeriodDays)."
  hu: "Mennyi ideig őrzi a Claude Code a terminálmunkamenetek átiratait és egyéb adatokat (cleanupPeriodDays)."
  ro: "Cât timp păstrează Claude Code transcrierile sesiunilor din terminal și alte date (cleanupPeriodDays)."
  el: "Πόσο καιρό διατηρεί το Claude Code τις μεταγραφές συνεδριών τερματικού και άλλα δεδομένα (cleanupPeriodDays)."
  id: "Berapa lama Claude Code menyimpan transkrip sesi terminal dan data lainnya (cleanupPeriodDays)."
  vi: "Claude Code giữ bản ghi của các phiên terminal và dữ liệu khác trong bao lâu (cleanupPeriodDays)."
  th: "ระยะเวลาที่ Claude Code เก็บบันทึกการสนทนาของเซสชันเทอร์มินัลและข้อมูลอื่น ๆ (cleanupPeriodDays)"
  hi: "Claude Code टर्मिनल सत्रों की ट्रांसक्रिप्ट और अन्य डेटा कितने समय तक रखता है (cleanupPeriodDays)।"
