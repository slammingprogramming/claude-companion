"signin.body":
  en: "Claude restarts on its sign-in page. Sign in there with the other account."
  zh-CN: "Claude 会重启到登录页面，在那里登录另一个账号。"
  zh-TW: "Claude 會重新啟動到登入頁面，在那裡登入另一個帳號。"
  ja: "Claude がサインイン画面で再起動します。そこで別のアカウントにサインインしてください。"
  ko: "Claude가 로그인 화면으로 다시 시작됩니다. 거기서 다른 계정으로 로그인하세요."
  fr: "Claude redémarre sur sa page de connexion. Connectez-vous-y avec l’autre compte."
  de: "Claude startet neu und zeigt die Anmeldeseite. Melde dich dort mit dem anderen Konto an."
  es: "Claude se reinicia en su página de inicio de sesión. Inicia sesión allí con la otra cuenta."
  pt-BR: "O Claude reinicia na página de login. Entre lá com a outra conta."
  ru: "Claude перезапустится на странице входа. Войдите там в другой аккаунт."
  it: "Claude si riavvia sulla pagina di accesso. Accedi lì con l’altro account."
  nl: "Claude start opnieuw op de aanmeldpagina. Meld je daar aan met het andere account."
  pl: "Claude uruchamia się ponownie na stronie logowania. Zaloguj się tam na drugie konto."
  tr: "Claude oturum açma sayfasında yeniden başlıyor. Orada diğer hesapla oturum açın."
  uk: "Claude перезапускається на сторінці входу. Увійдіть там в інший обліковий запис."
  sv: "Claude startar om på inloggningssidan. Logga in där med det andra kontot."
  da: "Claude genstarter på loginsiden. Log ind der med den anden konto."
  nb: "Claude starter på nytt på påloggingssiden. Logg inn der med den andre kontoen."
  fi: "Claude käynnistyy uudelleen kirjautumissivulle. Kirjaudu siellä toisella tilillä."
  cs: "Claude se restartuje na přihlašovací stránce. Přihlaste se tam druhým účtem."
  hu: "A Claude újraindul a bejelentkezési oldalon. Jelentkezz be ott a másik fiókkal."
  ro: "Claude repornește pe pagina de autentificare. Autentifică-te acolo cu celălalt cont."
  el: "Το Claude επανεκκινείται στη σελίδα σύνδεσης. Συνδεθείτε εκεί με τον άλλον λογαριασμό."
  id: "Claude dimulai ulang di halaman masuk. Masuk di sana dengan akun lainnya."
  vi: "Claude khởi động lại ở trang đăng nhập. Hãy đăng nhập ở đó bằng tài khoản còn lại."
  th: "Claude เริ่มใหม่ที่หน้าลงชื่อเข้าใช้ ลงชื่อเข้าใช้ที่นั่นด้วยบัญชีอีกบัญชีหนึ่ง"
  hi: "Claude साइन-इन पेज पर फिर से शुरू होता है। वहाँ दूसरे खाते से साइन इन करें।"
"signin.body_as":
  en: "Claude restarts on its sign-in page. Sign in there as %{account}."
  zh-CN: "Claude 会重启到登录页面，在那里登录 %{account}。"
  zh-TW: "Claude 會重新啟動到登入頁面，在那裡登入 %{account}。"
  ja: "Claude がサインイン画面で再起動します。そこで %{account} にサインインしてください。"
