  uk: "Установіть Claude і увійдіть. Це вікно оновлюється саме."
  sv: "Installera Claude och logga in. Det här fönstret uppdateras av sig självt."
  da: "Installer Claude og log ind. Dette vindue opdaterer sig selv."
  nb: "Installer Claude og logg inn. Dette vinduet oppdaterer seg selv."
  fi: "Asenna Claude ja kirjaudu sisään. Tämä ikkuna päivittyy itsestään."
  cs: "Nainstalujte Claude a přihlaste se. Toto okno se aktualizuje samo."
  hu: "Telepítsd a Claude-ot, és jelentkezz be. Ez az ablak magától frissül."
  ro: "Instalează Claude și autentifică-te. Această fereastră se actualizează singură."
  el: "Εγκαταστήστε το Claude και συνδεθείτε. Αυτό το παράθυρο ενημερώνεται μόνο του."
  id: "Pasang Claude dan masuk. Jendela ini memperbarui dirinya sendiri."
  vi: "Hãy cài đặt Claude và đăng nhập. Cửa sổ này tự cập nhật."
  th: "ติดตั้ง Claude แล้วลงชื่อเข้าใช้ หน้าต่างนี้จะอัปเดตเอง"
  hi: "Claude इंस्टॉल करें और साइन इन करें। यह विंडो अपने आप अपडेट होती है।"
