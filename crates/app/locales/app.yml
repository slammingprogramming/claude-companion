"usage.stale.mac":
  en: "%{usage} · read by Claude %{ago}. Right-click Claude’s icon in the menu bar to have it check again."
  zh-CN: "%{usage} · %{ago}由 Claude 读取。右键点按菜单栏里的 Claude 图标，它就会重新读取。"
  zh-TW: "%{usage} · %{ago}由 Claude 讀取。在選單列的 Claude 圖示上按右鍵，它就會重新讀取。"
