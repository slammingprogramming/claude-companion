"settings.kept.desktop":
  en: "Claude Code keeps the transcripts of sessions you use in Claude Desktop."
  zh-CN: "Claude Code 会保留你在 Claude Desktop 里用过的会话的对话记录。"
  zh-TW: "Claude Code 會保留你在 Claude Desktop 裡用過的工作階段的對話記錄。"
  ja: "Claude Code は、Claude Desktop で使ったセッションの会話記録を保持します。"
  ko: "Claude Code는 Claude Desktop에서 사용한 세션의 대화 기록을 보관합니다."
  fr: "Claude Code garde les transcriptions des sessions que vous utilisez dans Claude Desktop."
  de: "Claude Code behält die Transkripte der Sitzungen, die du in Claude Desktop nutzt."
  es: "Claude Code guarda las transcripciones de las sesiones que usas en Claude Desktop."
  pt-BR: "O Claude Code mantém as transcrições das sessões que você usa no Claude Desktop."
  ru: "Claude Code хранит записи бесед сессий, которыми вы пользуетесь в Claude Desktop."
  it: "Claude Code conserva le trascrizioni delle sessioni che usi in Claude Desktop."
  nl: "Claude Code bewaart de transcripties van sessies die je in Claude Desktop gebruikt."
  pl: "Claude Code przechowuje zapisy rozmów z sesji, których używasz w Claude Desktop."
  tr: "Claude Code, Claude Desktop’ta kullandığınız oturumların dökümlerini saklar."
  uk: "Claude Code зберігає стенограми сеансів, якими ви користуєтеся в Claude Desktop."
  sv: "Claude Code sparar utskrifterna av de sessioner du använder i Claude Desktop."
  da: "Claude Code gemmer udskrifterne af de sessioner, du bruger i Claude Desktop."
  nb: "Claude Code lagrer utskriftene av øktene du bruker i Claude Desktop."
  fi: "Claude Code säilyttää Claude Desktopissa käyttämiesi istuntojen tekstitallenteet."
  cs: "Claude Code uchovává přepisy relací, které používáte v Claude Desktop."
  hu: "A Claude Code megőrzi a Claude Desktopban használt munkamenetek átiratait."
  ro: "Claude Code păstrează transcrierile sesiunilor pe care le folosești în Claude Desktop."
  el: "Το Claude Code διατηρεί τις μεταγραφές των συνεδριών που χρησιμοποιείτε στο Claude Desktop."
  id: "Claude Code menyimpan transkrip sesi yang Anda gunakan di Claude Desktop."
  vi: "Claude Code giữ bản ghi của các phiên bạn dùng trong Claude Desktop."
  th: "Claude Code เก็บบันทึกการสนทนาของเซสชันที่คุณใช้ใน Claude Desktop"
  hi: "Claude Code उन सत्रों की ट्रांसक्रिप्ट रखता है जिन्हें आप Claude Desktop में इस्तेमाल करते हैं।"
"settings.kept.short":
  en: "Claude Code deletes older transcripts, and a session opens empty without one."
  zh-CN: "Claude Code 会删除较早的对话记录，没有记录的会话打开是空的。"
  zh-TW: "Claude Code 會刪除較早的對話記錄，沒有記錄的工作階段打開是空的。"
  ja: "Claude Code は古い会話記録を削除します。記録がないセッションは開いても空です。"
  ko: "Claude Code는 오래된 대화 기록을 삭제하며, 기록이 없는 세션은 열어도 비어 있습니다."
  fr: "Claude Code supprime les anciennes transcriptions, et une session s’ouvre vide sans la sienne."
  de: "Claude Code löscht ältere Transkripte, und ohne Transkript öffnet sich eine Sitzung leer."
  es: "Claude Code borra las transcripciones antiguas, y una sesión sin la suya se abre vacía."
  pt-BR: "O Claude Code apaga transcrições antigas, e uma sessão sem a sua abre vazia."
  ru: "Claude Code удаляет старые записи бесед, а без записи сессия открывается пустой."
  it: "Claude Code elimina le trascrizioni più vecchie e, senza di esse, una sessione si apre vuota."
  nl: "Claude Code verwijdert oudere transcripties, en zonder transcriptie opent een sessie leeg."
  pl: "Claude Code usuwa starsze zapisy rozmów, a sesja bez zapisu otwiera się pusta."
  tr: "Claude Code eski dökümleri siler ve dökümü olmayan bir oturum boş açılır."
  uk: "Claude Code видаляє старіші стенограми, а сеанс без стенограми відкривається порожнім."
  sv: "Claude Code raderar äldre utskrifter, och en session utan utskrift öppnas tom."
  da: "Claude Code sletter ældre udskrifter, og en session uden udskrift åbner tom."
  nb: "Claude Code sletter eldre utskrifter, og en økt uten utskrift åpnes tom."
  fi: "Claude Code poistaa vanhemmat tekstitallenteet, ja istunto ilman tallennetta avautuu tyhjänä."
  cs: "Claude Code maže starší přepisy a relace bez přepisu se otevře prázdná."
  hu: "A Claude Code törli a régebbi átiratokat, az átirat nélküli munkamenet pedig üresen nyílik meg."
  ro: "Claude Code șterge transcrierile mai vechi, iar o sesiune fără transcriere se deschide goală."
  el: "Το Claude Code διαγράφει παλαιότερες μεταγραφές και μια συνεδρία χωρίς μεταγραφή ανοίγει κενή."
  id: "Claude Code menghapus transkrip yang lebih lama, dan sesi tanpa transkrip terbuka kosong."
  vi: "Claude Code xóa các bản ghi cũ hơn, và phiên không có bản ghi sẽ mở ra trống."
  th: "Claude Code ลบบันทึกการสนทนาที่เก่ากว่า และเซสชันที่ไม่มีบันทึกการสนทนาจะเปิดขึ้นมาว่างเปล่า"
  hi: "Claude Code पुरानी ट्रांसक्रिप्ट हटा देता है, और बिना ट्रांसक्रिप्ट वाला सत्र खाली खुलता है।"
