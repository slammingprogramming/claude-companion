"signin.keeps":
  en: "Claude Companion keeps %{account} signed in, so you can switch back in one click."
  zh-CN: "Claude Companion 会保留 %{account} 的登录，之后一键就能切回来。"
  zh-TW: "Claude Companion 會保留 %{account} 的登入，之後一鍵就能切回來。"
  ja: "%{account} のサインインは Claude Companion が保持するので、ワンクリックで戻せます。"
  ko: "Claude Companion가 %{account} 계정의 로그인을 보관하므로 클릭 한 번으로 돌아올 수 있습니다."
  fr: "Claude Companion garde %{account} connecté : vous pourrez y revenir en un clic."
  de: "Claude Companion hält %{account} angemeldet, sodass du mit einem Klick zurückwechseln kannst."
  es: "Claude Companion mantiene la sesión de %{account}, así que podrás volver con un clic."
  pt-BR: "O Claude Companion mantém o login de %{account}, para você voltar com um clique."
  ru: "Claude Companion сохранит вход в %{account}, чтобы вернуться одним щелчком."
  it: "Claude Companion mantiene %{account} connesso, così puoi tornare indietro con un clic."
  nl: "Claude Companion houdt %{account} aangemeld, zodat je met één klik kunt terugwisselen."
  pl: "Claude Companion utrzymuje zalogowanie %{account}, więc możesz wrócić jednym kliknięciem."
  tr: "Claude Companion %{account} hesabının oturumunu açık tutar, böylece tek tıkla geri dönebilirsiniz."
  uk: "Claude Companion тримає %{account} у системі, щоб ви могли повернутися одним клацанням."
  sv: "Claude Companion håller %{account} inloggat så att du kan byta tillbaka med ett klick."
  da: "Claude Companion holder %{account} logget ind, så du kan skifte tilbage med et klik."
  nb: "Claude Companion holder %{account} innlogget slik at du kan bytte tilbake med ett klikk."
  fi: "Claude Companion pitää tilin %{account} kirjautuneena, jotta voit vaihtaa takaisin yhdellä napsautuksella."
  cs: "Claude Companion drží účet %{account} přihlášený, takže se můžete jedním kliknutím vrátit."
  hu: "A Claude Companion bejelentkezve tartja a(z) %{account} fiókot, így egy kattintással visszaválthatsz."
  ro: "Claude Companion păstrează contul %{account} autentificat, ca să poți reveni cu un clic."
  el: "Το Claude Companion κρατά τον %{account} συνδεδεμένο, ώστε να επιστρέψετε με ένα κλικ."
  id: "Claude Companion menjaga %{account} tetap masuk agar Anda bisa beralih kembali dengan satu klik."
  vi: "Claude Companion giữ %{account} luôn đăng nhập để bạn chuyển lại chỉ với một cú nhấp."
  th: "Claude Companion เก็บ %{account} ให้ลงชื่อเข้าใช้ไว้ คุณจึงสลับกลับได้ด้วยการคลิกเดียว"
  hi: "Claude Companion %{account} को साइन इन रखता है, ताकि आप एक क्लिक में वापस बदल सकें।"
"signin.tip":
  en: "From now on, switch here or from the menu bar. Logging out in Claude ends a sign-in for good."
  zh-CN: "以后在这里或菜单栏切换账号。在 Claude 里退出登录会让这个登录彻底失效。"
  zh-TW: "之後在這裡或選單列切換帳號。在 Claude 裡登出會讓這個登入徹底失效。"
  ja: "今後はここかメニューバーから切り替えてください。Claude でログアウトすると、そのサインインは完全に無効になります。"
  ko: "앞으로는 여기나 메뉴 막대에서 전환하세요. Claude에서 로그아웃하면 그 로그인은 완전히 무효가 됩니다."
  fr: "Ensuite, changez de compte ici ou depuis la barre des menus. Se déconnecter dans Claude met fin à une connexion pour de bon."
  de: "Wechsle künftig hier oder über die Menüleiste. Abmelden in Claude beendet eine Anmeldung endgültig."
  es: "A partir de ahora, cambia aquí o desde la barra de menús. Cerrar sesión en Claude termina una sesión para siempre."
  pt-BR: "Daqui em diante, troque aqui ou pela barra de menus. Sair no Claude encerra um login de vez."
  ru: "Дальше переключайтесь здесь или в строке меню. Выход в Claude завершает вход навсегда."
  it: "D’ora in poi cambia account da qui o dalla barra dei menu. Uscire da Claude termina un accesso per sempre."
  nl: "Wissel voortaan hier of via de menubalk. Uitloggen in Claude beëindigt een aanmelding voorgoed."
  pl: "Od teraz przełączaj się tutaj lub z paska menu. Wylogowanie w Claude kończy logowanie na dobre."
  tr: "Bundan sonra buradan veya menü çubuğundan geçiş yapın. Claude’da çıkış yapmak oturumu kalıcı olarak sonlandırır."
  uk: "Надалі перемикайтеся тут або з рядка меню. Вихід у Claude остаточно завершує вхід."
  sv: "Byt härifrån eller från menyraden framöver. Att logga ut i Claude avslutar inloggningen för gott."
  da: "Skift herfra eller fra menulinjen fremover. At logge ud i Claude afslutter et login for altid."
  nb: "Bytt herfra eller fra menylinjen fremover. Å logge ut i Claude avslutter en pålogging for godt."
  fi: "Vaihda jatkossa täältä tai valikkoriviltä. Uloskirjautuminen Claudessa päättää kirjautumisen pysyvästi."
  cs: "Přepínejte odsud nebo z lišty nabídek. Odhlášení v Claude přihlášení trvale ukončí."
  hu: "Innentől innen vagy a menüsorból válts. A Claude-ban való kijelentkezés végleg megszünteti a bejelentkezést."
  ro: "De acum comută de aici sau din bara de meniu. Deconectarea în Claude pune capăt definitiv unei autentificări."
  el: "Στο εξής αλλάζετε από εδώ ή από τη γραμμή μενού. Η αποσύνδεση στο Claude τερματίζει μια σύνδεση οριστικά."
  id: "Mulai sekarang beralihlah dari sini atau dari bilah menu. Keluar di Claude mengakhiri sesi masuk untuk selamanya."
  vi: "Từ giờ hãy chuyển từ đây hoặc từ thanh menu. Đăng xuất trong Claude sẽ chấm dứt một phiên đăng nhập vĩnh viễn."
  th: "จากนี้ให้สลับจากที่นี่หรือจากแถบเมนู การออกจากระบบใน Claude จะสิ้นสุดการลงชื่อเข้าใช้อย่างถาวร"
  hi: "अब से यहीं से या मेन्यू बार से बदलें। Claude में साइन आउट करने पर साइन-इन हमेशा के लिए खत्म हो जाता है।"
