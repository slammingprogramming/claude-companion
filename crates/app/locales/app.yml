"accounts.empty":
  en: "No accounts yet. Sign in to Claude, and they show up here."
  zh-CN: "还没有账号。登录 Claude 后会显示在这里。"
  zh-TW: "還沒有帳號。登入 Claude 後會顯示在這裡。"
  ja: "アカウントはまだありません。Claude にサインインするとここに表示されます。"
  ko: "아직 계정이 없습니다. Claude에 로그인하면 여기에 표시됩니다."
  fr: "Aucun compte pour l’instant. Connectez-vous à Claude pour les voir ici."
  de: "Noch keine Konten. Melde dich bei Claude an, dann erscheinen sie hier."
  es: "Aún no hay cuentas. Inicia sesión en Claude y aparecerán aquí."
  pt-BR: "Ainda não há contas. Entre no Claude e elas aparecem aqui."
  ru: "Аккаунтов пока нет. Войдите в Claude, и они появятся здесь."
  it: "Ancora nessun account. Accedi a Claude e compariranno qui."
  nl: "Nog geen accounts. Meld je aan bij Claude en ze verschijnen hier."
  pl: "Nie ma jeszcze kont. Zaloguj się w Claude, a pojawią się tutaj."
  tr: "Henüz hesap yok. Claude’da oturum açın, burada görünsünler."
  uk: "Облікових записів ще немає. Увійдіть у Claude, і вони з’являться тут."
  sv: "Inga konton ännu. Logga in i Claude så dyker de upp här."
  da: "Ingen konti endnu. Log ind i Claude, så dukker de op her."
  nb: "Ingen kontoer ennå. Logg inn i Claude, så dukker de opp her."
  fi: "Ei vielä tilejä. Kirjaudu Claudessa, niin ne näkyvät tässä."
  cs: "Zatím žádné účty. Přihlaste se v Claude a objeví se zde."
  hu: "Még nincsenek fiókok. Jelentkezz be a Claude-ban, és megjelennek itt."
  ro: "Încă nu există conturi. Autentifică-te în Claude și vor apărea aici."
  el: "Δεν υπάρχουν ακόμη λογαριασμοί. Συνδεθείτε στο Claude και θα εμφανιστούν εδώ."
  id: "Belum ada akun. Masuk ke Claude dan akun akan muncul di sini."
  vi: "Chưa có tài khoản nào. Hãy đăng nhập Claude và chúng sẽ hiện ở đây."
  th: "ยังไม่มีบัญชี ลงชื่อเข้าใช้ Claude แล้วบัญชีจะแสดงที่นี่"
  hi: "अभी कोई खाता नहीं। Claude में साइन इन करें, वे यहाँ दिखेंगे।"
"notice.restart.one":
  en: "Quit and reopen Claude to see the session copied into %{account}."
  fr: "Quittez puis rouvrez Claude pour voir la session copiée dans %{account}."
  de: "Beende Claude und öffne es erneut, um die in %{account} kopierte Sitzung zu sehen."
  es: "Cierra y vuelve a abrir Claude para ver la sesión copiada en %{account}."
  pt-BR: "Feche e abra o Claude de novo para ver a sessão copiada para %{account}."
  ru: "Закройте и снова откройте Claude, чтобы увидеть %{count} сессию, скопированную в %{account}."
  it: "Chiudi e riapri Claude per vedere la sessione copiata in %{account}."
  nl: "Sluit Claude af en open het opnieuw om de naar %{account} gekopieerde sessie te zien."
  pl: "Zamknij i ponownie otwórz Claude, aby zobaczyć sesję skopiowaną do konta %{account}."
  tr: "%{account} hesabına kopyalanan oturumu görmek için Claude’u kapatıp yeniden açın."
  uk: "Закрийте й знову відкрийте Claude, щоб побачити сеанс, скопійований в обліковий запис %{account}."
  sv: "Avsluta och öppna Claude igen för att se sessionen som kopierats till %{account}."
  da: "Luk og åbn Claude igen for at se sessionen, der er kopieret til %{account}."
  nb: "Avslutt og åpne Claude på nytt for å se økten som er kopiert til %{account}."
  fi: "Sulje ja avaa Claude uudelleen nähdäksesi tilille %{account} kopioidun istunnon."
  cs: "Ukončete a znovu otevřete Claude, abyste viděli relaci zkopírovanou do účtu %{account}."
  hu: "Lépj ki a Claude-ból, és nyisd meg újra, hogy lásd a(z) %{account} fiókba másolt munkamenetet."
  ro: "Închide și redeschide Claude ca să vezi sesiunea copiată în contul %{account}."
  el: "Κλείστε και ανοίξτε ξανά το Claude για να δείτε τη συνεδρία που αντιγράφηκε στον λογαριασμό %{account}."
  hi: "%{account} में कॉपी किया गया सत्र देखने के लिए Claude बंद करके दोबारा खोलें।"
"notice.restart.other":
  en: "Quit and reopen Claude to see the %{count} sessions copied into %{account}."
  zh-CN: "退出并重新打开 Claude，就能看到复制到 %{account} 的 %{count} 个会话。"
  zh-TW: "結束並重新開啟 Claude，就能看到複製到 %{account} 的 %{count} 個工作階段。"
  ja: "Claude を終了して開き直すと、%{account} にコピーした %{count} 件のセッションが表示されます。"
  ko: "Claude를 종료했다가 다시 열면 %{account}에 복사된 세션 %{count}개가 보입니다."
  fr: "Quittez puis rouvrez Claude pour voir les %{count} sessions copiées dans %{account}."
  de: "Beende Claude und öffne es erneut, um die %{count} in %{account} kopierten Sitzungen zu sehen."
  es: "Cierra y vuelve a abrir Claude para ver las %{count} sesiones copiadas en %{account}."
  pt-BR: "Feche e abra o Claude de novo para ver as %{count} sessões copiadas para %{account}."
  it: "Chiudi e riapri Claude per vedere le %{count} sessioni copiate in %{account}."
  nl: "Sluit Claude af en open het opnieuw om de %{count} naar %{account} gekopieerde sessies te zien."
  tr: "%{account} hesabına kopyalanan %{count} oturumu görmek için Claude’u kapatıp yeniden açın."
  sv: "Avsluta och öppna Claude igen för att se de %{count} sessionerna som kopierats till %{account}."
  da: "Luk og åbn Claude igen for at se de %{count} sessioner, der er kopieret til %{account}."
  nb: "Avslutt og åpne Claude på nytt for å se de %{count} øktene som er kopiert til %{account}."
  fi: "Sulje ja avaa Claude uudelleen nähdäksesi tilille %{account} kopioidut %{count} istuntoa."
  cs: "Ukončete a znovu otevřete Claude, abyste viděli %{count} relací zkopírovaných do účtu %{account}."
