"about.crypto.detail":
  en: "Copies the address to your clipboard. The Bitcoin address uses the Silent Payments format (sp1…), so your wallet must support it."
  zh-CN: "将地址复制到剪贴板。比特币地址采用静默支付（Silent Payments）格式（sp1…），需要钱包支持。"
  zh-TW: "將地址複製到剪貼簿。比特幣地址採用靜默支付（Silent Payments）格式（sp1…），需要錢包支援。"
  ja: "アドレスをクリップボードにコピーします。ビットコインのアドレスは Silent Payments 形式（sp1…）なので、ウォレットが対応している必要があります。"
  ko: "주소를 클립보드에 복사합니다. 비트코인 주소는 Silent Payments 형식(sp1…)이므로 지갑이 이를 지원해야 합니다."
  fr: "Copie l’adresse dans le presse-papiers. L’adresse Bitcoin est au format Silent Payments (sp1…) : votre portefeuille doit le prendre en charge."
  de: "Kopiert die Adresse in die Zwischenablage. Die Bitcoin-Adresse hat das Silent-Payments-Format (sp1…); deine Wallet muss es unterstützen."
  es: "Copia la dirección al portapapeles. La dirección de Bitcoin usa el formato Silent Payments (sp1…), por lo que tu cartera debe admitirlo."
  pt-BR: "Copia o endereço para a área de transferência. O endereço Bitcoin usa o formato Silent Payments (sp1…), então sua carteira precisa ser compatível."
  ru: "Копирует адрес в буфер обмена. Биткоин-адрес в формате Silent Payments (sp1…): ваш кошелёк должен его поддерживать."
  it: "Copia l’indirizzo negli appunti. L’indirizzo Bitcoin usa il formato Silent Payments (sp1…), quindi il tuo wallet deve supportarlo."
  nl: "Kopieert het adres naar je klembord. Het Bitcoin-adres gebruikt het Silent Payments-formaat (sp1…), dus je wallet moet dat ondersteunen."
  pl: "Kopiuje adres do schowka. Adres Bitcoin używa formatu Silent Payments (sp1…), więc Twój portfel musi go obsługiwać."
  tr: "Adresi panonuza kopyalar. Bitcoin adresi Silent Payments biçimini (sp1…) kullanır, bu yüzden cüzdanınızın bunu desteklemesi gerekir."
  uk: "Копіює адресу в буфер обміну. Адреса Bitcoin використовує формат Silent Payments (sp1…), тож ваш гаманець має його підтримувати."
  sv: "Kopierar adressen till urklipp. Bitcoin-adressen använder formatet Silent Payments (sp1…), så din plånbok måste stödja det."
  da: "Kopierer adressen til din udklipsholder. Bitcoin-adressen bruger formatet Silent Payments (sp1…), så din tegnebog skal understøtte det."
  nb: "Kopierer adressen til utklippstavlen. Bitcoin-adressen bruker formatet Silent Payments (sp1…), så lommeboken din må støtte det."
  fi: "Kopioi osoitteen leikepöydälle. Bitcoin-osoite käyttää Silent Payments -muotoa (sp1…), joten lompakkosi on tuettava sitä."
  cs: "Zkopíruje adresu do schránky. Adresa Bitcoin používá formát Silent Payments (sp1…), takže ho vaše peněženka musí podporovat."
  hu: "A címet a vágólapra másolja. A Bitcoin-cím a Silent Payments formátumot (sp1…) használja, ezért a tárcádnak támogatnia kell."
  ro: "Copiază adresa în clipboard. Adresa Bitcoin folosește formatul Silent Payments (sp1…), deci portofelul tău trebuie să îl accepte."
  el: "Αντιγράφει τη διεύθυνση στο πρόχειρο. Η διεύθυνση Bitcoin χρησιμοποιεί τη μορφή Silent Payments (sp1…), οπότε το πορτοφόλι σας πρέπει να την υποστηρίζει."
  id: "Menyalin alamat ke papan klip. Alamat Bitcoin memakai format Silent Payments (sp1…), jadi dompet Anda harus mendukungnya."
  vi: "Sao chép địa chỉ vào bộ nhớ tạm. Địa chỉ Bitcoin dùng định dạng Silent Payments (sp1…), nên ví của bạn phải hỗ trợ nó."
  th: "คัดลอกที่อยู่ไปยังคลิปบอร์ด ที่อยู่ Bitcoin ใช้รูปแบบ Silent Payments (sp1…) กระเป๋าเงินของคุณจึงต้องรองรับรูปแบบนี้"
  hi: "पता आपके क्लिपबोर्ड पर कॉपी करता है। Bitcoin पता Silent Payments प्रारूप (sp1…) इस्तेमाल करता है, इसलिए आपके वॉलेट को उसे सपोर्ट करना होगा।"
