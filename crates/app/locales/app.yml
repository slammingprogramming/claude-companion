  nl: "Claude wordt bijgewerkt. Probeer het over een minuut opnieuw."
  pl: "Claude się aktualizuje. Spróbuj ponownie za minutę."
  tr: "Claude güncelleniyor. Bir dakika sonra yeniden deneyin."
  uk: "Claude оновлюється. Повторіть спробу за хвилину."
  sv: "Claude uppdateras. Försök igen om en minut."
  da: "Claude opdaterer. Prøv igen om et minut."
  nb: "Claude oppdateres. Prøv igjen om et minutt."
  fi: "Claude päivittyy. Yritä uudelleen minuutin kuluttua."
  cs: "Claude se aktualizuje. Zkuste to znovu za minutu."
  hu: "A Claude frissül. Próbáld újra egy perc múlva."
  ro: "Claude se actualizează. Încearcă din nou peste un minut."
  el: "Το Claude ενημερώνεται. Δοκιμάστε ξανά σε ένα λεπτό."
  id: "Claude sedang memperbarui. Coba lagi dalam semenit."
  vi: "Claude đang cập nhật. Hãy thử lại sau một phút."
  th: "Claude กำลังอัปเดต ลองอีกครั้งในอีกหนึ่งนาที"
  hi: "Claude अपडेट हो रहा है। एक मिनट बाद फिर कोशिश करें।"
