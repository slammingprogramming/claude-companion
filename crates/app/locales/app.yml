  pl: "Claude Companion zmienił to w ustawieniach Claude Code."
  tr: "Claude Companion bunu Claude Code ayarlarında değiştirdi."
  uk: "Claude Companion змінив це в параметрах Claude Code."
  sv: "Claude Companion ändrade detta i Claude Codes inställningar."
