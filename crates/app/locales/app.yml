"tools.groups.detail":
  en: "Merge the groups of all accounts now. Claude must be closed; a backup of its Local Storage is kept first."
  zh-CN: "立即合并所有账户的分组。需要先关闭 Claude，并会先备份其本地存储。"
  zh-TW: "立即合併所有帳號的群組。需要先關閉 Claude，並會先備份其本機儲存空間。"
  ja: "すべてのアカウントのグループを今すぐ統合します。Claude を終了しておく必要があり、先にローカルストレージをバックアップします。"
  ko: "모든 계정의 그룹을 지금 병합합니다. Claude를 종료해야 하며 로컬 저장소를 먼저 백업합니다."
  fr: "Fusionne dès maintenant les groupes de tous les comptes. Claude doit être fermé ; son stockage local est d’abord sauvegardé."
  de: "Führt die Gruppen aller Konten jetzt zusammen. Claude muss geschlossen sein; sein lokaler Speicher wird vorher gesichert."
  es: "Combina ahora los grupos de todas las cuentas. Claude debe estar cerrado; antes se guarda una copia de su almacenamiento local."
  pt-BR: "Mescla agora os grupos de todas as contas. O Claude precisa estar fechado; antes é feito um backup do armazenamento local dele."
  ru: "Объединяет группы всех аккаунтов сейчас. Claude должен быть закрыт; сначала сохраняется резервная копия его локального хранилища."
  it: "Unisci ora i gruppi di tutti gli account. Claude deve essere chiuso; prima viene creato un backup del suo Local Storage."
  nl: "Voeg de groepen van alle accounts nu samen. Claude moet gesloten zijn; eerst wordt een back-up van de Local Storage bewaard."
  pl: "Scal teraz grupy wszystkich kont. Claude musi być zamknięty; wcześniej powstaje kopia zapasowa jego Local Storage."
  tr: "Tüm hesapların gruplarını şimdi birleştirin. Claude kapalı olmalı; önce Local Storage’ının yedeği alınır."
  uk: "Об’єднайте групи всіх облікових записів зараз. Claude має бути закритий; спершу створюється резервна копія його Local Storage."
  sv: "Slå ihop alla kontons grupper nu. Claude måste vara stängt; en säkerhetskopia av dess Local Storage sparas först."
  da: "Flet grupperne fra alle konti nu. Claude skal være lukket; en sikkerhedskopi af dens Local Storage gemmes først."
  nb: "Slå sammen gruppene fra alle kontoer nå. Claude må være lukket; en sikkerhetskopi av dens Local Storage lagres først."
  fi: "Yhdistä kaikkien tilien ryhmät nyt. Clauden on oltava suljettuna; sen Local Storagesta tallennetaan ensin varmuuskopio."
  cs: "Sloučit skupiny všech účtů nyní. Claude musí být zavřený; nejprve se uloží záloha jeho Local Storage."
  hu: "Az összes fiók csoportjainak egyesítése most. A Claude-nak be kell lennie zárva; előbb biztonsági mentés készül a Local Storage-áról."
  ro: "Îmbină acum grupurile tuturor conturilor. Claude trebuie să fie închis; mai întâi se salvează o copie de rezervă a Local Storage."
  el: "Συγχωνεύστε τώρα τις ομάδες όλων των λογαριασμών. Το Claude πρέπει να είναι κλειστό· αποθηκεύεται πρώτα αντίγραφο ασφαλείας του Local Storage."
  id: "Gabungkan grup semua akun sekarang. Claude harus ditutup; cadangan Local Storage-nya disimpan dahulu."
  vi: "Gộp ngay các nhóm của mọi tài khoản. Claude phải đóng; một bản sao lưu Local Storage của nó được lưu trước."
  th: "รวมกลุ่มของทุกบัญชีเดี๋ยวนี้ Claude ต้องปิดอยู่ โดยจะบันทึกข้อมูลสำรองของ Local Storage ก่อน"
  hi: "सभी खातों के समूह अभी मर्ज करें। Claude बंद होना चाहिए; पहले उसके Local Storage का बैकअप सहेजा जाता है।"
