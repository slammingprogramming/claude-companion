"tools.diagnostics.detail":
  en: "What every account has, what a sync would change, and anything that needs attention."
  zh-CN: "每个账户有什么、同步会改动什么，以及需要注意的事项。"
  zh-TW: "每個帳號有什麼、同步會變更什麼，以及需要注意的事項。"
  ja: "各アカウントの内容、同期で変わること、注意が必要な点。"
  ko: "각 계정에 있는 것, 동기화로 바뀔 것, 주의가 필요한 사항입니다."
  fr: "Ce que contient chaque compte, ce que changerait une synchronisation et ce qui demande attention."
  de: "Was jedes Konto hat, was eine Synchronisierung ändern würde und was Aufmerksamkeit braucht."
  es: "Lo que tiene cada cuenta, lo que cambiaría una sincronización y lo que necesita atención."
  pt-BR: "O que cada conta tem, o que uma sincronização mudaria e o que precisa de atenção."
  ru: "Что есть в каждом аккаунте, что изменит синхронизация и на что стоит обратить внимание."
  it: "Cosa ha ogni account, cosa cambierebbe una sincronizzazione e tutto ciò che richiede attenzione."
  nl: "Wat elk account heeft, wat een synchronisatie zou wijzigen en alles wat aandacht nodig heeft."
  pl: "Co ma każde konto, co zmieniłaby synchronizacja i wszystko, co wymaga uwagi."
  tr: "Her hesabın neye sahip olduğu, bir eşitlemenin neyi değiştireceği ve dikkat gerektiren her şey."
  uk: "Що є в кожному обліковому записі, що змінила б синхронізація та все, що потребує уваги."
  sv: "Vad varje konto har, vad en synkronisering skulle ändra och allt som behöver uppmärksamhet."
  da: "Hvad hver konto har, hvad en synkronisering ville ændre, og alt, der kræver opmærksomhed."
  nb: "Hva hver konto har, hva en synkronisering ville endret, og alt som trenger oppmerksomhet."
  fi: "Mitä kullakin tilillä on, mitä synkronointi muuttaisi ja kaikki huomiota vaativa."
  cs: "Co má každý účet, co by synchronizace změnila a vše, co vyžaduje pozornost."
  hu: "Mi van minden fióknál, mit változtatna egy szinkronizálás, és minden, ami figyelmet igényel."
  ro: "Ce are fiecare cont, ce ar schimba o sincronizare și tot ce necesită atenție."
  el: "Τι έχει κάθε λογαριασμός, τι θα άλλαζε ένας συγχρονισμός και ό,τι χρειάζεται προσοχή."
  id: "Apa yang dimiliki setiap akun, apa yang akan diubah sinkronisasi, dan semua yang perlu diperhatikan."
  vi: "Mỗi tài khoản có gì, đồng bộ sẽ thay đổi gì và mọi thứ cần chú ý."
  th: "สิ่งที่แต่ละบัญชีมี สิ่งที่การซิงค์จะเปลี่ยน และทุกอย่างที่ต้องให้ความสนใจ"
  hi: "हर खाते में क्या है, सिंक क्या बदलेगा और ध्यान देने योग्य हर चीज़।"
