  ja: "別のツールが %{count} 個のセッションフォルダをリンクに変えたため、Claude はそこにセッションを保存できなくなっています。"
  ko: "다른 도구가 세션 폴더 %{count}개를 링크로 바꿔서 Claude가 그곳에 세션을 저장하지 못합니다."
  fr: "Un autre outil a lié %{count} dossiers de sessions, et Claude n’y enregistre plus rien."
  de: "Ein anderes Tool hat %{count} Sitzungsordner verknüpft, und Claude speichert dort keine Sitzungen mehr."
  es: "Otra herramienta enlazó %{count} carpetas de sesiones y Claude ya no guarda sesiones allí."
  pt-BR: "Outra ferramenta vinculou %{count} pastas de sessões, e o Claude parou de salvar sessões nelas."
  it: "Un altro strumento ha collegato %{count} cartelle di sessioni e Claude smette di salvarvi le sessioni."
  nl: "Een ander hulpprogramma heeft %{count} sessiemappen gekoppeld, waardoor Claude daar geen sessies meer opslaat."
  tr: "Başka bir araç %{count} oturum klasörünü bağladı, bu yüzden Claude oralara oturum kaydedemiyor."
  sv: "Ett annat verktyg har länkat %{count} sessionsmappar, så Claude slutar spara sessioner i dem."
  da: "Et andet værktøj har linket %{count} sessionsmapper, så Claude holder op med at gemme sessioner i dem."
  nb: "Et annet verktøy har koblet %{count} øktmapper, så Claude slutter å lagre økter i dem."
  fi: "Toinen työkalu on linkittänyt %{count} istuntokansiota, joten Claude ei enää tallenna niihin istuntoja."
  cs: "Jiný nástroj propojil %{count} složek relací, takže do nich Claude přestává ukládat relace."
  hu: "Egy másik eszköz %{count} munkamenet-mappát hivatkozássá alakított, ezért a Claude nem menti oda a munkameneteket."
  ro: "Un alt instrument a legat %{count} de dosare de sesiuni, așa că Claude nu mai salvează sesiuni în ele."
  el: "Ένα άλλο εργαλείο συνέδεσε %{count} φακέλους συνεδριών, οπότε το Claude σταματά να αποθηκεύει συνεδρίες σε αυτούς."
  id: "Alat lain telah menautkan %{count} folder sesi, sehingga Claude berhenti menyimpan sesi di sana."
  vi: "Một công cụ khác đã liên kết %{count} thư mục phiên, nên Claude ngừng lưu phiên vào đó."
  th: "เครื่องมืออื่นลิงก์โฟลเดอร์เซสชันไว้ %{count} โฟลเดอร์ Claude จึงหยุดบันทึกเซสชันลงในโฟลเดอร์เหล่านั้น"
