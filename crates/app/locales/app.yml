"switch.unsupported":
  en: "Switching accounts isn’t available on this system yet."
  zh-CN: "这个系统暂时还不支持切换账号。"
  zh-TW: "這個系統暫時還不支援切換帳號。"
  ja: "このシステムではまだアカウントを切り替えられません。"
  ko: "이 시스템에서는 아직 계정을 전환할 수 없습니다."
