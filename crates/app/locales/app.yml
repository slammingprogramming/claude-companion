  fr: "Claude redémarre sur sa page de connexion. Connectez-vous-y en tant que %{account}."
  de: "Claude startet neu und zeigt die Anmeldeseite. Melde dich dort als %{account} an."
  es: "Claude se reinicia en su página de inicio de sesión. Inicia sesión allí como %{account}."
  pt-BR: "O Claude reinicia na página de login. Entre lá como %{account}."
