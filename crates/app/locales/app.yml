  ko: "한동안 사용하지 않아 Claude가 다시 로그인하라고 할 수 있습니다."
  fr: "Inutilisé depuis un moment : Claude pourrait vous demander de vous reconnecter."
  de: "Länger nicht benutzt: Claude fragt eventuell erneut nach der Anmeldung."
  es: "Hace tiempo que no se usa: Claude podría pedirte que vuelvas a iniciar sesión."
  pt-BR: "Faz tempo que não é usada: o Claude pode pedir para entrar de novo."
  ru: "Давно не использовался: Claude может попросить войти снова."
  it: "È passato un po’ di tempo: Claude potrebbe chiederti di accedere di nuovo."
  nl: "Het is al een tijd geleden: Claude vraagt je mogelijk opnieuw aan te melden."
  pl: "Minęło trochę czasu: Claude może poprosić o ponowne zalogowanie."
  tr: "Epey zaman geçti: Claude yeniden oturum açmanızı isteyebilir."
  uk: "Минуло чимало часу: Claude може попросити вас увійти знову."
  sv: "Det var ett tag sedan: Claude kan be dig logga in igen."
  da: "Der er gået et stykke tid: Claude beder dig måske om at logge ind igen."
  nb: "Det er en stund siden: Claude kan be deg logge inn på nytt."
  fi: "Edellisestä kerrasta on aikaa: Claude saattaa pyytää sinua kirjautumaan uudelleen."
  cs: "Uplynula delší doba: Claude vás může požádat o nové přihlášení."
  hu: "Már régen volt: a Claude kérheti, hogy jelentkezz be újra."
  ro: "A trecut o vreme: Claude ți-ar putea cere să te autentifici din nou."
  el: "Έχει περάσει καιρός: το Claude μπορεί να σας ζητήσει να συνδεθείτε ξανά."
  id: "Sudah cukup lama: Claude mungkin meminta Anda masuk lagi."
  vi: "Đã khá lâu: Claude có thể yêu cầu bạn đăng nhập lại."
  th: "ผ่านมาสักพักแล้ว: Claude อาจขอให้คุณลงชื่อเข้าใช้อีกครั้ง"
  hi: "काफ़ी समय हो गया: Claude आपसे फिर से साइन इन करने को कह सकता है।"
