"settings.kept.long":
  en: "Sessions stay reopenable for as long as you are likely to need them."
  zh-CN: "在你可能需要的时间里，会话都能重新打开。"
  zh-TW: "在你可能需要的時間裡，工作階段都能重新開啟。"
  ja: "必要になりそうな期間は、セッションを開き直せます。"
  ko: "필요한 기간 동안 세션을 다시 열 수 있습니다."
  fr: "Les sessions restent rouvrables aussi longtemps que vous en aurez sans doute besoin."
  de: "Sitzungen lassen sich so lange öffnen, wie du sie voraussichtlich brauchst."
  es: "Las sesiones se pueden reabrir durante todo el tiempo que probablemente las necesites."
  pt-BR: "As sessões continuam reabríveis pelo tempo que você provavelmente vai precisar."
  ru: "Сессии можно будет открыть столько, сколько они, скорее всего, понадобятся."
  it: "Le sessioni restano riapribili per tutto il tempo in cui è probabile che ti servano."
  nl: "Sessies blijven te heropenen zolang je ze waarschijnlijk nodig hebt."
  pl: "Sesje można ponownie otworzyć tak długo, jak prawdopodobnie będą potrzebne."
  tr: "Oturumlar, büyük olasılıkla ihtiyaç duyulduğu sürece yeniden açılabilir."
  uk: "Сеанси можна повторно відкрити стільки, скільки вони, імовірно, потрібні."
  sv: "Sessioner kan öppnas igen så länge de sannolikt behövs."
  da: "Sessioner kan genåbnes, så længe de sandsynligvis er brug for."
  nb: "Økter kan åpnes igjen så lenge de sannsynligvis trengs."
  fi: "Istunnot voi avata uudelleen niin kauan kuin niitä todennäköisesti tarvitaan."
  cs: "Relace lze znovu otevřít, dokud je pravděpodobně budete potřebovat."
  hu: "A munkamenetek addig nyithatók meg újra, amíg valószínűleg szükség van rájuk."
  ro: "Sesiunile pot fi redeschise cât timp probabil sunt necesare."
  el: "Οι συνεδρίες μπορούν να ανοίξουν ξανά όσο πιθανώς χρειάζονται."
  id: "Sesi dapat dibuka kembali selama kemungkinan masih dibutuhkan."
  vi: "Có thể mở lại các phiên chừng nào còn có thể cần đến."
  th: "เปิดเซสชันซ้ำได้ตราบเท่าที่อาจยังจำเป็น"
  hi: "सत्र तब तक दोबारा खोले जा सकते हैं जब तक उनकी संभावित ज़रूरत हो।"
