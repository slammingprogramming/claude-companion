  el: "Κλείστε και ανοίξτε ξανά το Claude για να δείτε τις %{count} συνεδρίες που αντιγράφηκαν στον λογαριασμό %{account}."
  id: "Keluar lalu buka kembali Claude untuk melihat %{count} sesi yang disalin ke %{account}."
  vi: "Hãy thoát rồi mở lại Claude để xem %{count} phiên đã sao chép sang %{account}."
  th: "ออกจาก Claude แล้วเปิดใหม่เพื่อดู %{count} เซสชันที่คัดลอกไปยัง %{account}"
