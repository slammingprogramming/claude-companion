  ko: "%{usage} · %{ago} Claude가 읽음. 메뉴 막대의 Claude 아이콘을 오른쪽 클릭하면 다시 읽습니다."
  fr: "%{usage} · lu par Claude %{ago}. Faites un clic droit sur l’icône de Claude dans la barre des menus pour qu’il vérifie à nouveau."
  de: "%{usage} · %{ago} von Claude gelesen. Klicke mit der rechten Maustaste auf Claudes Symbol in der Menüleiste, damit es erneut nachsieht."
