"fix.body":
  en: "Each linked session folder becomes a real folder holding a copy of what it pointed to. Nothing is deleted."
  zh-CN: "每个被链接的会话文件夹都会变回真正的文件夹，里面是它原来指向内容的副本。不会删除任何东西。"
  zh-TW: "每個被連結的工作階段資料夾都會變回真正的資料夾，裡面是它原本指向內容的副本。不會刪除任何東西。"
  ja: "リンクされたセッションフォルダは、リンク先の内容をコピーした通常のフォルダになります。何も削除されません。"
  ko: "연결된 세션 폴더는 가리키던 내용의 복사본을 담은 실제 폴더가 됩니다. 아무것도 삭제되지 않습니다."
  fr: "Chaque dossier de sessions lié devient un vrai dossier contenant une copie de sa cible. Rien n’est supprimé."
  de: "Jeder verknüpfte Sitzungsordner wird zu einem echten Ordner mit einer Kopie dessen, worauf er gezeigt hat. Nichts wird gelöscht."
  es: "Cada carpeta de sesiones enlazada pasa a ser una carpeta real con una copia de su destino. No se borra nada."
  pt-BR: "Cada pasta de sessões vinculada vira uma pasta de verdade, com uma cópia do destino. Nada é apagado."
  ru: "Каждая связанная папка сессий станет настоящей папкой с копией того, на что она указывала. Ничего не удаляется."
  it: "Ogni cartella di sessioni collegata diventa una cartella vera con una copia di ciò a cui puntava. Non viene eliminato nulla."
  nl: "Elke gekoppelde sessiemap wordt een echte map met een kopie van waarnaar hij verwees. Er wordt niets verwijderd."
  pl: "Każdy połączony folder sesji staje się prawdziwym folderem z kopią tego, na co wskazywał. Nic nie jest usuwane."
  tr: "Bağlantılı her oturum klasörü, işaret ettiği yerin kopyasını içeren gerçek bir klasör olur. Hiçbir şey silinmez."
  uk: "Кожна пов’язана папка сеансів стане справжньою папкою з копією того, на що вона вказувала. Нічого не видаляється."
  sv: "Varje länkad sessionsmapp blir en riktig mapp med en kopia av det den pekade på. Inget raderas."
  da: "Hver linket sessionsmappe bliver en rigtig mappe med en kopi af det, den pegede på. Intet slettes."
  nb: "Hver koblede øktmappe blir en ekte mappe med en kopi av det den pekte på. Ingenting slettes."
  fi: "Jokaisesta linkitetystä istuntokansiosta tulee oikea kansio, jossa on kopio siitä, mihin se osoitti. Mitään ei poisteta."
  cs: "Každá propojená složka relací se stane skutečnou složkou s kopií toho, na co ukazovala. Nic se nemaže."
  hu: "Minden hivatkozott munkamenet-mappa valódi mappává válik, abból a másolatból, amire mutatott. Semmi sem törlődik."
  ro: "Fiecare dosar de sesiuni legat devine un dosar real, cu o copie a ceea ce indica. Nu se șterge nimic."
  el: "Κάθε συνδεδεμένος φάκελος συνεδριών γίνεται πραγματικός φάκελος με αντίγραφο αυτού στο οποίο έδειχνε. Τίποτα δεν διαγράφεται."
  id: "Setiap folder sesi tertaut menjadi folder sungguhan berisi salinan dari yang ditunjuknya. Tidak ada yang dihapus."
  vi: "Mỗi thư mục phiên liên kết trở thành thư mục thật chứa bản sao của nơi nó trỏ tới. Không có gì bị xóa."
  th: "โฟลเดอร์เซสชันที่ลิงก์ไว้แต่ละรายการจะกลายเป็นโฟลเดอร์จริงที่มีสำเนาของสิ่งที่มันชี้ไป จะไม่มีอะไรถูกลบ"
  hi: "हर लिंक किया हुआ सत्र फ़ोल्डर एक असली फ़ोल्डर बन जाता है, जिसमें उसकी इंगित की हुई चीज़ की कॉपी होती है। कुछ भी हटाया नहीं जाता।"
