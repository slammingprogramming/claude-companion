"tools.copy.orgs":
  en: "An account with several organizations needs `claude-companion chats copy` on the command line to pick one."
  zh-CN: "有多个组织的账户需要在命令行中用 `claude-companion chats copy` 指定组织。"
  zh-TW: "有多個組織的帳號需要在命令列中用 `claude-companion chats copy` 指定組織。"
  ja: "複数の組織があるアカウントは、コマンドラインの `claude-companion chats copy` で組織を指定してください。"
  ko: "조직이 여러 개인 계정은 명령줄의 `claude-companion chats copy`로 조직을 지정해야 합니다."
  fr: "Un compte avec plusieurs organisations nécessite `claude-companion chats copy` en ligne de commande pour en choisir une."
  de: "Bei einem Konto mit mehreren Organisationen muss die Organisation mit `claude-companion chats copy` auf der Kommandozeile gewählt werden."
  es: "Una cuenta con varias organizaciones requiere `claude-companion chats copy` en la línea de comandos para elegir una."
  pt-BR: "Uma conta com várias organizações exige `claude-companion chats copy` na linha de comando para escolher uma."
  ru: "Для аккаунта с несколькими организациями выберите организацию командой `claude-companion chats copy` в терминале."
  it: "Un account con più organizzazioni richiede `claude-companion chats copy` dalla riga di comando per sceglierne una."
  nl: "Voor een account met meerdere organisaties moet je `claude-companion chats copy` op de opdrachtregel gebruiken om er één te kiezen."
  pl: "Konto z kilkoma organizacjami wymaga polecenia `claude-companion chats copy` w wierszu poleceń, aby wybrać jedną."
  tr: "Birden çok kuruluşu olan bir hesap için birini seçmek üzere komut satırında `claude-companion chats copy` kullanın."
  uk: "Для облікового запису з кількома організаціями використайте в командному рядку `claude-companion chats copy`, щоб вибрати одну."
  sv: "För ett konto med flera organisationer, använd `claude-companion chats copy` på kommandoraden för att välja en."
  da: "For en konto med flere organisationer skal du bruge `claude-companion chats copy` på kommandolinjen for at vælge én."
  nb: "For en konto med flere organisasjoner, bruk `claude-companion chats copy` på kommandolinjen for å velge én."
  fi: "Jos tilillä on useita organisaatioita, valitse yksi komentorivillä komennolla `claude-companion chats copy`."
  cs: "U účtu s více organizacemi použijte na příkazovém řádku `claude-companion chats copy` a jednu vyberte."
  hu: "Több szervezettel rendelkező fióknál a parancssorban használd a `claude-companion chats copy` parancsot, hogy kiválaszd az egyiket."
  ro: "Pentru un cont cu mai multe organizații, folosește `claude-companion chats copy` în linia de comandă ca să alegi una."
  el: "Για λογαριασμό με πολλούς οργανισμούς, χρησιμοποιήστε στη γραμμή εντολών το `claude-companion chats copy` για να επιλέξετε έναν."
  id: "Untuk akun dengan banyak organisasi, gunakan `claude-companion chats copy` di baris perintah untuk memilih salah satu."
  vi: "Với tài khoản có nhiều tổ chức, hãy dùng `claude-companion chats copy` trên dòng lệnh để chọn một."
  th: "สำหรับบัญชีที่มีหลายองค์กร ให้ใช้ `claude-companion chats copy` ในบรรทัดคำสั่งเพื่อเลือกหนึ่งองค์กร"
  hi: "कई संगठनों वाले खाते के लिए, एक चुनने हेतु कमांड लाइन पर `claude-companion chats copy` इस्तेमाल करें।"
