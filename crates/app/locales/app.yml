"rescue.body":
  en: "Claude Companion gives them a card again, so Claude shows them after it restarts. Your accounts that sync get them too. Nothing is deleted, and you can undo it from Snapshots."
  zh-CN: "Claude Companion 会重新为它们创建卡片，Claude 重启后就会显示。参与同步的账户也会收到。不会删除任何内容，并且可以在“快照”中撤销。"
  zh-TW: "Claude Companion 會重新為它們建立卡片，Claude 重新啟動後就會顯示。參與同步的帳號也會收到。不會刪除任何內容，並且可以在「快照」中還原。"
  ja: "Claude Companion がカードを作り直すので、Claude の再起動後に表示されます。同期しているアカウントにも届きます。何も削除されず、スナップショットから元に戻せます。"
  ko: "Claude Companion이 카드를 다시 만들어 Claude를 다시 시작하면 표시됩니다. 동기화하는 계정에도 전달됩니다. 아무것도 삭제되지 않으며 스냅샷에서 되돌릴 수 있습니다."
  fr: "Claude Companion leur redonne une fiche : Claude les affichera après son redémarrage. Vos comptes synchronisés les recevront aussi. Rien n’est supprimé, et vous pouvez annuler depuis les instantanés."
  de: "Claude Companion legt dafür wieder eine Karte an, damit Claude sie nach einem Neustart zeigt. Konten, die synchronisieren, bekommen sie auch. Es wird nichts gelöscht, und du kannst es über die Schnappschüsse rückgängig machen."
  es: "Claude Companion les vuelve a crear una ficha para que Claude las muestre tras reiniciarse. Las cuentas que sincronizan también las reciben. No se borra nada y puedes deshacerlo desde las instantáneas."
  pt-BR: "O Claude Companion cria um cartão para elas de novo, e o Claude as mostra depois de reiniciar. As contas que sincronizam também as recebem. Nada é apagado, e você pode desfazer pelos instantâneos."
  ru: "Claude Companion создаст для них карточки заново, и Claude покажет их после перезапуска. Аккаунты с синхронизацией тоже получат их. Ничего не удаляется, а отменить можно через снимки."
  it: "Claude Companion dà loro di nuovo una scheda, così Claude le mostra dopo il riavvio. Anche i tuoi account sincronizzati le ricevono. Non viene eliminato nulla e puoi annullare da Snapshot."
  nl: "Claude Companion geeft ze weer een kaart, zodat Claude ze na een herstart toont. Je accounts die synchroniseren krijgen ze ook. Er wordt niets verwijderd en je kunt het ongedaan maken via Momentopnamen."
  pl: "Claude Companion nadaje im ponownie kartę, aby Claude pokazał je po ponownym uruchomieniu. Dostają je także Twoje konta objęte synchronizacją. Nic nie jest usuwane, a można to cofnąć w Migawkach."
  tr: "Claude Companion bunlara yeniden bir kart verir, böylece Claude yeniden başlayınca gösterir. Eşitlenen hesaplarınız da alır. Hiçbir şey silinmez ve Anlık görüntüler’den geri alabilirsiniz."
  uk: "Claude Companion знову дає їм картку, щоб Claude показав їх після перезапуску. Ваші облікові записи, що синхронізуються, теж їх отримають. Нічого не видаляється, і це можна скасувати через «Знімки»."
  sv: "Claude Companion ger dem ett kort igen så att Claude visar dem efter en omstart. Dina synkroniserande konton får dem också. Inget raderas och du kan ångra via Ögonblicksbilder."
  da: "Claude Companion giver dem et kort igen, så Claude viser dem efter en genstart. Dine synkroniserende konti får dem også. Intet slettes, og du kan fortryde via Øjebliksbilleder."
  nb: "Claude Companion gir dem et kort igjen slik at Claude viser dem etter en omstart. Kontoene dine som synkroniserer, får dem også. Ingenting slettes, og du kan angre via Øyeblikksbilder."
  fi: "Claude Companion antaa niille kortin uudelleen, jotta Claude näyttää ne uudelleenkäynnistyksen jälkeen. Synkronoivat tilisi saavat ne myös. Mitään ei poisteta, ja voit kumota tämän Tilannevedokset-kohdasta."
  cs: "Claude Companion jim znovu dá kartu, aby je Claude po restartu zobrazil. Dostanou je i vaše synchronizované účty. Nic se nemaže a můžete to vrátit přes Snímky."
  hu: "A Claude Companion újra kártyát ad nekik, hogy a Claude újraindítás után megjelenítse őket. A szinkronizáló fiókjaid is megkapják. Semmi sem törlődik, és a Pillanatképekben visszavonhatod."
  ro: "Claude Companion le dă din nou o fișă, ca Claude să le arate după repornire. Conturile tale care se sincronizează le primesc și ele. Nu se șterge nimic și poți anula din Instantanee."
  el: "Το Claude Companion τους ξαναδίνει μια κάρτα, ώστε το Claude να τις εμφανίσει μετά την επανεκκίνηση. Τις παίρνουν και οι λογαριασμοί σας που συγχρονίζονται. Τίποτα δεν διαγράφεται και μπορείτε να το αναιρέσετε από τα Στιγμιότυπα."
  id: "Claude Companion memberi mereka kartu lagi agar Claude menampilkannya setelah dimulai ulang. Akun Anda yang tersinkron juga mendapatkannya. Tidak ada yang dihapus dan Anda dapat mengurungkannya lewat Rekam jepret."
  vi: "Claude Companion cấp lại thẻ cho chúng để Claude hiện chúng sau khi khởi động lại. Các tài khoản đồng bộ của bạn cũng nhận được. Không có gì bị xóa và bạn có thể hoàn tác qua Ảnh chụp."
  th: "Claude Companion จะให้การ์ดแก่แชตเหล่านี้อีกครั้ง เพื่อให้ Claude แสดงหลังเริ่มใหม่ บัญชีของคุณที่ซิงค์อยู่ก็จะได้รับเช่นกัน ไม่มีอะไรถูกลบและคุณเลิกทำได้ผ่านสแนปชอต"
  hi: "Claude Companion उन्हें फिर से एक कार्ड देता है, ताकि Claude फिर से शुरू होने पर उन्हें दिखाए। आपके सिंक होने वाले खातों को भी वे मिल जाती हैं। कुछ भी हटाया नहीं जाता और आप स्नैपशॉट से इसे पूर्ववत कर सकते हैं।"
