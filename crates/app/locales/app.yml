"tools.desktop.detail":
  en: "Start the Claude app. To quit it, use its menu or tray icon (or `claude-companion quit` in a terminal)."
  zh-CN: "启动 Claude 应用。要退出，请使用它的菜单或托盘图标（或在终端运行 `claude-companion quit`）。"
  zh-TW: "啟動 Claude 應用程式。要結束，請使用它的選單或系統匣圖示（或在終端機執行 `claude-companion quit`）。"
  ja: "Claude アプリを起動します。終了するにはアプリのメニューかトレイアイコンを使います（ターミナルでは `claude-companion quit`）。"
  ko: "Claude 앱을 시작합니다. 종료하려면 앱 메뉴나 트레이 아이콘을 사용하세요(터미널에서는 `claude-companion quit`)."
  fr: "Lance l’application Claude. Pour la quitter, utilisez son menu ou l’icône de la zone de notification (ou `claude-companion quit` dans un terminal)."
  de: "Startet die Claude-App. Zum Beenden das Menü oder das Tray-Symbol verwenden (oder `claude-companion quit` im Terminal)."
  es: "Inicia la aplicación Claude. Para cerrarla, usa su menú o el icono de la bandeja (o `claude-companion quit` en una terminal)."
  pt-BR: "Inicia o aplicativo Claude. Para encerrá-lo, use o menu dele ou o ícone da bandeja (ou `claude-companion quit` em um terminal)."
  ru: "Запускает приложение Claude. Чтобы выйти, используйте его меню или значок в трее (или `claude-companion quit` в терминале)."
  it: "Avvia l’app Claude. Per chiuderla usa il suo menu o l’icona nell’area di notifica (oppure `claude-companion quit` in un terminale)."
  nl: "Start de Claude-app. Sluit hem af via het menu of het systeemvakicoon (of `claude-companion quit` in een terminal)."
  pl: "Uruchom aplikację Claude. Aby ją zamknąć, użyj jej menu lub ikony w zasobniku (albo `claude-companion quit` w terminalu)."
  tr: "Claude uygulamasını başlatın. Menüsünden veya tepsi simgesinden çıkın (ya da terminalde `claude-companion quit`)."
  uk: "Запустіть застосунок Claude. Закрийте його через меню або значок у треї (чи `claude-companion quit` у терміналі)."
  sv: "Starta Claude-appen. Avsluta den från dess meny eller ikonen i systemfältet (eller `claude-companion quit` i en terminal)."
  da: "Start Claude-appen. Afslut den fra dens menu eller ikonet i systembakken (eller `claude-companion quit` i en terminal)."
  nb: "Start Claude-appen. Avslutt den fra menyen eller ikonet i systemstatusfeltet (eller `claude-companion quit` i en terminal)."
  fi: "Käynnistä Claude-sovellus. Lopeta se sen valikosta tai ilmoitusalueen kuvakkeesta (tai komennolla `claude-companion quit` päätteessä)."
  cs: "Spusťte aplikaci Claude. Ukončete ji z její nabídky nebo z ikony v oznamovací oblasti (nebo `claude-companion quit` v terminálu)."
  hu: "Indítsd el a Claude alkalmazást. Lépj ki belőle a menüjéből vagy az értesítési terület ikonjáról (vagy terminálban a `claude-companion quit` paranccsal)."
  ro: "Pornește aplicația Claude. Ieși din ea din meniul ei sau din pictograma din zona de notificare (sau `claude-companion quit` într-un terminal)."
  el: "Ξεκινήστε την εφαρμογή Claude. Κλείστε την από το μενού της ή το εικονίδιο στην περιοχή ειδοποιήσεων (ή με `claude-companion quit` σε τερματικό)."
  id: "Mulai aplikasi Claude. Keluar dari menunya atau ikon di baki sistem (atau `claude-companion quit` di terminal)."
  vi: "Khởi động ứng dụng Claude. Thoát từ menu của nó hoặc biểu tượng trong khay hệ thống (hoặc `claude-companion quit` trong terminal)."
  th: "เริ่มแอป Claude ออกจากแอปได้จากเมนูของแอปหรือไอคอนในถาดระบบ (หรือ `claude-companion quit` ในเทอร์มินัล)"
  hi: "Claude ऐप शुरू करें। उसके मेन्यू या सिस्टम ट्रे के आइकन से बाहर निकलें (या टर्मिनल में `claude-companion quit`)।"
