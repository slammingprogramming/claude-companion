"tools.codelogin.detail":
  en: "Switch the account the terminal program is signed in to. Sign in with /login in `claude`, save it here, then switch between saved accounts. Close running Claude Code sessions first. Not available on macOS."
  zh-CN: "切换终端程序所用的账户。先在 `claude` 中用 /login 登录并在此保存，之后即可在已保存的账户间切换。请先关闭正在运行的 Claude Code 会话。macOS 上不可用。"
  zh-TW: "切換終端機程式所用的帳號。先在 `claude` 中用 /login 登入並在此儲存，之後即可在已儲存的帳號間切換。請先關閉執行中的 Claude Code 工作階段。macOS 上無法使用。"
  ja: "ターミナルのプログラムがサインインしているアカウントを切り替えます。`claude` で /login してここに保存し、保存済みのアカウント間で切り替えます。先に実行中の Claude Code セッションを閉じてください。macOS では使えません。"
  ko: "터미널 프로그램이 로그인한 계정을 전환합니다. `claude`에서 /login으로 로그인해 여기에 저장한 뒤 저장된 계정 사이를 전환하세요. 먼저 실행 중인 Claude Code 세션을 닫으세요. macOS에서는 사용할 수 없습니다."
  fr: "Change le compte avec lequel le programme du terminal est connecté. Connectez-vous avec /login dans `claude`, enregistrez ici, puis passez d’un compte enregistré à l’autre. Fermez d’abord les sessions Claude Code en cours. Indisponible sur macOS."
  de: "Wechselt das Konto, mit dem das Terminal-Programm angemeldet ist. Mit /login in `claude` anmelden, hier speichern und dann zwischen gespeicherten Konten wechseln. Laufende Claude-Code-Sitzungen vorher schließen. Unter macOS nicht verfügbar."
  es: "Cambia la cuenta con la que está conectado el programa de terminal. Inicia sesión con /login en `claude`, guárdala aquí y alterna entre las cuentas guardadas. Cierra antes las sesiones de Claude Code en curso. No disponible en macOS."
  pt-BR: "Troca a conta em que o programa do terminal está conectado. Entre com /login no `claude`, salve aqui e alterne entre as contas salvas. Feche antes as sessões do Claude Code em andamento. Indisponível no macOS."
  ru: "Переключает аккаунт, в котором выполнен вход в программу терминала. Войдите через /login в `claude`, сохраните здесь и переключайтесь между сохранёнными аккаунтами. Сначала закройте работающие сессии Claude Code. На macOS недоступно."
  it: "Cambia l’account con cui è connesso il programma da terminale. Accedi con /login in `claude`, salvalo qui, poi passa da un account salvato all’altro. Chiudi prima le sessioni di Claude Code in esecuzione. Non disponibile su macOS."
  nl: "Wissel het account waarmee het terminalprogramma is aangemeld. Meld je aan met /login in `claude`, bewaar het hier en wissel dan tussen bewaarde accounts. Sluit eerst lopende Claude Code-sessies. Niet beschikbaar op macOS."
  pl: "Przełącz konto, na które zalogowany jest program terminalowy. Zaloguj się poleceniem /login w `claude`, zapisz tutaj, a potem przełączaj się między zapisanymi kontami. Najpierw zamknij działające sesje Claude Code. Niedostępne w macOS."
  tr: "Terminal programının oturum açtığı hesabı değiştirin. `claude` içinde /login ile oturum açın, burada kaydedin, sonra kayıtlı hesaplar arasında geçin. Önce çalışan Claude Code oturumlarını kapatın. macOS’ta kullanılamaz."
  uk: "Змініть обліковий запис, під яким увійшла програма терміналу. Увійдіть через /login у `claude`, збережіть тут, а потім перемикайтеся між збереженими обліковими записами. Спершу закрийте запущені сеанси Claude Code. Недоступно в macOS."
  sv: "Byt konto som terminalprogrammet är inloggat med. Logga in med /login i `claude`, spara här och byt sedan mellan sparade konton. Avsluta pågående Claude Code-sessioner först. Inte tillgängligt på macOS."
  da: "Skift den konto, terminalprogrammet er logget ind med. Log ind med /login i `claude`, gem her, og skift derefter mellem gemte konti. Luk først kørende Claude Code-sessioner. Ikke tilgængeligt på macOS."
  nb: "Bytt kontoen terminalprogrammet er logget inn med. Logg inn med /login i `claude`, lagre her, og bytt deretter mellom lagrede kontoer. Avslutt kjørende Claude Code-økter først. Ikke tilgjengelig på macOS."
  fi: "Vaihda tiliä, jolla pääteohjelma on kirjautuneena. Kirjaudu komennolla /login ohjelmassa `claude`, tallenna täällä ja vaihda sitten tallennettujen tilien välillä. Sulje ensin käynnissä olevat Claude Code -istunnot. Ei saatavilla macOS:ssä."
  cs: "Přepněte účet, kterým je přihlášen terminálový program. Přihlaste se pomocí /login v `claude`, uložte zde a poté přepínejte mezi uloženými účty. Nejprve ukončete běžící relace Claude Code. Není dostupné v macOS."
  hu: "Válts fiókot, amellyel a terminálprogram be van jelentkezve. Jelentkezz be a /login paranccsal a `claude`-ban, mentsd itt, majd válts a mentett fiókok között. Előbb zárd be a futó Claude Code-munkameneteket. macOS-en nem érhető el."
  ro: "Schimbă contul cu care este autentificat programul din terminal. Autentifică-te cu /login în `claude`, salvează aici, apoi comută între conturile salvate. Închide mai întâi sesiunile Claude Code care rulează. Indisponibil pe macOS."
  el: "Αλλάξτε τον λογαριασμό με τον οποίο είναι συνδεδεμένο το πρόγραμμα τερματικού. Συνδεθείτε με /login στο `claude`, αποθηκεύστε εδώ και μετά αλλάζετε ανάμεσα στους αποθηκευμένους λογαριασμούς. Κλείστε πρώτα τις συνεδρίες Claude Code που τρέχουν. Μη διαθέσιμο στο macOS."
  id: "Ganti akun yang dipakai program terminal untuk masuk. Masuk dengan /login di `claude`, simpan di sini, lalu beralih di antara akun tersimpan. Tutup dahulu sesi Claude Code yang sedang berjalan. Tidak tersedia di macOS."
  vi: "Đổi tài khoản mà chương trình terminal đăng nhập. Đăng nhập bằng /login trong `claude`, lưu tại đây rồi chuyển giữa các tài khoản đã lưu. Hãy đóng các phiên Claude Code đang chạy trước. Không khả dụng trên macOS."
  th: "สลับบัญชีที่โปรแกรมเทอร์มินัลลงชื่อเข้าใช้อยู่ ลงชื่อเข้าใช้ด้วย /login ใน `claude` บันทึกที่นี่ แล้วสลับระหว่างบัญชีที่บันทึกไว้ ปิดเซสชัน Claude Code ที่กำลังทำงานอยู่ก่อน ไม่รองรับบน macOS"
  hi: "वह खाता बदलें जिससे टर्मिनल प्रोग्राम साइन इन है। `claude` में /login से साइन इन करें, यहाँ सहेजें, फिर सहेजे गए खातों के बीच बदलें। पहले चल रहे Claude Code सत्र बंद करें। macOS पर उपलब्ध नहीं।"
