"name.hint":
  en: "Up to %{max} letters, digits or - _ . with no spaces. Leave it empty to remove the name."
  zh-CN: "最多 %{max} 个字符，可用文字、数字及 - _ .，不含空格。留空即不命名。"
  zh-TW: "最多 %{max} 個字元，可用文字、數字及 - _ .，不含空格。留空即不命名。"
  ja: "文字・数字と - _ . を %{max} 字まで使えます。スペースは使えません。空にすると名前を外します。"
  ko: "글자·숫자와 - _ . 를 최대 %{max}자까지 쓸 수 있고, 공백은 안 됩니다. 비워 두면 이름이 지워집니다."
  fr: "Jusqu’à %{max} caractères : lettres, chiffres, - _ . et pas d’espaces. Laissez vide pour retirer le nom."
  de: "Bis zu %{max} Zeichen: Buchstaben, Ziffern, - _ . und keine Leerzeichen. Leer lassen, um den Namen zu entfernen."
  es: "Hasta %{max} caracteres: letras, cifras, - _ . y sin espacios. Déjalo vacío para quitar el nombre."
  pt-BR: "Até %{max} caracteres: letras, números, - _ . e sem espaços. Deixe vazio para tirar o nome."
  ru: "До %{max} символов: буквы, цифры, - _ . и без пробелов. Оставьте пустым, чтобы убрать имя."
  it: "Fino a %{max} lettere, cifre o - _ . senza spazi. Lascia vuoto per rimuovere il nome."
  nl: "Maximaal %{max} letters, cijfers of - _ . zonder spaties. Laat leeg om de naam te verwijderen."
  pl: "Do %{max} liter, cyfr lub znaków - _ . bez spacji. Zostaw puste, aby usunąć nazwę."
  tr: "En çok %{max} harf, rakam veya - _ . boşluksuz. Adı kaldırmak için boş bırakın."
  uk: "До %{max} літер, цифр або символів - _ . без пробілів. Залиште порожнім, щоб прибрати назву."
  sv: "Högst %{max} bokstäver, siffror eller - _ . utan mellanslag. Lämna tomt för att ta bort namnet."
  da: "Højst %{max} bogstaver, tal eller - _ . uden mellemrum. Lad stå tomt for at fjerne navnet."
  nb: "Maks %{max} bokstaver, tall eller - _ . uten mellomrom. La stå tomt for å fjerne navnet."
  fi: "Enintään %{max} kirjainta, numeroa tai merkkiä - _ . ilman välilyöntejä. Jätä tyhjäksi poistaaksesi nimen."
  cs: "Nejvýše %{max} písmen, číslic nebo znaků - _ . bez mezer. Chcete-li název odstranit, nechte prázdné."
  hu: "Legfeljebb %{max} betű, szám vagy - _ . szóköz nélkül. Hagyd üresen a név eltávolításához."
  ro: "Cel mult %{max} litere, cifre sau - _ . fără spații. Lasă gol pentru a elimina numele."
  el: "Έως %{max} γράμματα, ψηφία ή - _ . χωρίς κενά. Αφήστε το κενό για να αφαιρεθεί το όνομα."
  id: "Maksimal %{max} huruf, angka, atau - _ . tanpa spasi. Kosongkan untuk menghapus nama."
  vi: "Tối đa %{max} chữ cái, chữ số hoặc - _ . không có dấu cách. Để trống để xóa tên."
  th: "ไม่เกิน %{max} ตัวอักษร ตัวเลข หรือ - _ . โดยไม่มีช่องว่าง เว้นว่างไว้เพื่อลบชื่อ"
  hi: "अधिकतम %{max} अक्षर, अंक या - _ . बिना स्पेस के। नाम हटाने के लिए खाली छोड़ें।"
"name.invalid":
  en: "Use up to %{max} letters, digits, - _ or . with no spaces, not only digits, and not starting with -."
  zh-CN: "名字只能用文字、数字和 - _ .，最多 %{max} 个字符；不能有空格、不能全是数字、不能以 - 开头。"
  zh-TW: "名字只能用文字、數字和 - _ .，最多 %{max} 個字元；不能有空格、不能全是數字、不能以 - 開頭。"
  ja: "使えるのは文字・数字と - _ . の %{max} 字までです。スペース、数字だけ、- で始まる名前は使えません。"
  ko: "글자·숫자와 - _ . 만 최대 %{max}자까지 쓸 수 있습니다. 공백, 숫자만 있는 이름, - 로 시작하는 이름은 안 됩니다."
  fr: "Utilisez jusqu’à %{max} lettres, chiffres, - _ ou . : sans espaces, pas uniquement des chiffres, sans - au début."
  de: "Erlaubt sind bis zu %{max} Buchstaben, Ziffern, - _ oder . – ohne Leerzeichen, nicht nur Ziffern, nicht mit - am Anfang."
  es: "Usa hasta %{max} letras, cifras, - _ o . : sin espacios, no solo cifras y sin - al principio."
  pt-BR: "Use até %{max} letras, números, - _ ou . : sem espaços, não só números e sem - no começo."
  ru: "Можно до %{max} букв, цифр, - _ или . — без пробелов, не только цифры и не с - в начале."
  it: "Usa fino a %{max} lettere, cifre, - _ o . senza spazi, non solo cifre e senza iniziare con -."
  nl: "Gebruik maximaal %{max} letters, cijfers, - _ of . zonder spaties, niet alleen cijfers en niet beginnend met -."
  pl: "Użyj do %{max} liter, cyfr, znaków - _ lub . bez spacji, nie same cyfry i nie zaczynając od -."
  tr: "En çok %{max} harf, rakam, - _ veya . kullanın; boşluk olmasın, yalnızca rakamlardan oluşmasın ve - ile başlamasın."
  uk: "Використайте до %{max} літер, цифр, символів - _ або . без пробілів, не лише цифри й не починаючи з -."
  sv: "Använd högst %{max} bokstäver, siffror, - _ eller . utan mellanslag, inte enbart siffror och inte börja med -."
  da: "Brug højst %{max} bogstaver, tal, - _ eller . uden mellemrum, ikke kun tal og ikke begyndende med -."
  nb: "Bruk maks %{max} bokstaver, tall, - _ eller . uten mellomrom, ikke bare tall og ikke begynn med -."
  fi: "Käytä enintään %{max} kirjainta, numeroa tai merkkiä - _ . ilman välilyöntejä, ei pelkkiä numeroita eikä merkkiä - alussa."
  cs: "Použijte nejvýše %{max} písmen, číslic nebo znaků - _ . bez mezer, ne jen číslice a nezačínejte znakem -."
  hu: "Legfeljebb %{max} betűt, számot vagy - _ . karaktert használj szóköz nélkül, ne csak számokat, és ne kötőjellel kezdődjön."
  ro: "Folosește cel mult %{max} litere, cifre, - _ sau . fără spații, nu doar cifre și fără să începi cu -."
  el: "Χρησιμοποιήστε έως %{max} γράμματα, ψηφία, - _ ή . χωρίς κενά, όχι μόνο ψηφία και χωρίς να ξεκινά με -."
  id: "Gunakan maksimal %{max} huruf, angka, - _ atau . tanpa spasi, bukan hanya angka, dan tidak diawali -."
  vi: "Dùng tối đa %{max} chữ cái, chữ số, - _ hoặc . không có dấu cách, không chỉ toàn chữ số và không bắt đầu bằng -."
  th: "ใช้ตัวอักษร ตัวเลข - _ หรือ . ไม่เกิน %{max} ตัว โดยไม่มีช่องว่าง ไม่ใช่ตัวเลขล้วน และไม่ขึ้นต้นด้วย -"
  hi: "अधिकतम %{max} अक्षर, अंक, - _ या . बिना स्पेस के इस्तेमाल करें, केवल अंक नहीं, और - से शुरू न करें।"
