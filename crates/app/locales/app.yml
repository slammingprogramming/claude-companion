"name.body":
  en: "Shown in the list instead of the email or ID. The command line takes it too, wherever it asks for an account."
  zh-CN: "列表里会用它代替邮箱或 ID 显示；命令行里要指定账号时也能用它。"
  zh-TW: "列表裡會用它代替電子郵件或 ID 顯示；命令列裡要指定帳號時也能用它。"
  ja: "一覧ではメールアドレスや ID の代わりにこの名前を表示します。コマンドラインでアカウントを指定するときにも使えます。"
  ko: "목록에서 이메일이나 ID 대신 이 이름이 표시됩니다. 명령줄에서 계정을 지정할 때도 쓸 수 있습니다."
  fr: "La liste l’affiche à la place de l’e-mail ou de l’identifiant. La ligne de commande l’accepte aussi partout où elle demande un compte."
  de: "Die Liste zeigt ihn statt der E-Mail-Adresse oder ID. Die Befehlszeile versteht ihn überall, wo sie ein Konto erwartet."
  es: "La lista lo muestra en lugar del correo o el ID. La línea de comandos también lo acepta donde pide una cuenta."
  pt-BR: "A lista mostra este nome no lugar do e-mail ou do ID. A linha de comando também o aceita onde pede uma conta."
  ru: "В списке он показывается вместо почты или ID. Командная строка тоже понимает его везде, где нужно указать аккаунт."
  it: "Mostrato nell’elenco al posto dell’email o dell’ID. Anche la riga di comando lo accetta, ovunque chieda un account."
  nl: "Wordt in de lijst getoond in plaats van het e-mailadres of de ID. De opdrachtregel accepteert het ook, overal waar om een account wordt gevraagd."
  pl: "Pokazywana na liście zamiast adresu e-mail lub identyfikatora. Wiersz poleceń także ją przyjmuje, wszędzie tam, gdzie pyta o konto."
  tr: "E-posta adresi veya kimlik yerine listede gösterilir. Komut satırı da bir hesap istenen her yerde bunu kabul eder."
  uk: "Показується в списку замість адреси електронної пошти або ідентифікатора. Командний рядок також приймає її всюди, де потрібен обліковий запис."
  sv: "Visas i listan i stället för e-postadressen eller ID:t. Kommandoraden godtar det också överallt där ett konto efterfrågas."
  da: "Vises i listen i stedet for e-mailadressen eller id'et. Kommandolinjen accepterer det også overalt, hvor der bedes om en konto."
  nb: "Vises i listen i stedet for e-postadressen eller ID-en. Kommandolinjen godtar det også overalt der en konto etterspørres."
  fi: "Näytetään luettelossa sähköpostiosoitteen tai tunnuksen sijaan. Komentorivi hyväksyy sen myös kaikkialla, missä tiliä kysytään."
  cs: "Zobrazuje se v seznamu místo e-mailové adresy nebo ID. Příkazový řádek jej přijímá také všude, kde se žádá účet."
  hu: "Az e-mail-cím vagy az azonosító helyett jelenik meg a listában. A parancssor is elfogadja mindenhol, ahol fiókot kér."
  ro: "Afișat în listă în locul adresei de e-mail sau al ID-ului. Linia de comandă îl acceptă și ea oriunde se cere un cont."
  el: "Εμφανίζεται στη λίστα αντί για τη διεύθυνση email ή το αναγνωριστικό. Η γραμμή εντολών το δέχεται επίσης παντού όπου ζητείται λογαριασμός."
  id: "Ditampilkan di daftar sebagai pengganti alamat email atau ID. Baris perintah juga menerimanya di mana pun akun diminta."
  vi: "Hiện trong danh sách thay cho địa chỉ email hoặc ID. Dòng lệnh cũng chấp nhận nó ở mọi nơi yêu cầu tài khoản."
  th: "แสดงในรายการแทนที่อีเมลหรือ ID บรรทัดคำสั่งก็รับชื่อนี้ในทุกที่ที่ขอบัญชี"
  hi: "ईमेल पते या ID की जगह सूची में दिखता है। कमांड लाइन भी इसे हर उस जगह मानती है जहाँ खाता माँगा जाता है।"
