  zh-CN: "把 Claude Desktop 和 Claude Code 中只有一方有的 MCP 服务器复制给另一方。同名但不同的会保持原样。仅在 Claude 关闭时修改 Desktop 的文件。"
  zh-TW: "把 Claude Desktop 和 Claude Code 中只有一方有的 MCP 伺服器複製給另一方。同名但不同的會保持原樣。僅在 Claude 關閉時修改 Desktop 的檔案。"
  ja: "Claude Desktop と Claude Code のどちらか一方にしかない MCP サーバーをもう一方へコピーします。同名で内容が異なるものはそのままです。Desktop のファイルは Claude を終了している間だけ変更します。"
  ko: "Claude Desktop과 Claude Code 중 한쪽에만 있는 MCP 서버를 다른 쪽에 복사합니다. 이름은 같지만 다른 서버는 그대로 둡니다. Desktop 파일은 Claude가 종료된 동안에만 변경합니다."
  fr: "Copie dans l’autre les serveurs MCP qui manquent à Claude Desktop ou à Claude Code. Ceux qui diffèrent sont conservés tels quels. Le fichier de Desktop n’est modifié que lorsque Claude est fermé."
  de: "Kopiert MCP-Server, die in Claude Desktop oder Claude Code fehlen, in die jeweils andere Seite. Abweichende bleiben unverändert. Die Datei von Desktop wird nur bei geschlossenem Claude geändert."
  es: "Copia en el otro los servidores MCP que le faltan a Claude Desktop o a Claude Code. Los que difieren se dejan como están. El archivo de Desktop solo se modifica con Claude cerrado."
  pt-BR: "Copia para o outro os servidores MCP que faltam no Claude Desktop ou no Claude Code. Os diferentes permanecem como estão. O arquivo do Desktop só é alterado com o Claude fechado."
  ru: "Копирует MCP-серверы, которых не хватает в Claude Desktop или Claude Code, в другую сторону. Отличающиеся остаются как есть. Файл Desktop меняется только при закрытом Claude."
  it: "Copia i server MCP che mancano a Claude Desktop o a Claude Code nell’altro. Quelli diversi restano come sono. Il file di Desktop viene modificato solo mentre Claude è chiuso."
  nl: "Kopieer de MCP-servers die Claude Desktop of Claude Code mist naar de ander. Afwijkende blijven zoals ze zijn. Het bestand van Desktop wordt alleen gewijzigd terwijl Claude gesloten is."
  pl: "Skopiuj serwery MCP, których brakuje w Claude Desktop lub Claude Code, do drugiego programu. Różniące się zostają bez zmian. Plik Desktop jest zmieniany tylko przy zamkniętym Claude."
  tr: "Claude Desktop veya Claude Code’da eksik olan MCP sunucularını diğerine kopyalayın. Farklı olanlar olduğu gibi kalır. Desktop dosyası yalnızca Claude kapalıyken değiştirilir."
  uk: "Скопіюйте сервери MCP, яких бракує в Claude Desktop або Claude Code, в інший застосунок. Ті, що відрізняються, лишаються як є. Файл Desktop змінюється лише поки Claude закрито."
  sv: "Kopiera de MCP-servrar som Claude Desktop eller Claude Code saknar till den andra. De som skiljer sig lämnas som de är. Desktops fil ändras bara medan Claude är stängt."
  da: "Kopiér de MCP-servere, som Claude Desktop eller Claude Code mangler, til den anden. Dem, der er forskellige, lades som de er. Desktops fil ændres kun, mens Claude er lukket."
  nb: "Kopier MCP-serverne som Claude Desktop eller Claude Code mangler, til den andre. De som er forskjellige, beholdes som de er. Desktops fil endres bare mens Claude er lukket."
  fi: "Kopioi MCP-palvelimet, joita Claude Desktopista tai Claude Codesta puuttuu, toiseen. Eroavat jätetään ennalleen. Desktopin tiedostoa muutetaan vain Clauden ollessa suljettuna."
  cs: "Zkopírujte servery MCP, které Claude Desktop nebo Claude Code chybí, do druhého. Odlišné zůstanou beze změny. Soubor Desktopu se mění jen při zavřeném Claude."
  hu: "Másold át a Claude Desktopból vagy a Claude Code-ból hiányzó MCP-kiszolgálókat a másikba. A különbözők változatlanok maradnak. A Desktop fájlját csak akkor módosítja, amikor a Claude be van zárva."
  ro: "Copiază serverele MCP care lipsesc din Claude Desktop sau Claude Code în celălalt. Cele care diferă rămân neschimbate. Fișierul Desktop este modificat doar cât Claude este închis."
  el: "Αντιγράψτε τους διακομιστές MCP που λείπουν από το Claude Desktop ή το Claude Code στο άλλο. Όσοι διαφέρουν μένουν όπως είναι. Το αρχείο του Desktop αλλάζει μόνο όσο το Claude είναι κλειστό."
  id: "Salin server MCP yang tidak dimiliki Claude Desktop atau Claude Code ke yang lain. Yang berbeda dibiarkan apa adanya. Berkas Desktop hanya diubah saat Claude ditutup."
  vi: "Sao chép các máy chủ MCP mà Claude Desktop hoặc Claude Code còn thiếu sang bên kia. Những máy chủ khác nhau được giữ nguyên. Tệp của Desktop chỉ bị thay đổi khi Claude đã đóng."
  th: "คัดลอกเซิร์ฟเวอร์ MCP ที่ Claude Desktop หรือ Claude Code ไม่มีไปยังอีกฝั่ง รายการที่ต่างกันจะคงไว้ตามเดิม ไฟล์ของ Desktop จะถูกแก้ไขเฉพาะตอนที่ Claude ปิดอยู่"
  hi: "Claude Desktop या Claude Code में जो MCP सर्वर नहीं हैं उन्हें दूसरे में कॉपी करें। जो अलग हैं वे जैसे हैं वैसे रहते हैं। Desktop की फ़ाइल केवल तब बदली जाती है जब Claude बंद हो।"
