"headline.linked.detail.one":
  en: "Another tool linked %{count} session folder, and Claude stops saving sessions there."
  fr: "Un autre outil a lié %{count} dossier de sessions, et Claude n’y enregistre plus rien."
  de: "Ein anderes Tool hat %{count} Sitzungsordner verknüpft, und Claude speichert dort keine Sitzungen mehr."
  es: "Otra herramienta enlazó %{count} carpeta de sesiones y Claude ya no guarda sesiones allí."
  pt-BR: "Outra ferramenta vinculou %{count} pasta de sessões, e o Claude parou de salvar sessões nela."
  ru: "Другая программа превратила %{count} папку сессий в ссылку, и Claude больше не сохраняет туда сессии."
  it: "Un altro strumento ha collegato %{count} cartella di sessioni e Claude smette di salvarvi le sessioni."
  nl: "Een ander hulpprogramma heeft %{count} sessiemap gekoppeld, waardoor Claude daar geen sessies meer opslaat."
  pl: "Inne narzędzie połączyło %{count} folder sesji i Claude przestaje w nim zapisywać sesje."
  tr: "Başka bir araç %{count} oturum klasörünü bağladı, bu yüzden Claude oraya oturum kaydedemiyor."
  uk: "Інший інструмент пов’язав %{count} папку сеансів, тому Claude більше не зберігає в ній сеанси."
  sv: "Ett annat verktyg har länkat %{count} sessionsmapp, så Claude slutar spara sessioner i den."
  da: "Et andet værktøj har linket %{count} sessionsmappe, så Claude holder op med at gemme sessioner i den."
  nb: "Et annet verktøy har koblet %{count} øktmappe, så Claude slutter å lagre økter i den."
  fi: "Toinen työkalu on linkittänyt %{count} istuntokansion, joten Claude ei enää tallenna siihen istuntoja."
  cs: "Jiný nástroj propojil %{count} složku relací, takže do ní Claude přestává ukládat relace."
  hu: "Egy másik eszköz %{count} munkamenet-mappát hivatkozássá alakított, ezért a Claude nem menti oda a munkameneteket."
  ro: "Un alt instrument a legat %{count} dosar de sesiuni, așa că Claude nu mai salvează sesiuni în el."
  el: "Ένα άλλο εργαλείο συνέδεσε %{count} φάκελο συνεδριών, οπότε το Claude σταματά να αποθηκεύει συνεδρίες σε αυτόν."
  hi: "किसी दूसरे टूल ने %{count} सत्र फ़ोल्डर लिंक कर दिया है, इसलिए Claude उसमें सत्र सहेजना बंद कर देता है।"
"headline.linked.detail.other":
  en: "Another tool linked %{count} session folders, and Claude stops saving sessions there."
  zh-CN: "另一个工具把 %{count} 个会话文件夹改成了链接，Claude 因此不再在那里保存会话。"
