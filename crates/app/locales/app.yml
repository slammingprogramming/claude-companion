"settings.check_updates.detail":
  en: "Once a day, Claude Companion asks GitHub for its latest version."
  zh-CN: "每天向 GitHub 查询一次最新版本。"
  zh-TW: "每天向 GitHub 查詢一次最新版本。"
  ja: "1 日に 1 回、GitHub で最新バージョンを確認します。"
  ko: "하루에 한 번 GitHub에서 최신 버전을 확인합니다."
  fr: "Une fois par jour, Claude Companion demande sa dernière version à GitHub."
  de: "Einmal am Tag fragt Claude Companion bei GitHub nach der neuesten Version."
  es: "Una vez al día, Claude Companion pregunta a GitHub por su última versión."
  pt-BR: "Uma vez por dia, o Claude Companion pergunta ao GitHub qual é a versão mais recente."
  ru: "Раз в день Claude Companion узнаёт у GitHub, какая версия последняя."
  it: "Una volta al giorno Claude Companion chiede a GitHub la versione più recente."
  nl: "Eén keer per dag vraagt Claude Companion GitHub om de nieuwste versie."
  pl: "Raz dziennie Claude Companion pyta GitHub o najnowszą wersję."
  tr: "Claude Companion günde bir kez GitHub’dan en yeni sürümü sorar."
  uk: "Раз на день Claude Companion запитує в GitHub найновішу версію."
  sv: "En gång om dagen frågar Claude Companion GitHub efter den senaste versionen."
  da: "Én gang om dagen spørger Claude Companion GitHub om den nyeste version."
  nb: "Én gang om dagen spør Claude Companion GitHub om den nyeste versjonen."
  fi: "Kerran päivässä Claude Companion kysyy GitHubilta uusinta versiota."
  cs: "Jednou denně se Claude Companion zeptá GitHubu na nejnovější verzi."
  hu: "A Claude Companion naponta egyszer megkérdezi a GitHubot a legújabb verzióról."
  ro: "O dată pe zi, Claude Companion întreabă GitHub care este cea mai recentă versiune."
  el: "Μία φορά την ημέρα το Claude Companion ρωτά το GitHub για την τελευταία έκδοση."
  id: "Sekali sehari Claude Companion menanyakan versi terbaru ke GitHub."
  vi: "Mỗi ngày một lần, Claude Companion hỏi GitHub về phiên bản mới nhất."
  th: "วันละครั้ง Claude Companion จะถาม GitHub ถึงเวอร์ชันล่าสุด"
  hi: "दिन में एक बार Claude Companion GitHub से सबसे नया संस्करण पूछता है।"
