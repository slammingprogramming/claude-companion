"restore.body":
  en: "Every account’s session list goes back to that moment. The lists you have now are kept as a snapshot first."
  zh-CN: "每个账号的会话列表都会回到那个时刻。恢复前会先把现在的列表存成一个快照。"
  zh-TW: "每個帳號的工作階段列表都會回到那個時刻。還原前會先把現在的列表存成一個快照。"
  ja: "すべてのアカウントのセッション一覧がその時点に戻ります。現在の一覧は先にスナップショットとして保存されます。"
  ko: "모든 계정의 세션 목록이 그 시점으로 돌아갑니다. 현재 목록은 먼저 스냅샷으로 저장됩니다."
  fr: "La liste de sessions de chaque compte revient à ce moment-là. Les listes actuelles sont d’abord gardées dans un instantané."
  de: "Die Sitzungsliste jedes Kontos wird auf diesen Zeitpunkt zurückgesetzt. Die aktuellen Listen werden vorher als Schnappschuss gesichert."
  es: "La lista de sesiones de cada cuenta vuelve a ese momento. Antes se guardan las listas actuales en una instantánea."
  pt-BR: "A lista de sessões de cada conta volta àquele momento. As listas atuais são guardadas antes em um instantâneo."
  ru: "Список сессий каждого аккаунта вернётся к тому моменту. Текущие списки сначала сохранятся в снимке."
  it: "L’elenco delle sessioni di ogni account torna a quel momento. Gli elenchi attuali vengono prima salvati in uno snapshot."
  nl: "De sessielijst van elk account gaat terug naar dat moment. De huidige lijsten worden eerst als momentopname bewaard."
  pl: "Lista sesji każdego konta wraca do tego momentu. Obecne listy są najpierw zapisywane jako migawka."
  tr: "Her hesabın oturum listesi o ana döner. Mevcut listeler önce anlık görüntü olarak saklanır."
  uk: "Список сеансів кожного облікового запису повернеться до того моменту. Поточні списки спершу зберігаються як знімок."
  sv: "Varje kontos sessionslista går tillbaka till den tidpunkten. De nuvarande listorna sparas först som en ögonblicksbild."
  da: "Hver kontos sessionsliste vender tilbage til det tidspunkt. De nuværende lister gemmes først som et øjebliksbillede."
  nb: "Hver kontos øktliste går tilbake til det tidspunktet. De nåværende listene lagres først som et øyeblikksbilde."
  fi: "Jokaisen tilin istuntoluettelo palaa siihen hetkeen. Nykyiset luettelot tallennetaan ensin tilannevedoksena."
  cs: "Seznam relací každého účtu se vrátí do té chvíle. Současné seznamy se nejprve uloží jako snímek."
  hu: "Minden fiók munkamenet-listája visszatér arra az időpontra. A jelenlegi listák előbb pillanatképként mentődnek."
  ro: "Lista de sesiuni a fiecărui cont revine la acel moment. Listele actuale sunt salvate mai întâi ca instantaneu."
  el: "Η λίστα συνεδριών κάθε λογαριασμού επιστρέφει σε εκείνη τη στιγμή. Οι τρέχουσες λίστες αποθηκεύονται πρώτα ως στιγμιότυπο."
  id: "Daftar sesi setiap akun kembali ke saat itu. Daftar saat ini disimpan dahulu sebagai rekam jepret."
  vi: "Danh sách phiên của mỗi tài khoản trở về thời điểm đó. Các danh sách hiện tại được lưu trước thành một ảnh chụp."
  th: "รายการเซสชันของแต่ละบัญชีจะย้อนกลับไปยังช่วงเวลานั้น รายการปัจจุบันจะถูกบันทึกเป็นสแนปชอตก่อน"
  hi: "हर खाते की सत्र सूची उस समय पर लौट जाती है। मौजूदा सूचियाँ पहले स्नैपशॉट के रूप में सहेजी जाती हैं।"
