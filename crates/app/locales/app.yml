"switch.no_other":
  en: "No other account to switch to yet. Sign in to one first."
  zh-CN: "还没有可以切换的其他账号，请先登录一个。"
  zh-TW: "還沒有可以切換的其他帳號，請先登入一個。"
  ja: "切り替え先のアカウントがまだありません。まず別のアカウントにサインインしてください。"
  ko: "전환할 다른 계정이 아직 없습니다. 먼저 다른 계정으로 로그인하세요."
  fr: "Aucun autre compte vers lequel basculer pour l’instant. Connectez-vous d’abord à un autre."
  de: "Noch kein anderes Konto zum Wechseln. Melde dich zuerst bei einem an."
  es: "Aún no hay otra cuenta a la que cambiar. Inicia sesión primero con otra."
  pt-BR: "Ainda não há outra conta para trocar. Entre primeiro em outra."
  ru: "Пока не на что переключиться. Сначала войдите в другой аккаунт."
  it: "Non c’è ancora un altro account a cui passare. Accedi prima a uno."
  nl: "Er is nog geen ander account om naar te wisselen. Meld je eerst bij een ander aan."
  pl: "Nie ma jeszcze innego konta, na które można się przełączyć. Najpierw zaloguj się na jakieś."
  tr: "Geçilecek başka bir hesap henüz yok. Önce birine oturum açın."
  uk: "Іншого облікового запису для перемикання ще немає. Спершу увійдіть у якийсь."
  sv: "Det finns inget annat konto att byta till ännu. Logga först in på ett."
  da: "Der er ingen anden konto at skifte til endnu. Log først ind på en."
  nb: "Det finnes ingen annen konto å bytte til ennå. Logg først inn på en."
  fi: "Toista tiliä, johon vaihtaa, ei vielä ole. Kirjaudu ensin johonkin."
  cs: "Zatím není jiný účet, na který lze přepnout. Nejprve se k nějakému přihlaste."
  hu: "Még nincs másik fiók, amelyre válthatnál. Előbb jelentkezz be egybe."
  ro: "Nu există încă un alt cont la care să comuți. Autentifică-te mai întâi în unul."
  el: "Δεν υπάρχει ακόμη άλλος λογαριασμός για εναλλαγή. Συνδεθείτε πρώτα σε έναν."
  id: "Belum ada akun lain untuk dialihkan. Masuk ke salah satunya terlebih dahulu."
  vi: "Chưa có tài khoản khác để chuyển sang. Hãy đăng nhập vào một tài khoản trước."
  th: "ยังไม่มีบัญชีอื่นให้สลับไป ลงชื่อเข้าใช้บัญชีหนึ่งก่อน"
  hi: "बदलने के लिए अभी कोई दूसरा खाता नहीं है। पहले किसी एक में साइन इन करें।"
