  pt-BR: "%{usage} · lido pelo Claude %{ago}. Clique com o botão direito no ícone do Claude na barra de menus para ele verificar de novo."
  ru: "%{usage} · Claude прочитал %{ago}. Щёлкните правой кнопкой по значку Claude в строке меню, чтобы он проверил снова."
  it: "%{usage} · letto da Claude %{ago}. Fai clic destro sull’icona di Claude nella barra dei menu per fargli ricontrollare."
  nl: "%{usage} · door Claude gelezen %{ago}. Klik met de rechtermuisknop op het Claude-icoon in de menubalk om het opnieuw te laten controleren."
  pl: "%{usage} · odczytano w Claude %{ago}. Kliknij prawym przyciskiem ikonę Claude na pasku menu, aby sprawdził ponownie."
  tr: "%{usage} · Claude tarafından %{ago} okundu. Yeniden denetletmek için menü çubuğundaki Claude simgesine sağ tıklayın."
  uk: "%{usage} · прочитано Claude %{ago}. Клацніть правою кнопкою значок Claude у рядку меню, щоб він перевірив знову."
  sv: "%{usage} · läst av Claude %{ago}. Högerklicka på Claude-ikonen i menyraden så att den kontrollerar igen."
