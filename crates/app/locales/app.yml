"tools.lost.closed":
  en: "Claude has every account's chats open. Quit Claude, then try again."
  zh-CN: "Claude 已打开所有账户的对话。请先退出 Claude，再试一次。"
  zh-TW: "Claude 已開啟所有帳號的對話。請先結束 Claude，再試一次。"
  ja: "Claude がすべてのアカウントのチャットを開いています。Claude を終了してからもう一度お試しください。"
  ko: "Claude가 모든 계정의 대화를 열어 두고 있습니다. Claude를 종료한 뒤 다시 시도하세요."
  fr: "Claude a ouvert les conversations de tous les comptes. Quittez Claude, puis réessayez."
  de: "Claude hat die Chats aller Konten geöffnet. Beende Claude und versuche es erneut."
  es: "Claude tiene abiertos los chats de todas las cuentas. Cierra Claude y vuelve a intentarlo."
  pt-BR: "O Claude está com as conversas de todas as contas abertas. Feche o Claude e tente de novo."
  ru: "Claude открыл чаты всех аккаунтов. Закройте Claude и повторите попытку."
  it: "Claude ha aperte le chat di ogni account. Chiudi Claude e riprova."
  nl: "Claude heeft de chats van elk account geopend. Sluit Claude af en probeer het opnieuw."
  pl: "Claude ma otwarte czaty każdego konta. Zamknij Claude i spróbuj ponownie."
  tr: "Claude her hesabın sohbetlerini açık tutuyor. Claude’dan çıkıp yeniden deneyin."
  uk: "Claude відкрив чати кожного облікового запису. Закрийте Claude і повторіть спробу."
  sv: "Claude har varje kontos chattar öppna. Avsluta Claude och försök igen."
  da: "Claude har hver kontos chats åbne. Luk Claude, og prøv igen."
  nb: "Claude har chattene til hver konto åpne. Avslutt Claude og prøv igjen."
  fi: "Claude on avannut jokaisen tilin keskustelut. Sulje Claude ja yritä uudelleen."
  cs: "Claude má otevřené chaty každého účtu. Ukončete Claude a zkuste to znovu."
  hu: "A Claude megnyitva tartja minden fiók csevegéseit. Lépj ki a Claude-ból, és próbáld újra."
  ro: "Claude are deschise conversațiile fiecărui cont. Închide Claude și încearcă din nou."
  el: "Το Claude έχει ανοιχτές τις συνομιλίες κάθε λογαριασμού. Κλείστε το Claude και δοκιμάστε ξανά."
  id: "Claude membuka obrolan setiap akun. Keluar dari Claude lalu coba lagi."
  vi: "Claude đang mở các cuộc trò chuyện của mọi tài khoản. Hãy thoát Claude rồi thử lại."
  th: "Claude เปิดแชตของทุกบัญชีอยู่ ออกจาก Claude แล้วลองอีกครั้ง"
  hi: "Claude ने हर खाते की चैट खोल रखी हैं। Claude बंद करके फिर कोशिश करें।"
