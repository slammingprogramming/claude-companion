"tools.chats.detail":
  en: "List the chats of every account, or copy one account’s chats into another’s (for accounts you keep out of sync). Newer cards win and nothing is deleted."
  zh-CN: "列出所有账户的聊天，或把一个账户的聊天复制到另一个账户（适用于不参与同步的账户）。较新的卡片优先，不会删除任何内容。"
  zh-TW: "列出所有帳號的聊天，或把一個帳號的聊天複製到另一個帳號（適用於不參與同步的帳號）。較新的卡片優先，不會刪除任何內容。"
  ja: "全アカウントのチャットを一覧表示するか、あるアカウントのチャットを別のアカウントへコピーします（同期から外しているアカウント向け）。新しいカードが優先され、何も削除されません。"
  ko: "모든 계정의 채팅을 보여 주거나 한 계정의 채팅을 다른 계정으로 복사합니다(동기화에서 제외한 계정용). 더 새로운 카드가 우선하며 아무것도 삭제되지 않습니다."
  fr: "Liste les chats de tous les comptes, ou copie ceux d’un compte dans un autre (pour les comptes laissés hors synchronisation). Les cartes les plus récentes l’emportent, rien n’est supprimé."
  de: "Listet die Chats aller Konten oder kopiert die Chats eines Kontos in ein anderes (für Konten außerhalb der Synchronisierung). Neuere Karten gewinnen, nichts wird gelöscht."
  es: "Muestra los chats de todas las cuentas o copia los de una cuenta en otra (para cuentas fuera de la sincronización). Las tarjetas más nuevas ganan y no se borra nada."
  pt-BR: "Lista os chats de todas as contas ou copia os de uma conta para outra (para contas fora da sincronização). Os cartões mais novos vencem e nada é apagado."
  ru: "Показывает чаты всех аккаунтов или копирует чаты одного аккаунта в другой (для аккаунтов вне синхронизации). Более новые карточки побеждают, ничего не удаляется."
  it: "Elenca le chat di ogni account, oppure copia le chat di un account in quello di un altro (per account che tieni fuori dalla sincronizzazione). Le schede più recenti prevalgono e non viene eliminato nulla."
  nl: "Toon de chats van elk account, of kopieer de chats van het ene account naar het andere (voor accounts die je buiten de synchronisatie houdt). Nieuwere kaarten winnen en er wordt niets verwijderd."
  pl: "Wyświetl czaty każdego konta albo skopiuj czaty jednego konta do drugiego (dla kont wyłączonych z synchronizacji). Nowsze karty wygrywają i nic nie jest usuwane."
  tr: "Her hesabın sohbetlerini listeleyin veya bir hesabın sohbetlerini diğerine kopyalayın (eşitlemenin dışında tuttuğunuz hesaplar için). Daha yeni kartlar kazanır ve hiçbir şey silinmez."
  uk: "Показуйте чати кожного облікового запису або копіюйте чати з одного облікового запису в інший (для облікових записів, які ви тримаєте поза синхронізацією). Новіші картки мають перевагу, і нічого не видаляється."
  sv: "Visa chattarna i varje konto eller kopiera ett kontos chattar till ett annat (för konton du håller utanför synkroniseringen). Nyare kort vinner och inget raderas."
  da: "Vis chats fra hver konto, eller kopiér en kontos chats til en anden (for konti, du holder uden for synkroniseringen). Nyere kort vinder, og intet slettes."
  nb: "Vis chattene til hver konto, eller kopier en kontos chatter til en annen (for kontoer du holder utenfor synkroniseringen). Nyere kort vinner, og ingenting slettes."
  fi: "Näytä jokaisen tilin keskustelut tai kopioi yhden tilin keskustelut toiselle (synkronoinnin ulkopuolella pidetyille tileille). Uudemmat kortit voittavat, eikä mitään poisteta."
  cs: "Zobrazte chaty každého účtu, nebo zkopírujte chaty jednoho účtu do druhého (u účtů, které držíte mimo synchronizaci). Novější karty vyhrávají a nic se nemaže."
  hu: "Listázd minden fiók csevegéseit, vagy másold át egy fiók csevegéseit egy másikba (a szinkronizáláson kívül tartott fiókokhoz). Az újabb kártyák győznek, és semmi sem törlődik."
  ro: "Afișează conversațiile fiecărui cont sau copiază conversațiile unui cont în altul (pentru conturile pe care le ții în afara sincronizării). Fișele mai noi câștigă și nu se șterge nimic."
  el: "Εμφανίστε τις συνομιλίες κάθε λογαριασμού ή αντιγράψτε τις συνομιλίες ενός λογαριασμού σε άλλον (για λογαριασμούς που κρατάτε εκτός συγχρονισμού). Οι νεότερες κάρτες υπερισχύουν και τίποτα δεν διαγράφεται."
  id: "Tampilkan obrolan setiap akun, atau salin obrolan satu akun ke akun lain (untuk akun yang Anda tahan di luar sinkronisasi). Kartu yang lebih baru menang dan tidak ada yang dihapus."
  vi: "Liệt kê cuộc trò chuyện của mọi tài khoản, hoặc sao chép cuộc trò chuyện của tài khoản này sang tài khoản khác (cho các tài khoản bạn giữ ngoài đồng bộ). Thẻ mới hơn thắng và không có gì bị xóa."
  th: "แสดงแชตของทุกบัญชี หรือคัดลอกแชตของบัญชีหนึ่งไปยังอีกบัญชีหนึ่ง (สำหรับบัญชีที่คุณแยกไว้นอกการซิงค์) การ์ดที่ใหม่กว่าจะชนะ และไม่มีอะไรถูกลบ"
  hi: "हर खाते की चैट दिखाएँ, या एक खाते की चैट दूसरे में कॉपी करें (उन खातों के लिए जिन्हें आप सिंक से बाहर रखते हैं)। नए कार्ड जीतते हैं और कुछ भी हटाया नहीं जाता।"
