"settings.groups.detail":
  en: "Keep your own sidebar groups the same in every account. Only done while Claude is closed; a backup is kept first. Start Claude on your main account afterwards so it shares them."
  zh-CN: "让每个账户的侧边栏分组保持一致。仅在 Claude 关闭时进行，并会先做备份。之后请用主账户启动 Claude，由它共享这些分组。"
  zh-TW: "讓每個帳號的側邊欄群組保持一致。僅在 Claude 關閉時進行，並會先做備份。之後請用主要帳號啟動 Claude，由它共用這些群組。"
  ja: "自分で作ったサイドバーのグループをすべてのアカウントで揃えます。Claude を終了している間だけ実行し、先にバックアップを取ります。その後、メインのアカウントで Claude を起動すると共有されます。"
  ko: "직접 만든 사이드바 그룹을 모든 계정에서 같게 유지합니다. Claude가 종료된 동안에만 실행하며 먼저 백업합니다. 이후 주 계정으로 Claude를 시작하면 그룹이 공유됩니다."
  fr: "Garde vos groupes de la barre latérale identiques dans tous les comptes. Uniquement quand Claude est fermé, après une sauvegarde. Lancez ensuite Claude sur votre compte principal pour les partager."
  de: "Hält deine Seitenleisten-Gruppen in allen Konten gleich. Nur bei geschlossenem Claude und nach einer Sicherung. Starte Claude danach mit deinem Hauptkonto, damit es die Gruppen teilt."
  es: "Mantiene tus grupos de la barra lateral iguales en todas las cuentas. Solo con Claude cerrado y tras hacer una copia de seguridad. Después, inicia Claude con tu cuenta principal para compartirlos."
  pt-BR: "Mantém seus grupos da barra lateral iguais em todas as contas. Só com o Claude fechado e depois de um backup. Depois, abra o Claude na conta principal para compartilhá-los."
  ru: "Делает ваши группы боковой панели одинаковыми во всех аккаунтах. Только при закрытом Claude и после резервной копии. Затем запустите Claude с основным аккаунтом, чтобы он поделился группами."
  it: "Mantieni i tuoi gruppi della barra laterale uguali in ogni account. Avviene solo mentre Claude è chiuso; prima viene creato un backup. Poi avvia Claude con il tuo account principale perché li condivida."
  nl: "Houd je eigen zijbalkgroepen in elk account gelijk. Gebeurt alleen terwijl Claude gesloten is; eerst wordt een back-up bewaard. Start Claude daarna op je hoofdaccount zodat het ze deelt."
  pl: "Utrzymuj własne grupy na pasku bocznym jednakowe na każdym koncie. Dzieje się to tylko przy zamkniętym Claude; wcześniej powstaje kopia zapasowa. Potem uruchom Claude na głównym koncie, aby je udostępnił."
  tr: "Kendi kenar çubuğu gruplarınızı her hesapta aynı tutun. Yalnızca Claude kapalıyken yapılır; önce yedek alınır. Sonra Claude’u ana hesabınızda başlatın ki paylaşsın."
  uk: "Тримайте власні групи бічної панелі однаковими в кожному обліковому записі. Відбувається лише поки Claude закрито; спершу створюється резервна копія. Потім запустіть Claude з основним обліковим записом, щоб він їх поширив."
  sv: "Håll dina egna sidofältsgrupper lika i varje konto. Sker bara medan Claude är stängt; en säkerhetskopia sparas först. Starta sedan Claude på ditt huvudkonto så att det delar dem."
  da: "Hold dine egne sidepanelgrupper ens i hver konto. Sker kun, mens Claude er lukket; en sikkerhedskopi gemmes først. Start derefter Claude på din hovedkonto, så den deler dem."
  nb: "Hold dine egne sidefeltgrupper like i hver konto. Skjer bare mens Claude er lukket; en sikkerhetskopi lagres først. Start deretter Claude på hovedkontoen din slik at den deler dem."
  fi: "Pidä omat sivupalkin ryhmäsi samoina jokaisella tilillä. Tapahtuu vain Clauden ollessa suljettuna; varmuuskopio tallennetaan ensin. Käynnistä sen jälkeen Claude pääkäyttötililläsi, jotta se jakaa ne."
  cs: "Udržujte vlastní skupiny postranního panelu stejné v každém účtu. Probíhá jen při zavřeném Claude; nejprve se uloží záloha. Poté spusťte Claude na hlavním účtu, aby je sdílel."
  hu: "Tartsd egyformán a saját oldalsáv-csoportjaidat minden fiókban. Csak akkor történik, amikor a Claude be van zárva; előbb biztonsági mentés készül. Utána indítsd a Claude-ot a fő fiókoddal, hogy megossza őket."
  ro: "Păstrează grupurile tale din bara laterală identice în fiecare cont. Se întâmplă doar cât Claude este închis; mai întâi se salvează o copie de rezervă. Apoi pornește Claude pe contul tău principal ca să le partajeze."
  el: "Κρατήστε τις δικές σας ομάδες πλαϊνής στήλης ίδιες σε κάθε λογαριασμό. Γίνεται μόνο όσο το Claude είναι κλειστό· αποθηκεύεται πρώτα αντίγραφο ασφαλείας. Έπειτα ξεκινήστε το Claude στον κύριο λογαριασμό σας ώστε να τις μοιραστεί."
  id: "Samakan grup bilah samping Anda sendiri di setiap akun. Hanya terjadi saat Claude ditutup; cadangan disimpan dahulu. Lalu mulai Claude di akun utama Anda agar membagikannya."
  vi: "Giữ các nhóm thanh bên của riêng bạn giống nhau trên mọi tài khoản. Chỉ xảy ra khi Claude đã đóng; một bản sao lưu được lưu trước. Sau đó hãy khởi động Claude trên tài khoản chính để nó chia sẻ chúng."
  th: "ทำให้กลุ่มแถบด้านข้างของคุณเองเหมือนกันในทุกบัญชี ทำเฉพาะตอนที่ Claude ปิดอยู่ โดยจะบันทึกข้อมูลสำรองก่อน จากนั้นเริ่ม Claude บนบัญชีหลักของคุณเพื่อให้แชร์กลุ่มเหล่านั้น"
  hi: "अपने साइडबार समूह हर खाते में एक जैसे रखें। यह केवल तब होता है जब Claude बंद हो; पहले एक बैकअप सहेजा जाता है। फिर अपने मुख्य खाते पर Claude शुरू करें ताकि वह उन्हें साझा करे।"
