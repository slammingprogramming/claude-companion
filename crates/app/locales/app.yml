  hu: "%{usage} · a Claude olvasta: %{ago}. Kattints jobb gombbal a menüsor Claude-ikonjára, hogy újra ellenőrizze."
  ro: "%{usage} · citit de Claude %{ago}. Dă clic dreapta pe pictograma Claude din bara de meniu ca să verifice din nou."
  el: "%{usage} · διαβάστηκε από το Claude %{ago}. Κάντε δεξί κλικ στο εικονίδιο του Claude στη γραμμή μενού για να ελέγξει ξανά."
  id: "%{usage} · dibaca Claude %{ago}. Klik kanan ikon Claude di bilah menu agar memeriksa lagi."
  vi: "%{usage} · Claude đọc %{ago}. Nhấp chuột phải vào biểu tượng Claude trên thanh menu để nó kiểm tra lại."
  th: "%{usage} · Claude อ่านเมื่อ %{ago} คลิกขวาที่ไอคอน Claude ในแถบเมนูเพื่อให้ตรวจสอบอีกครั้ง"
  hi: "%{usage} · Claude ने %{ago} पढ़ा। उसे फिर जाँचने के लिए मेन्यू बार में Claude आइकन पर राइट-क्लिक करें।"
