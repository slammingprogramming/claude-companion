  pl: "Claude uruchamia się ponownie na stronie logowania. Zaloguj się tam jako %{account}."
  tr: "Claude oturum açma sayfasında yeniden başlıyor. Orada %{account} olarak oturum açın."
  uk: "Claude перезапускається на сторінці входу. Увійдіть там як %{account}."
  sv: "Claude startar om på inloggningssidan. Logga in där som %{account}."
  da: "Claude genstarter på loginsiden. Log ind der som %{account}."
  nb: "Claude starter på nytt på påloggingssiden. Logg inn der som %{account}."
  fi: "Claude käynnistyy uudelleen kirjautumissivulle. Kirjaudu siellä tilillä %{account}."
  cs: "Claude se restartuje na přihlašovací stránce. Přihlaste se tam jako %{account}."
  hu: "A Claude újraindul a bejelentkezési oldalon. Jelentkezz be ott mint %{account}."
  ro: "Claude repornește pe pagina de autentificare. Autentifică-te acolo ca %{account}."
  el: "Το Claude επανεκκινείται στη σελίδα σύνδεσης. Συνδεθείτε εκεί ως %{account}."
  id: "Claude dimulai ulang di halaman masuk. Masuk di sana sebagai %{account}."
  vi: "Claude khởi động lại ở trang đăng nhập. Hãy đăng nhập ở đó với tư cách %{account}."
