"background.stalled":
  en: "On, but not running. Turn it off and on again."
  zh-CN: "已开启，但没有在运行。请关掉再重新打开。"
  zh-TW: "已開啟，但沒有在執行。請關閉後再重新開啟。"
  ja: "オンですが動作していません。いったんオフにしてからオンにしてください。"
  ko: "켜져 있지만 실행되고 있지 않습니다. 껐다가 다시 켜세요."
  fr: "Activée, mais à l’arrêt. Désactivez-la puis réactivez-la."
  de: "An, aber nicht aktiv. Schalte es aus und wieder ein."
  es: "Activada, pero detenida. Desactívala y vuelve a activarla."
  pt-BR: "Ativada, mas parada. Desative e ative de novo."
  ru: "Включена, но не работает. Выключите и включите снова."
  it: "Attiva, ma non in esecuzione. Disattivala e riattivala."
  nl: "Aan, maar niet actief. Zet het uit en weer aan."
  pl: "Włączona, ale nie działa. Wyłącz ją i włącz ponownie."
  tr: "Açık ama çalışmıyor. Kapatıp yeniden açın."
  uk: "Увімкнено, але не працює. Вимкніть і ввімкніть знову."
  sv: "På men körs inte. Stäng av och slå på igen."
  da: "Til, men kører ikke. Slå fra og til igen."
  nb: "På, men kjører ikke. Slå av og på igjen."
  fi: "Päällä mutta ei käynnissä. Kytke pois ja takaisin päälle."
  cs: "Zapnuto, ale neběží. Vypněte a znovu zapněte."
  hu: "Be van kapcsolva, de nem fut. Kapcsold ki, majd újra be."
  ro: "Pornit, dar nu rulează. Oprește-l și pornește-l din nou."
  el: "Ενεργό αλλά δεν εκτελείται. Απενεργοποιήστε το και ενεργοποιήστε το ξανά."
  id: "Aktif tetapi tidak berjalan. Matikan lalu nyalakan lagi."
  vi: "Đã bật nhưng không chạy. Hãy tắt rồi bật lại."
  th: "เปิดอยู่แต่ไม่ทำงาน ลองปิดแล้วเปิดใหม่"
  hi: "चालू है पर चल नहीं रहा। इसे बंद करके फिर चालू करें।"
