"quit.confirming":
  en: "Claude is asking whether to stop its work in progress. Answer it in Claude."
  zh-CN: "Claude 正在询问是否停止进行中的工作，请在 Claude 里回答。"
  zh-TW: "Claude 正在詢問是否停止進行中的工作，請在 Claude 裡回答。"
  ja: "Claude が進行中の作業を止めるかどうか確認しています。Claude で答えてください。"
  ko: "Claude가 진행 중인 작업을 멈출지 묻고 있습니다. Claude에서 답해 주세요."
  fr: "Claude demande s’il faut arrêter le travail en cours. Répondez dans Claude."
  de: "Claude fragt, ob laufende Arbeit abgebrochen werden soll. Antworte in Claude."
  es: "Claude pregunta si debe detener el trabajo en curso. Responde en Claude."
  pt-BR: "O Claude está perguntando se deve parar o trabalho em andamento. Responda no Claude."
  ru: "Claude спрашивает, остановить ли текущую работу. Ответьте в Claude."
  it: "Claude sta chiedendo se interrompere il lavoro in corso. Rispondi in Claude."
  nl: "Claude vraagt of het lopende werk moet worden gestopt. Beantwoord dit in Claude."
  pl: "Claude pyta, czy przerwać trwającą pracę. Odpowiedz w Claude."
  tr: "Claude, devam eden işi durdurup durdurmayacağınızı soruyor. Claude’da yanıtlayın."
  uk: "Claude питає, чи зупинити поточну роботу. Дайте відповідь у Claude."
  sv: "Claude frågar om pågående arbete ska stoppas. Svara i Claude."
  da: "Claude spørger, om igangværende arbejde skal stoppes. Svar i Claude."
  nb: "Claude spør om pågående arbeid skal stoppes. Svar i Claude."
  fi: "Claude kysyy, pysäytetäänkö käynnissä oleva työ. Vastaa Claudessa."
  cs: "Claude se ptá, zda zastavit probíhající práci. Odpovězte v Claude."
  hu: "A Claude megkérdezi, leállítsa-e a folyamatban lévő munkát. Válaszolj a Claude-ban."
  ro: "Claude întreabă dacă să oprească lucrul în curs. Răspunde în Claude."
  el: "Το Claude ρωτά αν να σταματήσει η εργασία που τρέχει. Απαντήστε στο Claude."
  id: "Claude bertanya apakah pekerjaan yang sedang berjalan akan dihentikan. Jawab di Claude."
  vi: "Claude đang hỏi có dừng công việc đang chạy không. Hãy trả lời trong Claude."
  th: "Claude กำลังถามว่าจะหยุดงานที่กำลังทำอยู่หรือไม่ ตอบในหน้าต่าง Claude"
  hi: "Claude पूछ रहा है कि चल रहा काम रोका जाए या नहीं। Claude में जवाब दें।"
"quit.from_tray":
  en: "Quit Claude from its tray icon to continue. Closing its window only hides it. Or end it here (unsaved work in progress is lost)."
  zh-CN: "请从托盘图标退出 Claude 以继续。关闭窗口只会将其隐藏。也可以在这里强制结束（进行中的未保存工作会丢失）。"
  zh-TW: "請從系統匣圖示結束 Claude 以繼續。關閉視窗只會將它隱藏。也可以在這裡強制結束（進行中的未儲存工作會遺失）。"
  ja: "続けるには、トレイのアイコンから Claude を終了してください。ウィンドウを閉じただけでは隠れるだけです。ここで強制終了することもできます（進行中の未保存の作業は失われます）。"
  ko: "계속하려면 트레이 아이콘에서 Claude를 종료하세요. 창을 닫는 것만으로는 숨겨질 뿐입니다. 여기서 강제 종료할 수도 있습니다(진행 중인 저장되지 않은 작업은 사라집니다)."
  fr: "Quittez Claude depuis son icône de la zone de notification pour continuer. Fermer sa fenêtre ne fait que le masquer. Vous pouvez aussi le terminer ici (le travail en cours non enregistré sera perdu)."
  de: "Beende Claude über sein Symbol im Infobereich, um fortzufahren. Das Schließen des Fensters blendet es nur aus. Oder beende es hier (laufende, nicht gespeicherte Arbeit geht verloren)."
  es: "Cierra Claude desde su icono de la bandeja para continuar. Cerrar su ventana solo lo oculta. También puedes terminarlo aquí (se pierde el trabajo en curso sin guardar)."
  pt-BR: "Saia do Claude pelo ícone da bandeja para continuar. Fechar a janela só o oculta. Ou encerre-o aqui (o trabalho em andamento não salvo será perdido)."
  ru: "Чтобы продолжить, выйдите из Claude через значок в области уведомлений: закрытие окна лишь скрывает его. Или завершите его здесь (несохранённая текущая работа будет потеряна)."
  it: "Esci da Claude dall’icona nell’area di notifica per continuare. Chiudere la sua finestra la nasconde soltanto. Oppure terminalo da qui (il lavoro non salvato in corso va perso)."
  nl: "Sluit Claude af via het icoon in het systeemvak om door te gaan. Het venster sluiten verbergt het alleen. Of beëindig het hier (niet-opgeslagen lopend werk gaat verloren)."
  pl: "Aby kontynuować, zamknij Claude z ikony w zasobniku. Zamknięcie okna tylko je ukrywa. Możesz też zakończyć go tutaj (niezapisana trwająca praca zostanie utracona)."
  tr: "Devam etmek için Claude’dan tepsi simgesiyle çıkın. Pencereyi kapatmak yalnızca gizler. Veya buradan sonlandırın (kaydedilmemiş devam eden iş kaybolur)."
  uk: "Щоб продовжити, закрийте Claude через значок у треї. Закриття вікна лише ховає його. Або завершіть його тут (незбережена поточна робота буде втрачена)."
  sv: "Avsluta Claude från ikonen i systemfältet för att fortsätta. Att stänga fönstret döljer det bara. Eller tvinga avslut här (osparat pågående arbete går förlorat)."
  da: "Luk Claude fra ikonet i systembakken for at fortsætte. At lukke vinduet skjuler det kun. Eller tving det til at afslutte her (ugemt igangværende arbejde går tabt)."
  nb: "Avslutt Claude fra ikonet i systemstatusfeltet for å fortsette. Å lukke vinduet skjuler det bare. Eller tving det til å avslutte her (ulagret pågående arbeid går tapt)."
  fi: "Jatka sulkemalla Claude ilmoitusalueen kuvakkeesta. Ikkunan sulkeminen vain piilottaa sen. Tai pakota se lopettamaan tässä (tallentamaton käynnissä oleva työ menetetään)."
  cs: "Chcete-li pokračovat, ukončete Claude z ikony v oznamovací oblasti. Zavření okna jej jen skryje. Nebo jej zde vynuťte ukončit (neuložená probíhající práce se ztratí)."
  hu: "A folytatáshoz lépj ki a Claude-ból az értesítési területen lévő ikonról. Az ablak bezárása csak elrejti. Vagy kényszerítsd kilépésre itt (a mentetlen folyamatban lévő munka elvész)."
  ro: "Pentru a continua, închide Claude din pictograma din zona de notificare. Închiderea ferestrei doar o ascunde. Sau forțează ieșirea aici (lucrul în curs nesalvat se pierde)."
  el: "Για να συνεχίσετε, κλείστε το Claude από το εικονίδιο στην περιοχή ειδοποιήσεων. Το κλείσιμο του παραθύρου απλώς το κρύβει. Ή αναγκάστε το να τερματιστεί εδώ (η μη αποθηκευμένη εργασία που τρέχει θα χαθεί)."
  id: "Untuk melanjutkan, keluar dari Claude melalui ikon di baki sistem. Menutup jendela hanya menyembunyikannya. Atau paksa keluar di sini (pekerjaan berjalan yang belum disimpan akan hilang)."
  vi: "Để tiếp tục, hãy thoát Claude từ biểu tượng trong khay hệ thống. Đóng cửa sổ chỉ ẩn nó. Hoặc buộc thoát tại đây (công việc đang chạy chưa lưu sẽ mất)."
  th: "หากต้องการดำเนินการต่อ ให้ออกจาก Claude จากไอคอนในถาดระบบ การปิดหน้าต่างเพียงซ่อนมันไว้ หรือบังคับออกที่นี่ (งานที่กำลังทำอยู่และยังไม่ได้บันทึกจะสูญหาย)"
  hi: "आगे बढ़ने के लिए सिस्टम ट्रे के आइकन से Claude बंद करें। विंडो बंद करने से वह केवल छिपती है। या यहाँ से जबरन बंद करें (चल रहा बिना सहेजा काम खो जाएगा)।"
