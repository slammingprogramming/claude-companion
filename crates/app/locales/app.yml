"background.stalled_mac":
  en: "If it stays like this, allow it in System Settings › General › Login Items & Extensions."
  zh-CN: "如果一直这样，请到“系统设置 › 通用 › 登录项与扩展”里允许它在后台运行。"
  zh-TW: "如果一直這樣，請到「系統設定 › 一般 › 登入項目與延伸功能」裡允許它在背景執行。"
  ja: "この状態が続く場合は、「システム設定 › 一般 › ログイン項目と機能拡張」でバックグラウンドでの実行を許可してください。"
  ko: "계속 이 상태라면 시스템 설정 › 일반 › 로그인 항목 및 확장 프로그램에서 백그라운드 실행을 허용하세요."
  fr: "Si cela persiste, autorisez-la dans Réglages Système › Général › Ouverture et extensions."
  de: "Bleibt es so, erlaube sie unter Systemeinstellungen › Allgemein › Anmeldeobjekte & Erweiterungen."
  es: "Si sigue así, permítela en Ajustes del Sistema › General › Ítems de inicio y extensiones."
  pt-BR: "Se continuar assim, permita em Ajustes do Sistema › Geral › Itens de Início e Extensões."
  ru: "Если так и останется, разрешите фоновую работу: Системные настройки › Основные › Объекты входа и расширения."
  it: "Se resta così, consentila in Impostazioni di Sistema › Generali › Elementi login ed estensioni."
  nl: "Blijft het zo, sta het dan toe in Systeeminstellingen › Algemeen › Inlogonderdelen en extensies."
  pl: "Jeśli tak zostanie, zezwól na to w Ustawieniach systemowych › Ogólne › Elementy logowania i rozszerzenia."
  tr: "Böyle kalırsa Sistem Ayarları › Genel › Giriş Öğeleri ve Uzantılar bölümünden izin verin."
  uk: "Якщо так і залишиться, дозвольте це в Системних параметрах › Загальні › Об’єкти входу та розширення."
  sv: "Om det förblir så, tillåt det i Systeminställningar › Allmänt › Inloggningsobjekt och tillägg."
  da: "Hvis det bliver ved, så tillad det i Systemindstillinger › Generelt › Loginemner og udvidelser."
  nb: "Hvis det blir stående slik, tillat det i Systeminnstillinger › Generelt › Påloggingsobjekter og utvidelser."
  fi: "Jos tila ei muutu, salli se kohdassa Järjestelmäasetukset › Yleiset › Kirjautumiskohteet ja laajennukset."
  cs: "Pokud to tak zůstane, povolte to v Nastavení systému › Obecné › Položky přihlášení a rozšíření."
  hu: "Ha így marad, engedélyezd a Rendszerbeállítások › Általános › Bejelentkezési elemek és bővítmények alatt."
  ro: "Dacă rămâne așa, permite-l în Setări de sistem › General › Elemente de autentificare și extensii."
  el: "Αν παραμείνει έτσι, επιτρέψτε το από τις Ρυθμίσεις συστήματος › Γενικά › Στοιχεία σύνδεσης και επεκτάσεις."
  id: "Jika tetap begitu, izinkan di Pengaturan Sistem › Umum › Item Login & Ekstensi."
  vi: "Nếu vẫn vậy, hãy cho phép trong Cài đặt hệ thống › Cài đặt chung › Mục đăng nhập và tiện ích mở rộng."
  th: "หากยังเป็นเช่นนั้น ให้อนุญาตใน การตั้งค่าระบบ › ทั่วไป › รายการเข้าสู่ระบบและส่วนขยาย"
  hi: "अगर ऐसा ही रहे, तो सिस्टम सेटिंग › सामान्य › लॉगिन आइटम और एक्सटेंशन में इसकी अनुमति दें।"
"background.move_first":
  en: "Move Claude Companion to the Applications folder first, then turn this on."
  zh-CN: "请先把 Claude Companion 移到“应用程序”文件夹，再打开这个开关。"
  zh-TW: "請先將 Claude Companion 移到「應用程式」檔案夾，再開啟這個開關。"
  ja: "先に Claude Companion を「アプリケーション」フォルダに移動してから、オンにしてください。"
  ko: "먼저 Claude Companion을 응용 프로그램 폴더로 옮긴 다음 켜세요."
  fr: "Placez d’abord Claude Companion dans le dossier Applications, puis activez cette option."
  de: "Bewege Claude Companion zuerst in den Ordner „Programme“ und schalte es dann ein."
  es: "Primero mueve Claude Companion a la carpeta Aplicaciones y luego actívalo."
  pt-BR: "Primeiro mova o Claude Companion para a pasta Aplicativos e depois ative esta opção."
  ru: "Сначала переместите Claude Companion в папку «Программы», затем включите эту функцию."
  it: "Sposta prima Claude Companion nella cartella Applicazioni, poi attiva questa opzione."
  nl: "Verplaats Claude Companion eerst naar de map Programma’s en zet dit daarna aan."
  pl: "Najpierw przenieś Claude Companion do folderu Programy, a potem włącz tę opcję."
  tr: "Önce Claude Companion’ı Uygulamalar klasörüne taşıyın, sonra bunu açın."
  uk: "Спершу перемістіть Claude Companion до папки «Програми», а потім увімкніть це."
  sv: "Flytta först Claude Companion till mappen Program och slå sedan på detta."
  da: "Flyt først Claude Companion til mappen Programmer, og slå derefter dette til."
  nb: "Flytt først Claude Companion til Programmer-mappen, og slå deretter dette på."
  fi: "Siirrä ensin Claude Companion Ohjelmat-kansioon ja kytke tämä sitten päälle."
  cs: "Nejprve přesuňte Claude Companion do složky Aplikace a potom to zapněte."
  hu: "Előbb helyezd át a Claude Companiont az Alkalmazások mappába, aztán kapcsold be."
  ro: "Mută mai întâi Claude Companion în dosarul Applications, apoi pornește această opțiune."
  el: "Μετακινήστε πρώτα το Claude Companion στον φάκελο Εφαρμογές και μετά ενεργοποιήστε το."
  id: "Pindahkan Claude Companion ke folder Applications terlebih dahulu, lalu aktifkan ini."
  vi: "Hãy chuyển Claude Companion vào thư mục Applications trước, rồi bật mục này."
  th: "ย้าย Claude Companion ไปไว้ในโฟลเดอร์ Applications ก่อน แล้วจึงเปิดตัวเลือกนี้"
  hi: "पहले Claude Companion को Applications फ़ोल्डर में ले जाएँ, फिर इसे चालू करें।"
"background.legacy":
  en: "An older version is running. Turn on to update it."
  zh-CN: "正在运行旧版本，打开开关即可更新。"
  zh-TW: "正在執行舊版本，開啟開關即可更新。"
  ja: "古いバージョンが動作しています。オンにすると更新されます。"
