"switch.nothing_saved":
  en: "Sign in to this account once in Claude first."
  zh-CN: "请先在 Claude 里登录一次这个账号。"
  zh-TW: "請先在 Claude 裡登入一次這個帳號。"
  ja: "まず Claude でこのアカウントに一度サインインしてください。"
  ko: "먼저 Claude에서 이 계정으로 한 번 로그인하세요."
  fr: "Connectez-vous d’abord une fois à ce compte dans Claude."
  de: "Melde dich zuerst einmal in Claude bei diesem Konto an."
  es: "Primero inicia sesión una vez en esta cuenta en Claude."
  pt-BR: "Primeiro entre uma vez nesta conta no Claude."
  ru: "Сначала один раз войдите в этот аккаунт в Claude."
  it: "Prima accedi una volta a questo account in Claude."
  nl: "Meld je eerst één keer in Claude aan bij dit account."
  pl: "Najpierw zaloguj się raz na to konto w Claude."
  tr: "Önce Claude’da bu hesapla bir kez oturum açın."
  uk: "Спершу один раз увійдіть у Claude з цим обліковим записом."
  sv: "Logga först in i Claude med det här kontot en gång."
  da: "Log først ind i Claude med denne konto én gang."
  nb: "Logg først inn i Claude med denne kontoen én gang."
  fi: "Kirjaudu ensin kerran Claudessa tällä tilillä."
  cs: "Nejprve se jednou přihlaste tímto účtem v Claude."
  hu: "Előbb jelentkezz be egyszer a Claude-ban ezzel a fiókkal."
  ro: "Autentifică-te mai întâi o dată în Claude cu acest cont."
  el: "Συνδεθείτε πρώτα μία φορά στο Claude με αυτόν τον λογαριασμό."
  id: "Masuk ke Claude dengan akun ini satu kali terlebih dahulu."
  vi: "Hãy đăng nhập Claude bằng tài khoản này một lần trước."
  th: "ลงชื่อเข้าใช้ Claude ด้วยบัญชีนี้หนึ่งครั้งก่อน"
  hi: "पहले Claude में इस खाते से एक बार साइन इन करें।"
"switch.still_open":
  en: "Claude didn’t quit, so nothing changed. Try again once it’s done."
  zh-CN: "Claude 没有退出，所以什么都没改。等它处理完再试一次。"
  zh-TW: "Claude 沒有結束，所以什麼都沒改。等它處理完再試一次。"
  ja: "Claude が終了しなかったため、何も変更していません。処理が終わってからもう一度お試しください。"
  ko: "Claude가 종료되지 않아 아무것도 바꾸지 않았습니다. 작업이 끝난 뒤 다시 시도하세요."
  fr: "Claude ne s’est pas fermé, donc rien n’a changé. Réessayez quand il aura fini."
  de: "Claude wurde nicht beendet, daher wurde nichts geändert. Versuche es erneut, wenn es fertig ist."
  es: "Claude no se cerró, así que no se cambió nada. Vuelve a intentarlo cuando termine."
  pt-BR: "O Claude não fechou, então nada mudou. Tente de novo quando ele terminar."
  ru: "Claude не закрылся, поэтому ничего не изменилось. Попробуйте снова, когда он закончит."
  it: "Claude non è uscito, quindi nulla è cambiato. Riprova quando ha finito."
  nl: "Claude is niet afgesloten, dus er is niets gewijzigd. Probeer het opnieuw als het klaar is."
  pl: "Claude się nie zamknął, więc nic się nie zmieniło. Spróbuj ponownie, gdy skończy."
  tr: "Claude kapanmadı, bu yüzden hiçbir şey değişmedi. Bitince yeniden deneyin."
  uk: "Claude не закрився, тож нічого не змінено. Повторіть, коли він завершить."
  sv: "Claude avslutades inte, så inget ändrades. Försök igen när det är klart."
  da: "Claude lukkede ikke, så intet blev ændret. Prøv igen, når det er færdigt."
  nb: "Claude ble ikke avsluttet, så ingenting ble endret. Prøv igjen når det er ferdig."
  fi: "Claude ei sulkeutunut, joten mitään ei muutettu. Yritä uudelleen, kun se on valmis."
  cs: "Claude se neukončil, takže se nic nezměnilo. Zkuste to znovu, až skončí."
  hu: "A Claude nem lépett ki, ezért semmi sem változott. Próbáld újra, ha végzett."
  ro: "Claude nu s-a închis, așa că nu s-a schimbat nimic. Încearcă din nou când termină."
  el: "Το Claude δεν έκλεισε, γι' αυτό δεν άλλαξε τίποτα. Δοκιμάστε ξανά όταν τελειώσει."
  id: "Claude tidak keluar, jadi tidak ada yang diubah. Coba lagi setelah selesai."
  vi: "Claude chưa thoát, nên không có gì thay đổi. Hãy thử lại khi nó xong."
  th: "Claude ไม่ได้ปิด จึงไม่มีการเปลี่ยนแปลงใด ๆ ลองอีกครั้งเมื่อเสร็จ"
  hi: "Claude बंद नहीं हुआ, इसलिए कुछ नहीं बदला। उसके पूरा होने पर फिर कोशिश करें।"
"switch.updating":
  en: "Claude is updating. Try again in a minute."
  zh-CN: "Claude 正在更新，请过一分钟再试。"
  zh-TW: "Claude 正在更新，請過一分鐘再試。"
  ja: "Claude をアップデート中です。1 分ほどしてからお試しください。"
  ko: "Claude를 업데이트하는 중입니다. 1분 뒤에 다시 시도하세요."
  fr: "Claude se met à jour. Réessayez dans une minute."
