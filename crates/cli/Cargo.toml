[package]
name = "claude-companion"
description = "Keep Claude Desktop's local sessions identical across all your accounts (command line)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
default-run = "claude-companion"

[[bin]]
name = "claude-companion"
path = "src/main.rs"

# The background agent. Identical to `claude-companion watch`, but built without a console window
# on Windows so nothing flashes at login.
[[bin]]
name = "claude-companion-agent"
path = "src/agent.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
claude-companion-core.workspace = true
